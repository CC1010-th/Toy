<!--
  风控决策平台 · 独立原型（2026-11-18 起从「后台原型」拆出，不再挂在体育报表的系统切换里）
  依据：《风控决策平台系统基础架构业务功能需求说明书 V1.0》2026-11-13
  - 版本三（2026-11-20 重构因子目录）：变量中心下「因子管理」「因子查值」两个菜单。因子管理：清单 + 下钻的详情、新增/编辑、批量导入；口径勾选只做记录，SQL 语句手填。
    锚点 #<页面>[/<子页>]，如 #factor-query、#factor-query/detail/<编码>、#factor-query/new、#factor-value、#role-permission。
    旧链接 #risk-platform/<页面> 仍可打开。
  - 因子目录、系统管理两个可交互页面直接写在本文件里（下方 mount_factor、mount_sysmgmt），不再用 iframe。
    每个页面的样式只在自己的根元素（#pg-factor、#pg-sysmgmt）里生效。
  - 右上角小地球切换「风控决策平台」和「权限管理」两个系统；权限管理（资源、角色、用户、日志）照搬 UAT 权限系统后台，用 mount_sysmgmt。
  - 其余页面是结构占位，配置在下方 RP。
  - 因子数据按实际数据更新时间更新，平台内不做跑批、重跑和包管理。
-->

function onDetailFoot(e,f){const b=e.target.closest('[data-dr]');if(!b)return;const k=b.dataset.dr;
 if(k==='close')return backToList();if(k==='edit'){S.edit.form=null;return go('list/edit/'+f.code)}
 if(k==='ok'||k==='no')return startDec(f,k);
 if(k==='decCancel')return openDetail(f);
 if(k==='decOk')return finishDec(f);
 act(k,f)}
/* 内嵌处理：通过 / 发布 / 驳回在详情底部填写，确认后留在详情 */
function startDec(f,k){const st=f.state,box=$('decBox');if(!box)return;S.dec=k;
 const T={'待风控审核':['风控审核','审核意见（选填）','如：口径与报表一致','通过'],'待研发审核':['研发审核','备注/工单号（选填）','如 RD-1088；研发审核时填写，发布前可修改','通过'],'待研发发布':['发布','备注/工单号','研发审核时填写，发布前可修改','发布']}[st];if(!T)return;
 const val=k==='ok'&&st==='待研发发布'?(f.dev||{}).note||'':'';
 box.hidden=false;box.innerHTML=`<h4>${k==='no'?'驳回':T[0]}</h4><div class="fld"><label>${k==='no'?'驳回原因（必填）':T[1]}</label><textarea class="desc-in" id="decTxt" placeholder="${k==='no'?'写明驳回原因，退回编辑人修改':T[2]}">${esc(val)}</textarea></div>${k==='ok'&&st==='待研发发布'?'<div class="hint">发布后从下一次数据更新（11-21）起生效，历史结果不回改。</div>':''}`;
 $('drF').innerHTML=`<button class="btn" type="button" data-dr="decCancel">取消</button><span class="dr-f-sp"></span><button class="btn ${k==='no'?'danger':'primary'}" type="button" data-dr="decOk">${k==='no'?'确认驳回':'确认'+T[3]}</button>`;
 box.scrollIntoView({block:'end',behavior:'smooth'});$('decTxt').focus()}
function finishDec(f){const k=S.dec,st=f.state,t=$('decTxt').value.trim();
 if(!can(st==='待风控审核'?'review':st==='待研发审核'?'dev':'publish')||(st==='待风控审核'&&!isReviewer(f))){toast(DENIED,1);return openDetail(f)}
 if(k==='no'){if(!t){toast('请填写驳回原因',1);$('decTxt').focus();return}doAct('reject',f,t);toast('已驳回，退回编辑人修改')}
 else if(st==='待风控审核'){doAct('rvOk',f,t);toast('审核通过，进入待研发审核')}
 else if(st==='待研发审核'){doAct('devOk',f,t);toast('研发审核通过，进入待研发发布')}
 else if(st==='待研发发布'){setNote(f,t);doAct('publish',f,'');toast('已发布 '+f.ver+'，进入运行中')}
 if(stateOk(f))openDetail(f);else{backToList();toast('已处理；该因子的新状态不在你的查看范围内')}}
function drawDTab(f){const t=S.dtab,box=$('dBody');if(!box)return;
 if(t==='flow'){const rows=f.flow.slice().reverse();box.innerHTML=rows.length?`<table class="t"><thead><tr><th>时间</th><th>操作人</th><th>状态变化</th><th>意见 / 备注</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td style="white-space:normal">${esc(r[3])}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无记录</div>';return}
 if(t==='ver'){box.innerHTML=`<div class="hint" style="margin:0 0 8px">SQL 或口径勾选变化升主版本，须重新审核；名称、主题分类与类别、业务归属、说明变化升次版本，即时生效。</div><table class="t"><thead><tr><th>版本</th><th>日期</th><th>类型</th><th>变更内容</th><th>操作人</th></tr></thead><tbody>${f.versions.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}版本</td><td style="white-space:normal">${esc(v[3])}</td><td>${esc(v[4])}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">还没有发布过</td></tr>'}</tbody></table>`;return}
}

/* ---------- 审核 / 研发审核 / 发布：看完内容直接做决定 ---------- */
function openFlow(f){const st=f.state;
 const K={'待风控审核':{t:'风控审核',lab:'审核意见',ph:'通过时选填；驳回时必填，写明原因',ok:'通过',okAct:'rvOk',hint:'通过后进入「待研发审核」，由研发评估、开发。'},
  '待研发审核':{t:'研发审核',lab:'备注/工单号',ph:'通过时可填工单号，如 RD-1088；驳回时必填，写明原因',ok:'通过',okAct:'devOk',hint:'确认 SQL 引用的来源字段存在，已按需求单完成开发、测试，并配置好调度任务。通过后进入「待研发发布」。'},
  '待研发发布':{t:'发布',lab:'发布说明',ph:'发布时选填；驳回时必填，写明原因',ok:'发布',okAct:'publish',hint:'发布后从下一次数据更新（11-21）起生效，历史结果不回改。'}}[st];
 if(!K)return;
 const self=st==='待风控审核'&&S.role===f.editor,canDo=st==='待风控审核'?isReviewer(f):st==='待研发审核'?can('dev'):can('publish');
 const sub=f.flow.slice().reverse().find(r=>/→ 待风控审核/.test(r[2]));const chg=changeList(f);
 const head=[['因子',`<span class="cpy" data-copy="${esc(f.name)}" data-copy-lab="因子名称" title="点击复制">${esc(f.name)}</span> <span class="mono muted cpy" data-copy="${f.code}" data-copy-lab="因子编码" title="点击复制">${f.code}</span>`],['版本',f.ver+(f.pubVer&&!isLive(f)?` <span class="muted">（运行中 ${f.pubVer}，本次发布后替换）</span>`:' <span class="muted">（新因子）</span>')],['提交',sub?`${esc(sub[1])} · ${sub[0]}`:'—'],...(f.review?[['风控审核',`${esc(f.review.by)} · ${f.review.at} 通过${f.review.why?'：'+esc(f.review.why):''}`]]:[]),...(f.dev?[['研发审核',`${esc(f.dev.by)} · ${f.dev.at} 通过${f.dev.note?'：'+esc(f.dev.note):''}`]]:[])];
 const body=`${self?`<div class="notice">这是你提交的因子，审核人不能是编辑人，需由其他有审核权限的人审核。如需修改，可以撤回。</div>`:''}
  <div class="dr-sec"><h4>${K.t}</h4>${kvTbl(head)}</div>
  ${chg?`<div class="dr-sec"><h4>本次变更 <span class="muted" style="font-weight:400">${f.pubVer} → ${f.ver}</span></h4>${chg.length?`<ul class="chg diff">${chg.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<div class="muted">与运行中版本相同</div>'}</div>`:''}
  <details class="dr-sec dr-fold"${chg&&chg.length?'':' open'}><summary>口径勾选</summary>${cfgView(f)}</details>
  <details class="dr-sec dr-fold" open><summary>SQL 语句${copyBtn}</summary>${sqlBlock(f)}</details>
  <details class="dr-sec dr-fold"${f.desc?' open':''}><summary>因子说明</summary><div style="line-height:1.8">${esc(f.desc)||'<span class="muted">未填写</span>'}</div></details>
  ${self?'':`<div class="dr-sec">${st==='待研发发布'?`<div class="fld"><label>备注/工单号</label><input class="inp" id="flNote" style="width:100%" value="${esc((f.dev||{}).note||'')}" placeholder="研发审核时填写，发布前可修改，如 RD-1088"${canDo?'':' disabled'}></div>`:''}<div class="fld"><label>${K.lab}</label><textarea class="desc-in" id="flTxt" placeholder="${esc(K.ph)}"${canDo?'':' disabled'}>${st==='待研发发布'||!f.dev?'':''}</textarea></div><div class="hint">${K.hint}</div></div>`}`;
 const foot=self?`<button class="btn" type="button" data-fl="close">关闭</button>${canEdit()?'<button class="btn" type="button" data-fl="withdraw">撤回</button>':''}`
  :`<button class="btn" type="button" data-fl="close">取消</button><button class="btn danger-ghost" type="button" data-fl="reject"${canDo?'':' disabled'}>驳回</button><button class="btn primary" type="button" data-fl="ok"${canDo?'':' disabled'}>${K.ok}</button>`;
 openDrawer(`${K.t} · ${esc(f.name)} ${stateTag(f.state)}`,body,foot,960);bindCopy(f);
 $('drF').onclick=e=>{const b=e.target.closest('[data-fl]');if(!b||b.disabled)return;const a=b.dataset.fl,t=($('flTxt')||{}).value?$('flTxt').value.trim():'';
  if(a==='close')return backToList();
  if(a==='withdraw'){f.state='草稿';f.review=null;f.dev=null;log(f,'待风控审核 → 草稿','撤回');backToList();return toast('已撤回为草稿')}
  if(!can(st==='待风控审核'?'review':st==='待研发审核'?'dev':'publish')){toast(DENIED,1);return}
  if(a==='reject'){if(!t){toast('驳回时请填写原因',1);$('flTxt').focus();return}doAct('reject',f,t);backToList();return toast('已驳回，退回编辑人修改')}
  if(st==='待研发发布'&&$('flNote'))setNote(f,$('flNote').value.trim());
  doAct(K.okAct,f,t);backToList();toast({rvOk:'审核通过，进入待研发审核',devOk:'研发审核通过，进入待研发发布',publish:'已发布 '+f.ver+'，进入运行中'}[K.okAct])};
 report()}

/* ---------- 流程操作（详情页按钮、清单「操作」列共用；弹窗确认） ---------- */
function act(a,f){
 const done=m=>{toast(m);if(/detail\//.test(__h)&&stateOk(f)&&F(f.code))openDetail(f);else route()};
 if(a==='edit'){S.edit.form=null;return go('list/edit/'+f.code)}
 if(a==='value'){if(!S.checked.has(f.code)){if(S.checked.size>=10){toast('最多勾选 10 个因子',1);return}S.checked.add(f.code)}return go('value')}
 if(a==='submit'){const from=f.state;openModal('提交审核',`提交 <b>${esc(f.name)}</b> ${f.ver}，进入风控审核？`,[['取消'],['提交','primary',()=>{f.state='待风控审核';f.editor=S.role;f.review=null;f.dev=null;f.rej=null;log(f,from+' → 待风控审核','提交审核（'+f.ver+'）');done('已提交，等待风控审核')}]]);return}
 if(a==='withdraw'){openModal('撤回 · '+f.name,`撤回 <b>${esc(f.name)}</b> ${f.ver}，回到草稿，可以继续修改。`,[['取消'],['撤回','primary',()=>{f.state='草稿';f.review=null;f.dev=null;log(f,'待风控审核 → 草稿','撤回');done('已撤回为草稿')}]]);return}
 if(a==='rvOk'){openModal('风控审核 · 通过',`<div class="fld"><label>审核意见</label><input class="inp" id="mWhy" style="width:100%" placeholder="选填"></div><div class="hint">通过后进入「待研发审核」，由研发评估、开发。</div>`,[['取消'],['通过','primary',()=>{const w=$('mWhy').value.trim();f.review={ok:true,by:S.role,at:NOW(),why:w};f.state='待研发审核';log(f,'待风控审核 → 待研发审核','审核通过'+(w?'：'+w:''));done('审核通过，等待研发审核')}]]);return}
 if(a==='devOk'||a==='devNote'){const d=f.dev||{};openModal(a==='devOk'?'研发审核 · 通过':'修改备注/工单号',`${a==='devOk'?'<div class="hint" style="margin:0 0 10px">确认已按需求单完成开发、测试，并配置好调度任务。通过后进入「待研发发布」。</div>':''}<div class="fld"><label>备注/工单号（选填）</label><input class="inp" id="mNote" style="width:100%" value="${esc(d.note||'')}" placeholder="如 RD-1088"></div>`,[['取消'],[a==='devOk'?'通过':'保存','primary',()=>{const n=$('mNote').value.trim();
   if(a==='devOk'){f.dev={by:S.role,at:NOW(),note:n};f.state='待研发发布';log(f,'待研发审核 → 待研发发布','研发审核通过'+(n?'；备注/工单号：'+n:''));done('研发审核通过，上线后发布')}
   else{if(n===(d.note||'')){toast('没有修改');return false}f.dev.note=n;log(f,'待研发发布 · 修改备注/工单号',n||'清空备注/工单号');done('备注/工单号已更新')}}]]);return}
 if(a==='reject'){openModal('驳回',`<div class="fld"><label>驳回原因（必填）</label><input class="inp" id="mWhy" style="width:100%"></div><div class="hint">驳回后退回编辑人修改，重新提交后从风控审核开始。</div>`,[['取消'],['驳回','primary',()=>{const w=$('mWhy').value.trim();if(!w){toast('请填写驳回原因',1);return false}const from=f.state;f.state='已驳回';f.rej={step:from==='待风控审核'?'review':from==='待研发审核'?'dev':'pub',by:S.role,at:NOW(),why:w};if(from==='待风控审核')f.review=null;if(from!=='待研发发布')f.dev=null;log(f,from+' → 已驳回','驳回：'+w);done('已驳回，退回编辑人修改')}]]);return}
 if(a==='publish'){openModal('发布 '+f.ver,`确认发布 <span class="mono">${f.code}</span> ${f.ver}？<div class="fld" style="margin-top:12px"><label>备注/工单号</label><input class="inp" id="mNote" style="width:100%" value="${esc((f.dev||{}).note||'')}" placeholder="如 RD-1088"></div><div class="hint">发布后从下一次数据更新（11-21）起生效，历史结果不回改。</div>`,[['取消'],['发布','primary',()=>{setNote(f,$('mNote').value.trim());const old=f.pubVer,at='2026-'+NOW();const chg=old?[...attrDiff(f.pubAttrs||f,f).map(d=>`${d[0]} ${d[1]} → ${d[2]}`),...cfgDiff(f.pubCfg,f.cfg).map(d=>`${d[0]} ${d[1]} → ${d[2]}`),...(f.pubSql.trim()!==f.sql.trim()?['SQL 修改']:[])].join('；'):'新因子首次发布';f.versions.unshift([f.ver,NOW().slice(0,5),'主',chg||'口径调整',S.role]);f.pubVer=f.ver;f.pubAttrs=attrsOf(f);f.pubCfgRec=f.cfgRec;f.pubCfg=clone(f.cfg);f.pubSql=f.sql;f.hist[f.ver]=clone(f.cfg);f.state='运行中';f.pubAt=at;f.pubBy=S.role;f.rej=null;log(f,'待研发发布 → 运行中','发布，11-21 起生效');done('已发布 '+f.ver+'，进入运行中')}]]);return}
 if(a==='stop'){openModal('停用因子 · '+f.name,`<div class="hint" style="margin:0 0 10px">停用后停止计算，因子查值中显示「不适用」；可以随时重新启用。</div><div class="fld"><label>停用原因（必填）</label><input class="inp" id="mWhy" style="width:100%"></div>`,[['取消'],['停用','primary',()=>{const w=$('mWhy').value.trim();if(!w){toast('请填写停用原因',1);return false}f.state='已停用';f.stopReason=w;log(f,'运行中 → 已停用',w);S.checked.delete(f.code);done('已停用')}]]);return}
 if(a==='enable'){openModal('重新启用 · '+f.name,`恢复运行 ${f.pubVer}，从下一次数据更新起重新计算。`,[['取消'],['启用','primary',()=>{f.state='运行中';log(f,'已停用 → 运行中','重新启用');done('已重新启用')}]]);return}
 if(a==='discard'){const nv=f.ver,ov=f.pubVer;openModal('放弃新版本',`放弃 <span class="mono">${f.code}</span> ${nv}？放弃后恢复为运行中的 ${ov}，${nv} 的修改内容不保留。`,[['取消'],['放弃','primary',()=>{const from=f.state;
  Object.assign(f,{cfg:clone(f.pubCfg),sql:f.pubSql,ver:ov,state:'运行中',review:null,dev:null,rej:null,cfgRec:f.pubCfgRec});if(f.pubAttrs)Object.assign(f,{name:f.pubAttrs.name,owners:[...f.pubAttrs.owners],theme:f.pubAttrs.theme,cat:f.pubAttrs.cat,desc:f.pubAttrs.desc});
  log(f,from+' '+nv+' → 运行中 '+ov,'放弃新版本 '+nv);S.edit.form=null;toast('已放弃 '+nv+'，恢复为运行中的 '+ov);go('list/detail/'+f.code)}]]);return}
 if(a==='del'){openModal('删除草稿',`确认删除草稿 <span class="mono">${f.code}</span>？删除后不可恢复。`,[['取消'],['删除','primary',()=>{FACTORS=FACTORS.filter(x=>x!==f);S.checked.delete(f.code);toast('草稿已删除');go('list')}]]);return}}
function log(f,stateTxt,why){f.flow.push([NOW(),S.role,stateTxt,why])}
/* 备注/工单号：研发审核时填写，发布前可修改；有变化才记流转 */
function setNote(f,n){const d=f.dev||(f.dev={by:'',at:'',note:''});if((d.note||'')===n)return false;d.note=n;log(f,'待研发发布 · 修改备注/工单号',n||'清空备注/工单号');return true}
function nextMajor(v){return 'v'+(parseInt(v.slice(1))+1)+'.0'}
function nextMinor(v){const [a,b]=v.slice(1).split('.');return 'v'+a+'.'+(parseInt(b)+1)}

/* =====================================================================
   新增 / 编辑（二级页面）：属性 → 口径勾选（只做记录）→ 粘贴 SQL；底部操作栏
   ===================================================================== */
function newForm(f){if(!f)return {codeAuto:true,name:'',code:'',owners:['风控'],theme:'投注行为-足球单关',cat:'货量',desc:'',cfg:C({tables:[],fields:[]}),sql:''};  /* 新增因子：来源表、字段默认为空 */return {name:f.name,code:f.code,owners:[...f.owners],theme:f.theme,cat:f.cat,desc:f.desc,cfg:clone(f.cfg),sql:f.sql,noWin:f.noWin}}
function renderEdit(f){
 if(f&&!canEditF(f)){toast(canEdit()?`「${f.state}」状态不能编辑`:noPerm('save'),1);return go('list/detail/'+f.code)}
 if(!f&&!canEdit()){toast(noPerm('save'),1);return backToList()}
 const key=f?f.code:'__new';if(!S.edit.form||S.edit.form._for!==key){S.edit.form=newForm(f);S.edit.form._for=key}
 const form=S.edit.form,live=f&&f.state==='运行中';
 const body=(live?`<div class="notice">修改 SQL 或口径勾选，会生成新版本 ${nextMajor(f.pubVer)} 草稿并重新走审核，期间 ${f.pubVer} 继续运行；只改名称、主题分类与类别、业务归属、说明，升次版本，保存即生效。</div>`:f&&f.pubVer?`<div class="notice">正在编辑新版本 ${f.ver}，${f.pubVer} 继续运行；本次修改（包括名称、主题分类与类别、业务归属、说明）随 ${f.ver} 发布后生效。</div>`:'')
 +`<div id="eWarn"></div>
 <div class="dr-sec"><h4>因子属性</h4><div id="attrBox"></div></div>
 <div class="dr-sec"><h4>口径勾选 <span class="muted" style="font-weight:400;font-size:12px">按八步勾选记录口径，便于审核和查询；不自动生成 SQL</span></h4><div id="cfgBox"></div></div>
 <div class="dr-sec"><h4>SQL 语句<i style="color:#df5962;font-style:normal">*</i> <span class="muted" style="font-weight:400;font-size:12px">填写完整的 SQL 语句，提交后由研发评估，并按此开发、上线</span></h4>
  <textarea class="sql-in" id="eSql" spellcheck="false" placeholder="粘贴或填写 SQL 语句">${esc(form.sql)}</textarea></div>

function updateChrome(){const st=sysState['risk-platform'];
 app.querySelectorAll('.sys-menu li').forEach(li=>{const b=li.querySelector(':scope>[data-sys-go]');if(b)li.classList.toggle('selected',b.dataset.sysGo.split('/').pop()===st.key)});
 app.querySelectorAll('.sys-menu li.sub').forEach(li=>{const b=li.querySelector(':scope>[data-sys-toggle]');li.classList.toggle('has-sel',!!b&&menuPath(SYS[curSys()].menu,st.key).includes(b.dataset.sysToggle.split('|')[1]))});document.getElementById('sysTitle').textContent=RP[st.key].name;document.getElementById('sysCrumb').innerHTML=crumbHtml();document.title=RP[st.key].name+' · '+SYS[curSys()].name}
const APP_ROOT={factor:'pg-factor',sysmgmt:'pg-sysmgmt',dict:'pg-dict'},APP_CLASS={"factor": "", "sysmgmt": "", "dict": ""};
const APP_KIND={factor:{list:'factor-query',value:'factor-value',_:'factor-query'},sysmgmt:{resource:'resource-manage',dept:'dept-manage',user:'user-manage',role:'role-permission',log:'audit-log',_:'resource-manage'},dict:{list:'data-dict',_:'data-dict'}};
const MOUNT={factor:mount_factor,sysmgmt:mount_sysmgmt,dict:mount_dict};
let mounted=null;// {app, api}
function localHash(){const st=sysState['risk-platform'],p=RP[st.key];return p.kind+(st.sub?'/'+st.sub:'')}
function unmountApp(){if(mounted){try{mounted.api.unmount()}catch(err){}mounted=null}}
/* 页面应用内部改了地址 → 入口页同步菜单、标题和锚点 */
function onAppNav(app,h){let kind,rest;try{h=decodeURIComponent(h)}catch(err){}[kind,...rest]=h.split('/');const map=APP_KIND[app];
 const st=sysState['risk-platform'],k=map[kind]||map._,sub=map[kind]?rest.join('/'):'';const changed=st.key!==k||st.sub!==sub;st.key=k;st.sub=sub;if(changed)updateChrome();
 currentRoute=routeOf();history.replaceState(null,'','#'+currentRoute);refreshDir()}
function render(){const sid=curSys(),S=SYS[sid],st=ST,p=RP[st.key];
 for(const g of menuPath(S.menu,st.key))S.open.add(g);
 if(p.app&&mounted&&mounted.app===p.app&&document.getElementById(APP_ROOT[p.app])){updateChrome();mounted.api.nav(localHash());return}
 unmountApp();
 const body=p.app?`<div id="${APP_ROOT[p.app]}" class="${APP_CLASS[p.app]}"></div>`:rpBody(st.key,st.sub);
 app.innerHTML=`<section class="sys-shell" data-sys="${sid}"><aside class="sys-sider"><div class="sys-brand"><span class="sys-brandmark">${navIco(S.mark,22)}</span><span>${S.name}<div class="sys-brandsub">${S.en}</div></span></div><ul class="sys-menu">${menuHtml(sid,S.menu,1)}</ul><div class="sys-siderfoot"><button class="sys-demo" type="button" data-demo-btn>原型演示设置 · <span>${PERM_DB.demo.role}</span></button></div></aside>${demoPopHtml()}<section class="sys-main"><header class="sys-header"><div class="sys-crumb" id="sysCrumb"></div><div class="sys-account"><span class="avatar" id="sysAv">${PERM_DB.demo.role.slice(0,2).toUpperCase()}</span><span id="sysAcc">${PERM_DB.demo.role}</span>${switchHtml(sid)}</div></header><main class="sys-content" id="sysContent"><div class="sys-pagehead"${p.app==='factor'?' hidden':''}><h1 id="sysTitle"></h1></div><div class="sys-body${p.app?' is-app':''}">${body}</div></main></section></section>`;
 updateChrome();const sel=app.querySelector('.sys-menu li.selected');if(sel)requestAnimationFrame(()=>sel.scrollIntoView({block:'nearest'}));
 if(p.app){const a=p.app;mounted={app:a,api:null};mounted.api=MOUNT[a](document.getElementById(APP_ROOT[a]),localHash(),h=>onAppNav(a,h))}}

/* ---- 路由：#<页面>[/<子页>]；兼容旧锚点 #risk-platform/<页面> ---- */
let currentRoute='';
const routeOf=()=>{const st=sysState['risk-platform'];return st.key+(st.sub?'/'+st.sub:'')};
/* 原型演示设置：样式沿用菜单结构原型（侧栏底部按钮 + 浮层） */
const DEMO_IDS=[['系统管理员','demo_user_04'],['风控产品经理','demo_user_05'],['风控分析','demo_user_02'],['研发审核员','dev_zhang'],['跑批巡检员','demo_user_08'],['同步巡检员','sync_he'],['告警查看员','yy_chen']];
function demoPopHtml(){const d=PERM_DB.demo;return `<div class="sys-demo-pop" id="sysDemoPop" role="dialog" aria-label="原型演示设置"><h3>演示身份</h3><div class="sys-demo-list">${DEMO_IDS.map(([n,acc])=>`<button class="sys-opt${acc===d.role?' on':''}" type="button" data-demo-user="${acc}"><span>${n}<em>${acc}</em></span><span>${acc===d.role?'✓':''}</span></button>`).join('')}</div><h3>结算表 11-10 数据</h3>${[[true,'未更新（输出检查未通过）'],[false,'已更新']].map(([v,l])=>`<button class="sys-opt${d.lag===v?' on':''}" type="button" data-demo-lag="${v?1:0}"><span>${l}</span><span>${d.lag===v?'✓':''}</span></button>`).join('')}<p class="sys-demo-note">切换身份后，菜单、按钮和能看到的数据按该身份在「权限管理 › 角色管理 › 权限设置」中的授权显示。</p></div>`}
function demoApply(){unmountApp();render()}
function switchHtml(sid){return `<div class="system-switch" id="systemSwitch"><button class="system-switch-btn" type="button" data-sys-switch title="切换系统" aria-label="切换系统"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3C9.6 5.5 8.4 8.5 8.4 12s1.2 6.5 3.6 9"/></svg></button><div class="system-menu" role="menu">${Object.entries(SYS).map(([id,x])=>`<button class="system-option${id===sid?' active':''}" type="button" data-sys-pick="${id}" role="menuitem"${id==='perm'&&!PM_MENU.some(pageAllowed)?' disabled title="当前用户没有权限管理系统的权限"':''}><span>${x.name}</span><span class="system-check">✓</span></button>`).join('')}</div></div>`}
function activate(key){try{key=decodeURIComponent(key||'')}catch(err){}key=(key||'').replace(/^#/,'').replace(/^(risk-platform|perm)\/?/,'');
 const [k,...rest]=key.split('/');const st=sysState['risk-platform'];
 if(k&&RP[k]){st.key=k;st.sub=rest.join('/')}else if(k){showToast('没有这个页面：'+k)}
 LAST[curSys()]=st.key;render();currentRoute=routeOf();history.replaceState(null,'','#'+currentRoute);refreshDir()}
addEventListener('hashchange',()=>{if(location.hash.slice(1)!==currentRoute)activate(location.hash.slice(1))});

app.addEventListener('click',e=>{
 const db=e.target.closest('[data-demo-btn]');if(db){document.getElementById('sysDemoPop').classList.toggle('show');return}
 const du=e.target.closest('[data-demo-user]');if(du){PERM_DB.demo.role=du.dataset.demoUser;if(!pageAllowed(ST.key)){const alt=firstAllowed();if(alt){ST.key=alt;ST.sub=''}}demoApply();currentRoute=routeOf();history.replaceState(null,'','#'+currentRoute);showToast('已切换为 '+((DEMO_IDS.find(x=>x[1]===PERM_DB.demo.role)||[PERM_DB.demo.role])[0]));return}
 const dl=e.target.closest('[data-demo-lag]');if(dl){PERM_DB.demo.lag=dl.dataset.demoLag==='1';demoApply();return}
 const sw=e.target.closest('[data-sys-switch]');if(sw){sw.parentElement.classList.toggle('open');return}
 const pk=e.target.closest('[data-sys-pick]');if(pk&&pk.disabled)return;if(pk){const id=pk.dataset.sysPick;if(id!==curSys())activate(LAST[id]);else pk.closest('.system-switch').classList.remove('open');return}
 const tg=e.target.closest('[data-sys-toggle]');if(tg){const n=tg.dataset.sysToggle.split('|')[1];const o=SYS[curSys()].open;o.has(n)?o.delete(n):o.add(n);tg.parentElement.classList.toggle('open',o.has(n));return}
 const go=e.target.closest('[data-sys-go]');if(go){activate(go.dataset.sysGo);return}});

/* ---- 页面目录（锚点清单 + 复制链接） ---- */
document.addEventListener('click',e=>{const w=document.getElementById('systemSwitch');if(w&&!w.contains(e.target))w.classList.remove('open');const p=document.getElementById('sysDemoPop');if(p&&!p.contains(e.target)&&!e.target.closest('[data-demo-btn]'))p.classList.remove('show')});
const PAGES=Object.entries(RP).filter(([k,p])=>!p.hidden).flatMap(([k,p])=>{const sy=SYS[curSys(k)],path=[sy.name,...menuPath(sy.menu,k)].join(' / ');return[[path,p.name+(p.app?'':'（占位）'),k],...(p.tabs||[]).slice(1).map(t=>[path+' / '+p.name,t[1],k+'/'+t[0],1])]});
document.body.insertAdjacentHTML('beforeend',`<button id="protoDirBtn" class="proto-dir-btn" title="页面目录（锚点）" aria-label="页面目录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button><div id="protoDirMask" class="proto-dir-mask"><aside class="proto-dir" role="dialog" aria-label="页面目录"><div class="proto-dir-head"><h3>页面目录</h3><span style="font-size:12px;color:#7a869b">共 <b id="protoDirCount"></b> 个锚点</span><button class="proto-dir-close" id="protoDirClose" aria-label="关闭">×</button></div><div class="proto-dir-cur">当前页面锚点：<code id="protoDirCur"></code> <button class="proto-copy" id="protoDirCopyCur" type="button">复制链接</button></div><input class="proto-dir-search" id="protoDirSearch" placeholder="搜索页面名称、路径或锚点"><div class="proto-dir-body" id="protoDirBody"></div></aside></div>`);
const dirBtn=document.getElementById('protoDirBtn'),dirMask=document.getElementById('protoDirMask'),dirBody=document.getElementById('protoDirBody'),dirSearch=document.getElementById('protoDirSearch');
dirBtn.style.right='24px';
const pageLink=a=>location.href.split('#')[0]+'#'+a;
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(err){const i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove()}showToast('链接已复制')}
function drawDir(){const q=dirSearch.value.trim().toLowerCase(),cur=currentRoute;
 const rows=PAGES.filter(r=>!q||(r[0]+' '+r[1]+' '+r[2]).toLowerCase().includes(q));
 dirBody.innerHTML=rows.map(r=>`<div class="proto-dir-row${r[2]===cur?' current':''}" data-dir-go="${r[2]}"><div class="m"><div class="n">${r[1]}${r[3]?'<span class="sub">子页面</span>':''}</div><div class="p">${r[0]}</div><code>#${r[2]}</code></div><button class="proto-copy" type="button" data-dir-copy="${r[2]}">复制链接</button></div>`).join('')||'<div style="padding:24px 0;color:#a1aab9">没有匹配的页面</div>';
 document.getElementById('protoDirCount').textContent=PAGES.length;document.getElementById('protoDirCur').textContent='#'+cur}
function refreshDir(){if(dirMask.classList.contains('open'))drawDir()}
dirBtn.onclick=e=>{e.stopPropagation();dirSearch.value='';drawDir();dirMask.classList.add('open');dirBtn.classList.add('open');dirSearch.focus()};
function closeDir(){dirMask.classList.remove('open');dirBtn.classList.remove('open')}
document.getElementById('protoDirClose').onclick=closeDir;dirMask.onclick=e=>{if(e.target===dirMask)closeDir()};dirSearch.oninput=drawDir;
document.getElementById('protoDirCopyCur').onclick=()=>copyText(pageLink(currentRoute));
dirBody.onclick=e=>{const c=e.target.closest('[data-dir-copy]');if(c){e.stopPropagation();copyText(pageLink(c.dataset.dirCopy));return}const g=e.target.closest('[data-dir-go]');if(g){closeDir();activate(g.dataset.dirGo)}};
addEventListener('keydown',e=>{if(e.key==='Escape')closeDir()});
window.activate=activate;
/* 搜索框清除：清空并触发 input，焦点留在框内 */
document.addEventListener('click',e=>{const x=e.target.closest('.kw-x');if(!x)return;e.preventDefault();e.stopPropagation();const i=x.parentElement.querySelector('input');i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));const n=i.id&&document.getElementById(i.id);(n||i).focus()},true);
/* 下拉框是否处于「未选择」：第一个选项值为空且当前选中它 */
function markSel(){document.querySelectorAll('#app select.sel').forEach(x=>x.classList.toggle('is-empty',x.value===''&&x.options.length>0&&x.options[0].value===''))}
document.addEventListener('change',e=>{if(e.target.matches&&e.target.matches('select.sel'))markSel()},true);
new MutationObserver(()=>markSel()).observe(document.getElementById('app'),{childList:true,subtree:true});
window.__menuRefresh=()=>{const av=document.getElementById('sysAv'),ac=document.getElementById('sysAcc');if(av)av.textContent=PERM_DB.demo.role.slice(0,2).toUpperCase();if(ac)ac.textContent=PERM_DB.demo.role;const ul=app.querySelector('.sys-menu');if(ul&&curSys()==='risk-platform')ul.innerHTML=menuHtml('risk-platform',SYS['risk-platform'].menu,1);if(!pageAllowed(ST.key)){const alt=Object.keys(MENU_RES).find(pageAllowed);if(alt)activate(alt)}};
activate(location.hash.slice(1)||'factor-query');
})();
</script>
</body></html>
