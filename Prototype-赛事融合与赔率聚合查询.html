<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赛事信息查询</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#444;font:14px/1.5 "Microsoft YaHei",Arial}button,input,select{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}aside{width:210px;flex-shrink:0;background:#263445;color:#c8d0da}.brand{padding:18px 22px;background:#1f2b39;font-size:18px;color:white}.group{padding:22px 22px 10px;color:#93a4b8}.nav{display:block;width:100%;border:0;background:transparent;text-align:left;color:inherit;padding:13px 30px}.nav.active{background:#1890ff;color:#fff}main{flex:1;min-width:0}.top{height:57px;background:white;border-bottom:1px solid #eee;padding:18px 24px}.page{margin:16px;background:#fff;border:1px solid #e6e6e6}h1{margin:0;padding:14px 22px;border-bottom:1px solid #eee;font-size:16px;font-weight:500}.filters{padding:20px 22px;border-bottom:1px solid #eee}.grid{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px 22px}.field{display:flex;align-items:center;min-width:0}.field label{width:112px;flex-shrink:0;text-align:right;margin-right:10px}.field input,.field select{width:100%;min-width:0;height:32px;border:1px solid #ddd;border-radius:2px;padding:4px 9px;background:#fff;color:#555}.field input:focus{outline:1px solid #1890ff}.actions{margin:16px 0 0 122px;display:flex;gap:8px}.btn{height:32px;border:1px solid #d9d9d9;padding:0 16px;background:white;border-radius:2px;color:#555}.primary{background:#1890ff;border-color:#1890ff;color:white}.caption{padding:12px 22px;display:flex;justify-content:space-between;color:#888;font-size:12px}.wrap{overflow:auto;margin:0 22px 20px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px 12px;border:1px solid #e8e8e8;text-align:center;font-weight:400}th{background:#fafafa;color:#555;font-weight:600}tbody tr:hover{background:#f0f8ff}.node{text-align:left;min-width:290px}.toggle{height:19px;width:19px;margin-right:9px;padding:0;background:white;border:1px solid #91caff;color:#1890ff;border-radius:2px;line-height:16px}.sub td{background:#fafcff;padding:14px 20px}.sub table{font-size:13px;background:white}.sub th,.sub td{padding:9px 11px;background:white}.sub th{background:#f5f7fa}.foot{padding:0 22px 18px;color:#888;font-size:12px}.muted{font-size:12px;color:#999}.empty{text-align:center;padding:40px;color:#999}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(240px,1fr))}aside{width:170px}}
.range-field{grid-column:span 2}.range-control{display:flex;align-items:center;flex:1;min-width:0;height:36px;border:1px solid #d9d9d9;border-radius:2px;background:#fff;padding:0 18px;gap:14px}.range-control:focus-within{border-color:#1890ff;box-shadow:0 0 0 2px #1890ff15}.range-control input{border:0!important;outline:0!important;box-shadow:none!important;text-align:center;padding:0;height:32px;flex:1;width:0;color:#888;background:transparent}.range-control span{color:#999}.node-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}.node-inner .toggle{margin:0 0 0 auto;flex-shrink:0}@media(max-width:750px){.range-field{grid-column:1/-1}}
</style></head><body>
<div class="layout"><aside><div class="brand">风控报表</div><div class="group">风控管理台</div><div class="group">赛事信息</div><button class="nav active" data-page="event">赛事事件融合查询</button><button class="nav" data-page="odds">赔率聚合查询</button></aside>
<main><div class="top">风控报表 / 赛事信息 / <span id="crumb">赛事事件融合查询</span></div><section class="page"><h1 id="heading">赛事事件融合查询</h1><form id="filters" class="filters"><div class="grid" id="fields"></div><div class="actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="reset">重置</button></div></form><div class="caption"><span id="description"></span><span>模拟数据 · 仅演示足球</span></div><div id="result" class="wrap"></div><div id="count" class="foot"></div></section></main></div>
<script>
const events=[
{standardMatchId:'88001001',sportId:'1',dataSourceCode:'S01',thirdMatchSourceId:'sr:match:90121',thirdEventId:'SR-E10001',eventCode:'GOAL',eventTime:'2026-11-06 20:34:12',matchPeriodId:'1',secondsFromStart:1395,homeAway:'home',t1:1,t2:0,canceled:0,copyLinkId:'LK-S01-001',sourceType:'0',thirdTeamId:'SR-T101',player1Name:'球员甲',player2Name:'',extraInfo:'',addition5:'0'},
{standardMatchId:'88001001',sportId:'1',dataSourceCode:'G01',thirdMatchSourceId:'bg-776521',thirdEventId:'BG-E83005',eventCode:'GOAL',eventTime:'2026-11-06 20:34:18',matchPeriodId:'1',secondsFromStart:1398,homeAway:'home',t1:1,t2:0,canceled:0,copyLinkId:'LK-G01-002',sourceType:'0',thirdTeamId:'BG-T201',player1Name:'球员甲',player2Name:'',extraInfo:'',addition5:'0'},
{standardMatchId:'88001001',sportId:'1',dataSourceCode:'R01',thirdMatchSourceId:'rb-552190',thirdEventId:'RB-E42106',eventCode:'GOAL',eventTime:'2026-11-06 20:34:23',matchPeriodId:'1',secondsFromStart:1401,homeAway:'home',t1:1,t2:0,canceled:0,copyLinkId:'LK-R01-003',sourceType:'1',thirdTeamId:'RB-T301',player1Name:'球员甲',player2Name:'',extraInfo:'',addition5:'0'},
{standardMatchId:'88001001',sportId:'1',dataSourceCode:'S01',thirdMatchSourceId:'sr:match:90121',thirdEventId:'SR-E10008',eventCode:'YELLOW_CARD',eventTime:'2026-11-06 20:48:41',matchPeriodId:'1',secondsFromStart:2262,homeAway:'away',t1:0,t2:1,canceled:0,copyLinkId:'LK-S01-008',sourceType:'0',thirdTeamId:'SR-T102',player1Name:'球员乙',player2Name:'',extraInfo:'',addition5:'0'},
{standardMatchId:'88001002',sportId:'1',dataSourceCode:'G01',thirdMatchSourceId:'bg-776590',thirdEventId:'BG-E83120',eventCode:'RED_CARD',eventTime:'2026-11-06 22:15:06',matchPeriodId:'2',secondsFromStart:4084,homeAway:'home',t1:1,t2:0,canceled:1,copyLinkId:'LK-G01-120',sourceType:'0',thirdTeamId:'BG-T205',player1Name:'球员丙',player2Name:'',extraInfo:'',addition5:'0'}
];
function source(code,value,time,n){return {dataSourceCode:code,oddsValue:value,originalOddsValue:value-100,aoOddsValue:value/10000,modifyTime:'2026-11-06 '+time,thirdTempletSourceId:code+'-T-'+n,linkId:'OD-'+code+'-'+n}}
const categories=[
{id:'310001',standardMatchId:'88001001',sportId:'1',standardMarketCategoryId:'101',name:'全场独赢',dataSources:['G01','L01'],modifyTime:'2026-11-06 20:30:12',createTime:'2026-11-06 20:30:00',linkId:'AG-C-001',slots:[
{id:'410001',categoryId:'310001',standardMarketId:'201',marketCategoryId:'101',oddsName:'1X2',oddsValue:'',thirdMarketSourceIds:['BG-M001','LS-M001'],createTime:'2026-11-06 20:30:01',linkId:'AG-M-001',groups:[
{id:'510001',marketSlotId:'410001',standardMarketOddsId:'301',standardMarketId:'201',name:'主胜',oddsType:'1',createTime:'2026-11-06 20:30:02',linkId:'AG-O-001',sourceOdds:[source('G01',18200,'20:30:10','001'),source('L01',18400,'20:30:12','002')]},
{id:'510002',marketSlotId:'410001',standardMarketOddsId:'302',standardMarketId:'201',name:'和局',oddsType:'X',createTime:'2026-11-06 20:30:02',linkId:'AG-O-002',sourceOdds:[source('G01',34500,'20:30:10','003')]},
{id:'510003',marketSlotId:'410001',standardMarketOddsId:'303',standardMarketId:'201',name:'客胜',oddsType:'2',createTime:'2026-11-06 20:30:02',linkId:'AG-O-003',sourceOdds:[source('G01',42000,'20:30:10','004')]}]}]},
{id:'310002',standardMatchId:'88001001',sportId:'1',standardMarketCategoryId:'102',name:'全场大小',dataSources:['G01','L01'],modifyTime:'2026-11-06 20:31:27',createTime:'2026-11-06 20:31:00',linkId:'AG-C-002',slots:[
{id:'410002',categoryId:'310002',standardMarketId:'202',marketCategoryId:'102',oddsName:'全场大小',oddsValue:'2.5',thirdMarketSourceIds:['BG-M002','LS-M002'],createTime:'2026-11-06 20:31:01',linkId:'AG-M-002',groups:[
{id:'510004',marketSlotId:'410002',standardMarketOddsId:'304',standardMarketId:'202',name:'大',oddsType:'Over',createTime:'2026-11-06 20:31:02',linkId:'AG-O-004',sourceOdds:[source('G01',19100,'20:31:25','005'),source('L01',19300,'20:31:27','006')]},
{id:'510005',marketSlotId:'410002',standardMarketOddsId:'305',standardMarketId:'202',name:'小',oddsType:'Under',createTime:'2026-11-06 20:31:02',linkId:'AG-O-005',sourceOdds:[source('G01',18900,'20:31:25','007')]}]}]}
];
const eventFields=[['standardMatchId','标准赛事ID'],['thirdMatchSourceId','三方赛事ID'],['dataSourceCode','数据源'],['eventCode','事件编码'],['matchPeriodId','赛事阶段ID'],['thirdEventId','三方事件ID'],['copyLinkId','链路ID'],['from','事件发生时间起'],['to','事件发生时间止']];
const oddsFields=[['standardMatchId','标准赛事ID'],['standardMarketCategoryId','标准玩法ID'],['standardMarketId','标准盘口ID'],['standardMarketOddsId','标准投注项ID'],['thirdMarketSourceId','三方盘口ID'],['dataSourceCode','数据源'],['from','玩法修改时间起'],['to','玩法修改时间止']];
let current='event',applied={},openNodes=new Set();
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function values(){return Object.fromEntries(new FormData($('filters')))}
function match(v,q){return !q||String(v)===q.trim()}
function timeMatch(v,q){const start=q.from?(q.from.length===10?q.from+' 00:00:00':q.from.replace('T',' ')):'';const end=q.to?(q.to.length===10?q.to+' 23:59:59':q.to.replace('T',' ')+':59'):'';return (!start||v>=start)&&(!end||v<=end)}
function eventRows(q){return events.filter(e=>eventFields.every(([k])=>k==='from'||k==='to'||match(e[k],q[k]))&&timeMatch(e.eventTime,q))}
function oddsRows(q){return categories.filter(c=>match(c.standardMatchId,q.standardMatchId)&&match(c.standardMarketCategoryId,q.standardMarketCategoryId)&&timeMatch(c.modifyTime,q)).map(c=>({...c,slots:c.slots.filter(p=>match(p.standardMarketId,q.standardMarketId)&&(!q.thirdMarketSourceId||p.thirdMarketSourceIds.includes(q.thirdMarketSourceId.trim()))).map(p=>({...p,groups:p.groups.filter(g=>match(g.standardMarketOddsId,q.standardMarketOddsId)).map(g=>({...g,sourceOdds:g.sourceOdds.filter(s=>match(s.dataSourceCode,q.dataSourceCode))})).filter(g=>g.sourceOdds.length)})).filter(p=>p.groups.length)})).filter(c=>c.slots.length)}
function table(headers,rows){return '<table><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'}
function cells(a){return a.map(x=>'<td>'+esc(x)+'</td>').join('')}
function renderEvents(){const rows=eventRows(applied);$('result').innerHTML=table(['标准赛事ID','赛种ID','数据源','三方赛事ID','三方事件ID','事件编码','事件发生时间','赛事阶段ID','比赛进行时长（秒）','主客场','主队数量','客队数量','是否取消','链路ID','来源类型','三方球队ID','球员1','球员2','扩展信息','异常标记 addition5'],rows.map(e=>'<tr>'+cells([e.standardMatchId,e.sportId,e.dataSourceCode,e.thirdMatchSourceId,e.thirdEventId,e.eventCode,e.eventTime,e.matchPeriodId,e.secondsFromStart,e.homeAway,e.t1,e.t2,e.canceled===1?'是':'否',e.copyLinkId,e.sourceType,e.thirdTeamId,e.player1Name||'—',e.player2Name||'—',e.extraInfo||'—',e.addition5])+'</tr>').join(''));$('count').textContent='共 '+rows.length+' 条事件记录';if(!rows.length)$('result').innerHTML='<div class="empty">没有找到匹配的记录</div>'}
function node(id,name,depth){return '<td class="node" style="padding-left:'+(12+depth*24)+'px"><div class="node-inner"><span>'+esc(name)+'</span><button type="button" class="toggle" aria-label="'+(openNodes.has(id)?'收起':'展开')+esc(name)+'" aria-expanded="'+openNodes.has(id)+'" data-node="'+id+'">'+(openNodes.has(id)?'−':'+')+'</button></div></td>'}
function renderOdds(){const data=oddsRows(applied);let rows='';const matches=[...new Set(data.map(c=>c.standardMatchId))];for(const mid of matches){const key='m'+mid;rows+='<tr>'+node(key,'标准赛事 '+mid,0)+cells(['—',mid,'—','—','—','—','—'])+'</tr>';if(!openNodes.has(key))continue;for(const c of data.filter(x=>x.standardMatchId===mid)){const ck='c'+c.id;rows+='<tr>'+node(ck,'玩法：'+c.name,1)+cells([c.id,c.standardMarketCategoryId,c.dataSources.join('、'),'—',c.modifyTime,c.createTime,c.linkId])+'</tr>';if(!openNodes.has(ck))continue;for(const p of c.slots){const pk='p'+p.id;rows+='<tr>'+node(pk,'盘口：'+p.oddsName+(p.oddsValue?' '+p.oddsValue:''),2)+cells([p.id,p.standardMarketId,'—',p.thirdMarketSourceIds.join('、'),'—',p.createTime,p.linkId])+'</tr>';if(!openNodes.has(pk))continue;for(const g of p.groups){const gk='g'+g.id;rows+='<tr>'+node(gk,'投注项：'+g.name+'（'+g.oddsType+'）',3)+cells([g.id,g.standardMarketOddsId,'—','—','—',g.createTime,g.linkId])+'</tr>';if(openNodes.has(gk))rows+='<tr class="sub"><td colspan="8">'+table(['数据源','当前赔率','原始赔率','AO赔率','源赔率时间','三方投注项模板ID','来源链路ID'],g.sourceOdds.map(s=>'<tr>'+cells([s.dataSourceCode,(s.oddsValue/10000).toFixed(4),(s.originalOddsValue/10000).toFixed(4),s.aoOddsValue,s.modifyTime,s.thirdTempletSourceId,s.linkId])+'</tr>').join(''))+'</td></tr>'}}}}
$('result').innerHTML=rows?table(['层级／名称','实例ID','标准ID','玩法数据源列表','三方盘口ID列表','玩法聚合修改时间','创建／入库时间','聚合下发链路ID'],rows):'<div class="empty">没有找到匹配的记录</div>';$('count').textContent='共 '+matches.length+' 场赛事，'+data.length+' 个玩法（当前查询结果）';}
function render(){current==='event'?renderEvents():renderOdds()}
function navigate(page){current=page;applied={};openNodes.clear();location.hash=page;const title=page==='event'?'赛事事件融合查询':'赔率聚合查询';$('heading').textContent=$('crumb').textContent=title;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const fields=page==='event'?eventFields:oddsFields;$('fields').innerHTML=fields.filter(([k])=>k!=='from'&&k!=='to').map(([k,label])=>'<div class="field"><label for="'+k+'">'+label+'</label>'+(k==='dataSourceCode'?'<select id="'+k+'" name="'+k+'"><option value="">全部</option>'+(page==='event'?['S01','G01','R01']:['G01','L01']).map(x=>'<option>'+x+'</option>').join('')+'</select>':'<input id="'+k+'" name="'+k+'" placeholder="请输入'+label+'">')+'</div>').join('')+'<div class="field range-field"><label id="rangeLabel">'+(page==='event'?'事件发生时间':'玩法修改时间')+'</label><div class="range-control" role="group" aria-labelledby="rangeLabel"><input type="date" id="from" name="from" aria-label="开始日期"><span aria-hidden="true">~</span><input type="date" id="to" name="to" aria-label="结束日期"></div></div>';$('description').textContent=page==='event'?'一行一条事件记录；横向滚动查看字段':'标准赛事 → 玩法 → 盘口 → 投注项 → 来源赔率；默认全部收起';render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('filters').onsubmit=e=>{e.preventDefault();const q=values();if(q.from&&q.to&&q.from>q.to){$('to').setCustomValidity('结束时间不能早于开始时间');$('to').reportValidity();return}applied=q;openNodes.clear();render()};$('filters').oninput=()=>{if($('to'))$('to').setCustomValidity('')};$('filters').onreset=()=>{applied={};openNodes.clear();render()};$('result').onclick=e=>{const b=e.target.closest('[data-node]');if(!b)return;const k=b.dataset.node;openNodes.has(k)?openNodes.delete(k):openNodes.add(k);renderOdds()};navigate(location.hash==='#odds'?'odds':'event');
</script></body></html>
