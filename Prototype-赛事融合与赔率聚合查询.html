 L.querySelector('.layer-body').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;const k=b.dataset.g;openGroups.has(k)?openGroups.delete(k):openGroups.add(k);const el=L.querySelector('.layer-body'),st=el.scrollTop,sl=el.scrollLeft;el.innerHTML=groupBody();el.scrollTop=st;el.scrollLeft=sl};
 L.querySelector('.setwin').onclick=e=>{const a=e.target.closest('button')?.dataset.act;if(a==='close')$('layerRoot').innerHTML='';if(a==='min')L.classList.toggle('min');
  if(a==='max'){L.classList.remove('min');if(saved){Object.assign(L.style,saved);saved=null}else{saved={left:L.style.left,top:L.style.top,width:L.style.width,height:L.style.height};Object.assign(L.style,{left:'0px',top:'0px',width:innerWidth+'px',height:innerHeight+'px'})}}};
 $('ltitle').onmousedown=e=>{if(L.classList.contains('min'))return;const ox=e.clientX-L.offsetLeft,oy=e.clientY-L.offsetTop;const mv=m=>{L.style.left=(m.clientX-ox)+'px';L.style.top=Math.max(0,m.clientY-oy)+'px'};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',()=>document.removeEventListener('mousemove',mv),{once:true})}}
function render(){$('layerRoot').innerHTML='';current==='event'?renderEvents():renderOdds()}
function navigate(page){current=page;applied={};location.hash=page;const title=page==='event'?'赛事事件融合查询':'赔率聚合查询';$('heading').textContent=$('crumb').textContent=title;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));const fields=page==='event'?eventFields:oddsFields;$('fields').innerHTML=fields.filter(([k])=>k!=='from'&&k!=='to').map(([k,label])=>'<div class="field"><label for="'+k+'">'+label+'</label>'+(k==='dataSourceCode'?'<select id="'+k+'" name="'+k+'"><option value="">全部</option>'+(page==='event'?['S01','G01','R01']:['G01','L01','N02']).map(x=>'<option>'+x+'</option>').join('')+'</select>':'<input id="'+k+'" name="'+k+'" placeholder="请输入'+label+'">')+'</div>').join('')+'<div class="field range-field"><label id="rangeLabel">'+(page==='event'?'事件发生时间':'玩法修改时间')+'</label><div class="range-control" role="group" aria-labelledby="rangeLabel"><input type="date" id="from" name="from" aria-label="开始日期"><span aria-hidden="true">~</span><input type="date" id="to" name="to" aria-label="结束日期"></div></div>';$('description').textContent=page==='event'?'一行一条事件记录；横向滚动查看字段':'一行一个盘口；点击“投注项列表”查看该盘口的投注项，展开多源赔率列表';render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('filters').onsubmit=e=>{e.preventDefault();const q=values();if(q.from&&q.to&&q.from>q.to){$('to').setCustomValidity('结束时间不能早于开始时间');$('to').reportValidity();return}applied=q;render()};$('filters').oninput=()=>{if($('to'))$('to').setCustomValidity('')};$('filters').onreset=()=>{applied={};render()};$('result').onclick=e=>{const a=e.target.closest('[data-open]');if(!a)return;e.preventDefault();openLayer(a.dataset.open)};navigate(location.hash==='#odds'?'odds':'event');
</script></body></html>
