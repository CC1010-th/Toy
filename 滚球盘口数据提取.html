 $('miList').innerHTML=list.slice((idxPage-1)*size,idxPage*size).map(m=>'<tr data-mid="'+m.id+'"><td class="mid">'+m.id+'</td><td>'+dateTxt(m.date)+' '+m.time+'</td><td>'+m.level+'级</td><td>'+esc(m.leagueName)+'</td><td><b>'+esc(m.home)+'</b></td><td><b>'+esc(m.away)+'</b></td><td class="num">'+m.fmt+' 分钟</td><td>'+m.result+(m.ot?' <span class="badge tiny">含加时</span>':'')+'</td><td class="num">'+lineTxt(m.total)+'</td><td class="num">'+lineTxt(m.hcap)+'</td><td class="act"><button class="btn-icon text-button" data-mid="'+m.id+'"><svg class="icon"><use href="#i-eye"/></svg>查看</button></td></tr>').join('')||'<tr><td colspan="11" class="empty"><strong>'+(resultMatches.length?'没有匹配的赛事':'当前条件下没有赛事')+'</strong><span>请调整查询条件后重试。</span></td></tr>';
 $('idxPageText').textContent=idxPage+' / '+pages+' · 共 '+fmt(list.length)+' 场';$('idxPrev').disabled=idxPage===1;$('idxNext').disabled=idxPage===pages;
}
function selectMatch(id){selMatch=id||null;if(selMatch){selMarket='total';selPeriod='FT';selMinDev='0';selMinOdds='0'}page=1;renderView();const d=document.querySelector('.detail-shell');if(d)d.scrollTop=0}
function renderMatchBar(){
 if(!inMatch())return;const m=matchMap.get(selMatch);TLMAP=TLMAP||tlMap();
 const cnt=(mk,pd)=>{const tl=TLMAP.get(m.id+'|'+mk+'|'+pd);return tl?tl.rows.length:0};

 $('mbMeta').textContent=m.leagueName+' · '+m.level+'级 · '+dateTxt(m.date)+' '+m.time+' UTC+8 · 赛制 '+m.fmt+' 分钟 · 赛果 '+m.result+(m.ot?'（含加时）':'')+' · '+m.id+' · 当前初盘 '+lineTxt(curTl.B);
 $('segMarket').innerHTML=Object.entries(MARKETS).map(([k,x])=>'<button data-mk="'+k+'" aria-pressed="'+(k===selMarket)+'">'+x.name+'<span>'+cnt(k,selPeriod)+'</span></button>').join('');
 $('segPeriod').innerHTML=PERIOD_ORDER.map(pd=>'<button data-pd="'+pd+'" aria-pressed="'+(pd===selPeriod)+'">'+PERIODS[pd]+'<span>'+cnt(selMarket,pd)+'</span></button>').join('');
 $('singleMinDev').value=selMinDev;$('singleMinOdds').value=selMinOdds;
 const total=curTl?curTl.rows.length:0,filtered=curTl?curTl.rows.filter(r=>rowPass(r)).length:0;
 $('singleFilterResult').textContent=filtered===total?'共 '+fmt(total)+' 行':'筛选后 '+fmt(filtered)+' / 共 '+fmt(total)+' 行';
 $('btnClearSingleFilters').disabled=selMinDev==='0'&&selMinOdds==='0';
}
function colsFor(market){
 const mk=MARKETS[market];
 return [
  {g:'raw',label:'剩余时间',v:r=>esc(r.raw)},{g:'raw',label:'当下得分',v:r=>r.hs+'-'+r.as,c:'比分'},{g:'raw',label:mk.p1,num:1,v:r=>myTxt(r.m1),c:'赔率'},{g:'raw',label:'当下盘口',num:1,v:r=>lineTxt(r.line)+swMark(r),c:'盘口'},{g:'raw',label:mk.p2,num:1,v:r=>myTxt(r.m2),c:'赔率'},
  {g:'calc',label:'剩余分钟',num:1,v:r=>r.D.toFixed(2)},{g:'calc',label:mk.a,num:1,v:r=>r.A},{g:'calc',label:'理论盘口',num:1,v:r=>r.P.toFixed(2)},{g:'calc',label:'盘口分差',num:1,v:r=>sInt(r.dev)},{g:'calc',label:'赔率变动（低赔方）',num:1,v:r=>r.oddsChg===null?'—':sOdds(r.oddsChg)+'<span class="side">'+sideName(r)+'</span>'}];
}
const GROUP_META={match:['赛事信息','',''],raw:['盘口原始数据','',''],calc:['计算字段','g-calc','']};
let COLS=colsFor('total');
function renderHead(){
 const mkt=viewMarket();COLS=colsFor(mkt);const groups=[];COLS.forEach(c=>{const g=groups[groups.length-1];if(g&&g.g===c.g)g.n++;else groups.push({g:c.g,n:1})});
 $('detailHead').innerHTML='<tr><th class="stick s1 num" rowspan="2" style="top:0;z-index:7">编号</th><th class="stick s2" rowspan="2" style="top:0;z-index:7">事件时间</th>'+groups.map(g=>{const [name,tint]=GROUP_META[g.g];return '<th colspan="'+g.n+'" class="gs '+tint+'">'+name+'</th>'}).join('')+'</tr><tr>'+COLS.map((c,i)=>{const [,tint]=GROUP_META[c.g];return '<th class="'+[tint,c.num?'num':'',i===0||COLS[i-1].g!==c.g?'gs':''].join(' ')+'">'+c.label+'</th>'}).join('')+'</tr>';
}
function renderTable(){
 const asc=viewRows(),noMap=new Map(asc.map((r,i)=>[r,i+1]));view=desc?[...asc].reverse():asc;
 const size=Number($('pageSize').value),pages=Math.max(1,Math.ceil(view.length/size));page=clamp(page,1,pages);
 const slice=view.slice((page-1)*size,page*size);
 let html='',last='';const span=COLS.length+2;
 slice.forEach((r,k)=>{
  const cls=['data',k>0&&r.tl.key!==last?'tl-start':''].join(' ');last=r.tl.key;
  html+='<tr class="'+cls+'" data-key="'+r.tl.key+'" data-i="'+r.i+'" title="点击查看该场走势"><td class="stick s1">'+noMap.get(r)+'</td><td class="stick s2">'+stamp(r.ts)+'</td>'+COLS.map((c,i)=>'<td class="'+[c.cls||'',c.num?'num':'',i===0||COLS[i-1].g!==c.g?'gs':'',c.c&&r.chg.includes(c.c)?'changed':''].join(' ')+'">'+c.v(r)+'</td>').join('')+'</tr>';
 });
 if(!slice.length)html='<tr><td colspan="'+span+'" class="empty"><strong>当前条件下没有盘口记录</strong><span>请调整玩法、时段或筛选条件。</span></td></tr>';
 $('detailBody').innerHTML=html;
 $('pageText').textContent=page+' / '+pages+' · 共 '+fmt(view.length)+' 行';$('btnPrev').disabled=page===1;$('btnNext').disabled=page===pages;
 $('sortBadge').textContent=desc?'按事件时间降序':'按事件时间升序';$('btnSort').querySelector('span').textContent=desc?'升序排列':'降序排列';
}

// ---------- trend drawer ----------
let trendKey=null,focusIndex=null;
let TLMAP={get:k=>tlByKey(k)};const tlMap=()=>TLMAP;
function resultTimelines(){TLMAP=TLMAP||tlMap();return PERIOD_ORDER.map(pd=>TLMAP.get(selMatch+'|'+selMarket+'|'+pd))}
function openTrend(key,fi=null){
 TLMAP=TLMAP||tlMap();const tl=TLMAP.get(key);if(!tl)return;trendKey=key;focusIndex=fi;const m=tl.m,rows=tl.rows,mk=MARKETS[tl.market];
 $('trendTitle').textContent=m.home+' vs '+m.away+' · '+PERIODS[tl.period]+mk.name;
 $('trendScope').textContent=m.id+' · '+m.leagueName+' · '+m.level+'级 · '+dateTxt(m.date)+' '+m.time+' UTC+8 · 初盘 '+lineTxt(tl.B)+' · 赛制 '+tl.C+' 分钟 · 赛果 '+m.result+(m.ot?'（含加时）':'');
 $('trendSummary').textContent='共 '+rows.length+' 个变化点';
 const picked=fi===null?null:rows[fi];
 $('trendPointSummary').classList.toggle('point-focus',!!picked);
 $('trendPointSummary').innerHTML=picked?'<b>选中时间点</b>　'+stamp(picked.ts)+'　·　'+esc(picked.raw)+'　·　比分 '+picked.hs+'-'+picked.as+'　·　当下盘口 <b>'+lineTxt(picked.line)+'</b>　·　理论盘口 '+picked.P.toFixed(2)+'　·　盘口分差 '+sInt(picked.dev)+'　·　赔率变动 '+(picked.oddsChg===null?'—':sOdds(picked.oddsChg)+'（'+sideName(picked)+'）'):'从单场盘口表格点击一行后，将在这里展示该时间点的完整计算摘要。';
 const list=resultTimelines(),idx=list.findIndex(t=>t.key===key);$('btnPrevTl').disabled=idx<=0;$('btnNextTl').disabled=idx<0||idx>=list.length-1;
 if(!$('trendDrawer').open)openDialog('trendDrawer');
 requestAnimationFrame(()=>renderChart());
}
function niceStep(span){const raw=span/5,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;return (n<1.5?1:n<3?2:n<7?5:10)*mag}
function renderChart(){
 TLMAP=TLMAP||tlMap();const tl=TLMAP.get(trendKey);if(!tl)return;const box=$('trendChart'),W=Math.max(320,box.clientWidth||900),H=Math.round(clamp(W*.27,220,300)),M={l:48,r:14,t:26,b:34},iw=W-M.l-M.r,ih=H-M.t-M.b,rows=tl.rows;
 const xMax=(tl.winEnd-tl.winStart)/60,ys=rows.flatMap(r=>[r.line,r.P]);let y0=Math.min(...ys),y1=Math.max(...ys);const pd=Math.max(1,(y1-y0)*.06);y0-=pd;y1+=pd;
 const step=niceStep(y1-y0),X=x=>M.l+x/xMax*iw,Y=y=>M.t+(1-(y-y0)/(y1-y0))*ih;
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc($('trendTitle').textContent)+' 当下盘口与理论盘口走势">';
 for(let v=Math.ceil(y0/step)*step;v<=y1;v+=step)s+='<line x1="'+M.l+'" x2="'+(W-M.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#edf1f6"/><text x="'+(M.l-8)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" font-size="10" fill="#8a99ad">'+(Math.round(v*10)/10)+'</text>';
 tl.periods.forEach((p,i)=>{const a=(p.s-tl.winStart)/60,b=(p.e-tl.winStart)/60;if(i>0)s+='<line x1="'+X(a)+'" x2="'+X(a)+'" y1="'+M.t+'" y2="'+(H-M.b)+'" stroke="#d9e2ee" stroke-dasharray="3 3"/>';s+='<text x="'+X((a+b)/2)+'" y="'+(M.t-10)+'" text-anchor="middle" font-size="10" fill="#8a99ad">'+p.cn+'</text>'});
 const tickStep=xMax>30?(tl.C===48?6:5):xMax>12?(tl.C===48?3:2.5):(tl.C===48?2:2);for(let v=0;v<=xMax+1e-6;v+=tickStep)s+='<text x="'+X(v)+'" y="'+(H-M.b+16)+'" text-anchor="middle" font-size="10" fill="#8a99ad">'+(Math.round(v*10)/10)+'′</text>';
 s+='<text x="'+(W-M.r)+'" y="'+(H-4)+'" text-anchor="end" font-size="10" fill="#a3afbf">比赛进程（分钟，自本时段开始）</text><line x1="'+M.l+'" x2="'+(W-M.r)+'" y1="'+(H-M.b)+'" y2="'+(H-M.b)+'" stroke="#d7e0eb"/>';
 s+='<polyline points="'+rows.map(r=>X(r.x)+','+Y(r.P)).join(' ')+'" fill="none" stroke="#6f7f95" stroke-width="1.5" stroke-dasharray="5 4"/>';
 let d='';rows.forEach((r,i)=>{d+=(i?'H'+X(r.x)+'V':'M'+X(r.x)+',')+Y(r.line)});d+='H'+X(rows[rows.length-1].x);
 s+='<path d="'+d+'" fill="none" stroke="#3068dc" stroke-width="2" stroke-linejoin="round"/>';
 if(focusIndex!==null&&rows[focusIndex]){const r=rows[focusIndex],fx=X(r.x),fy=Y(r.line),tx=fx>W-150?fx-10:fx+10,anchor=fx>W-150?'end':'start';s+='<rect x="'+(fx-6)+'" y="'+M.t+'" width="12" height="'+ih+'" fill="#e29a2d" fill-opacity=".12"/><line x1="'+fx+'" x2="'+fx+'" y1="'+M.t+'" y2="'+(H-M.b)+'" stroke="#c97d0b" stroke-width="2"/><circle cx="'+fx+'" cy="'+fy+'" r="10" fill="#fff" stroke="#c97d0b" stroke-width="3"/><circle cx="'+fx+'" cy="'+fy+'" r="4.5" fill="#e29a2d"/><rect x="'+(anchor==='start'?tx:tx-76)+'" y="'+(M.t+4)+'" width="76" height="22" rx="4" fill="#8b5708"/><text x="'+(anchor==='start'?tx+8:tx-8)+'" y="'+(M.t+19)+'" text-anchor="'+anchor+'" font-size="12" font-weight="600" fill="#fff">选中时间点</text>'}
 s+='<g id="hoverLayer" pointer-events="none"></g><rect x="'+M.l+'" y="'+M.t+'" width="'+iw+'" height="'+ih+'" fill="transparent" id="hitArea"/></svg>';
 const tip=$('chartTip');box.innerHTML=s;box.appendChild(tip);tip.hidden=true;
 const svg=box.querySelector('svg'),layer=box.querySelector('#hoverLayer');
 svg.querySelector('#hitArea').addEventListener('mousemove',e=>{
  const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)*W/rect.width,xv=(px-M.l)/iw*xMax;let best=rows[0];for(const r of rows){if(r.x<=xv+1e-9)best=r;else break}
  const r=best,cx=X(r.x);layer.innerHTML='<line x1="'+cx+'" x2="'+cx+'" y1="'+M.t+'" y2="'+(H-M.b)+'" stroke="#21334b" stroke-opacity=".25"/><circle cx="'+cx+'" cy="'+Y(r.line)+'" r="4.5" fill="#3068dc" stroke="#fff" stroke-width="2"/><circle cx="'+cx+'" cy="'+Y(r.P)+'" r="3.5" fill="#6f7f95" stroke="#fff" stroke-width="1.5"/>';
  const mk=MARKETS[tl.market];tip.innerHTML='<b>'+stamp(r.ts).slice(11)+'</b> <span>'+esc(r.raw)+'</span><br><span>比分</span> '+r.hs+'-'+r.as+'　<span>'+mk.a+'</span> '+r.A+'<br><span>当下盘口</span> <b>'+lineTxt(r.line)+'</b>　<span>理论</span> '+r.P.toFixed(2)+'<br><span>盘口分差</span> '+sInt(r.dev)+'<br><span>赔率（与明细一致）</span> '+myTxt(r.m1)+' / '+myTxt(r.m2)+(r.oddsDiff!==null?'<br><span>赔率变动（'+sideName(r)+'）</span> '+sOdds(r.oddsChg):'')+(r.lineSwitch?'<br><span>主盘口切换</span> '+lineTxt(r.prevLine)+' → '+lineTxt(r.line):'');
  tip.hidden=false;const scale=rect.width/W,tx=cx*scale+14,tw=tip.offsetWidth;tip.style.left=(tx+tw>rect.width?cx*scale-tw-14:tx)+'px';tip.style.top=(M.t*scale+4)+'px';
 });
 svg.querySelector('#hitArea').addEventListener('mouseleave',()=>{layer.innerHTML='';tip.hidden=true});
}

// ---------- dialogs, toast, events ----------
function openDialog(id){closeSelect();if(!$(id).open)$(id).showModal()}
function closeDialog(id){$(id).close()}
let toastTimer;function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>openSelect(b.dataset.type,b)));
let optionLimit=60;$('selectSearch').addEventListener('input',()=>{optionLimit=60;$('selectOptions').scrollTop=0;renderOptions()});$('btnLoadMore').addEventListener('click',()=>{optionLimit+=60;renderOptions()});$('btnSelectDone').addEventListener('click',()=>closeSelect(true));
$('fmt').addEventListener('change',e=>setFilter('fmt',e.target.value));
$('btnQuery').addEventListener('click',()=>runQuery());$('btnReset').addEventListener('click',()=>{draft=defaults();$('queryError').hidden=true;renderFilters();toast('赛事范围已重置，点击「查询赛事」应用')});
['dateStart','dateEnd'].forEach(id=>$(id).addEventListener('change',e=>{draft[id==='dateStart'?'start':'end']=e.target.value;renderFilters()}));

document.querySelectorAll('.th-sort').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.sort;idxSort=idxSort.key===k?{key:k,dir:-idxSort.dir}:{key:k,dir:k==='time'?1:-1};idxPage=1;renderIndex()}));
$('segMarket').addEventListener('click',e=>{const b=e.target.closest('[data-mk]');if(!b)return;selMarket=b.dataset.mk;page=1;renderView()});$('segPeriod').addEventListener('click',e=>{const b=e.target.closest('[data-pd]');if(!b)return;selPeriod=b.dataset.pd;page=1;renderView()});
$('singleMinDev').addEventListener('change',e=>{selMinDev=e.target.value;page=1;renderView()});$('singleMinOdds').addEventListener('change',e=>{selMinOdds=e.target.value;page=1;renderView()});
$('btnClearSingleFilters').addEventListener('click',()=>{selMinDev='0';selMinOdds='0';page=1;renderView()});
$('btnMbBack').addEventListener('click',()=>selectMatch(null));
$('btnMbTrend').addEventListener('click',()=>openTrend(selMatch+'|'+selMarket+'|'+selPeriod));
$('btnSort').addEventListener('click',()=>{desc=!desc;page=1;renderTable()});
$('pageSize').addEventListener('change',()=>{page=1;renderTable()});$('btnPrev').addEventListener('click',()=>{page--;renderTable()});$('btnNext').addEventListener('click',()=>{page++;renderTable()});

$('detailBody').addEventListener('click',e=>{const b=e.target.closest('[data-trend]');if(b){openTrend(b.dataset.trend);return}const tr=e.target.closest('tr.data');if(tr)openTrend(tr.dataset.key,Number(tr.dataset.i))});
$('btnPrevTl').addEventListener('click',()=>{const l=resultTimelines(),i=l.findIndex(t=>t.key===trendKey);if(i>0)openTrend(l[i-1].key)});
$('btnNextTl').addEventListener('click',()=>{const l=resultTimelines(),i=l.findIndex(t=>t.key===trendKey);if(i>=0&&i<l.length-1)openTrend(l[i+1].key)});
document.addEventListener('pointerdown',e=>{if(dropdown&&!$('selectPopup').contains(e.target)&&!dropdown.anchor.contains(e.target))closeSelect()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dropdown){e.preventDefault();closeSelect(true)}});
window.addEventListener('resize',()=>{closeSelect();if($('trendDrawer').open)renderChart()});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
window.Prototype={roundHalfAway,allowedDev,r2,tl:tlByKey,matches:MATCHES,sample:(A,B,C,D,L)=>{const P=Number((A+B*D/C).toFixed(6));return {P:P.toFixed(2),dev:roundHalfAway(L-P)}}};
renderFilters();
