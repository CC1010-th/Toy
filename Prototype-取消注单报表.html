<main class="page"><section class="card">
<section class="filter">
<div class="filter-grid">
 <div class="field"><label class="required">开赛日期</label><div class="date-range"><input id="start" class="input" type="date" value="2026-10-31"><span>~</span><input id="end" class="input" type="date" value="2026-11-06"></div></div>

</div>
</section>

</section>
<div class="table-wrap"><table><colgroup><col style="width:60px"><col style="width:300px"><col style="width:70px"><col style="width:160px"><col style="width:90px"><col style="width:90px"><col style="width:110px"><col style="width:110px"><col style="width:150px"><col style="width:160px"></colgroup><thead><tr><th>序号</th><th>联赛名称</th><th>赛种</th><th>开赛日期</th><th>取消笔数</th><th>取消人数</th><th>投注金额</th><th>挽回损失</th><th>操作人</th><th>操作时间</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="pager"><span id="pagerTotal">共 3 条记录</span><button class="page-btn" disabled>‹</button><button class="page-btn active">1</button><button class="page-btn" disabled>›</button><select class="select"><option>10 条/页</option><option selected>20 条/页</option><option>50 条/页</option><option>100 条/页</option></select></div>
</section></main>

<script>
const data=[
 {date:'2026-11-05',league:'英格兰超级联赛',level:'一级',sport:'足球',events:[
  {name:'曼彻斯特城 v 利物浦',short:'784216',long:'4588524123304741784216',start:'2026-11-05 20:30:00',orders:428,users:216,amount:1286400,loss:348920,operators:'cptest1/cptest2',time:'2026-11-05 23:42:18',reasons:[['1','疑似协议赛','全场大小/全场让球',168,92,'48.62','18.23','21:02:15 ~ 22:46:38','cptest1','2026-11-05 22:48:06',[['第1批','疑似协议赛','全场大小',80,45,'23.00','8.60','21:02:15 ~ 21:50:20','cptest1','2026-11-05 21:52:06'],['第2批','疑似协议赛','全场让球',88,47,'25.62','9.63','21:51:05 ~ 22:46:38','cptest1','2026-11-05 22:48:06']]],['2','异常投注','全场大小',260,124,'80.02','16.66','21:14:32 ~ 23:39:51','cptest2','2026-11-05 23:42:18']]},
  {name:'阿森纳 v 切尔西',short:'784230',long:'4588524123304741784230',start:'2026-11-05 19:45:00',orders:296,users:151,amount:886000,loss:129640,operators:'risk_amy',time:'2026-11-05 22:10:02',reasons:[['1','进球点注单','全场大小',96,61,'28.60','12.96','20:38:12 ~ 20:41:58','risk_amy','2026-11-05 20:43:11'],['2','赛事取消','全场让球',200,90,'60.00','-','19:52:06 ~ 22:06:43','risk_amy','2026-11-05 22:10:02']]}
 ]},
 {date:'2026-11-04',league:'NBA',level:'一级',sport:'篮球',events:[
  {name:'洛杉矶湖人 v 金州勇士',short:'772918',long:'5588524123304741772918',start:'2026-11-04 09:00:00',orders:372,users:208,amount:1124200,loss:246780,operators:'cptest2',time:'2026-11-04 13:18:44',reasons:[['1','异常投注','全场大小/全场让分',226,132,'68.40','24.68','10:02:09 ~ 12:55:32','cptest2','2026-11-04 13:18:44'],['2','赛事取消','半场大小',146,76,'44.02','-','09:48:20 ~ 10:31:08','cptest2','2026-11-04 10:35:16']]}
 ]},
 {date:'2026-11-03',league:'西班牙甲级联赛',level:'一级',sport:'足球',events:[
  {name:'巴塞罗那 v 塞维利亚',short:'768501',long:'4588524123304741768501',start:'2026-11-03 20:00:00',orders:318,users:174,amount:958600,loss:206430,operators:'cptest1',time:'2026-11-03 23:06:51',reasons:[['1','疑似协议赛','全场让球',138,88,'41.86','20.64','20:12:33 ~ 22:58:09','cptest1','2026-11-03 23:06:51'],['2','赛事取消','全场大小',180,86,'54.00','-','19:28:10 ~ 21:05:17','cptest1','2026-11-03 21:08:20']]}
 ]}
];
const body=document.getElementById('body'),toastEl=document.getElementById('toast');let dateOpen=new Set(),leagueOpen=new Set(),eventOpen=new Set(),batchOpen=new Set(),mainSort={field:null,dir:1},reasonSort=new Map();
function money(v){return (v/10000).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}function toastOk(t){toastEl.innerHTML='<span class="toast-ok">✓</span>';toastEl.append(t);toastEl.style.display='flex';clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.style.display='none',2000)}function toast(t){toastEl.textContent=t;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',1500)}
data.forEach(d=>d.events.forEach(e=>e.reasons.forEach(r=>{if(r[10]&&r[10].length>1)r[9]=r[10][0][9]})));
function totals(d){return d.events.reduce((a,e)=>({orders:a.orders+e.orders,users:a.users+e.users,amount:a.amount+e.amount,loss:a.loss+e.loss,time:a.time>e.time?a.time:e.time}),{orders:0,users:0,amount:0,loss:0,time:''})}
function sortMark(scope,field,key=''){const s=scope==='main'?mainSort:reasonSort.get(key);return s&&s.field===field?(s.dir===1?'▲':'▼'):'◆'}
function cell(v,i){return `<span class="${[3,4,5,6].includes(i)?'num':''}" title="${v}">${v}</span>`}
function renderReason(r,key,ri){const bk=`${key}-${ri}`,multi=r[10]&&r[10].length>1,open=multi&&batchOpen.has(bk),main=`<span class="c-toggle">${multi?`<button class="toggle" data-batch="${bk}">${open?'−':'+'}</button>`:''}</span>`+r.slice(0,10).map(cell).join('');const children=r[10]&&open?r[10].map(c=>`<span class="c-toggle child">↳</span>`+c.map((v,i)=>cell(v,i).replace('<span class="','<span class="child ')).join('')).join(''):'';return main+children}
function reasonHead(label){return `<span class="head">${label}</span>`}
function render(){let out='',groups=[...data];if(mainSort.field)groups.sort((a,b)=>{const av=mainSort.field==='date'?a.date:totals(a)[mainSort.field],bv=mainSort.field==='date'?b.date:totals(b)[mainSort.field];return(av>bv?1:av<bv?-1:0)*mainSort.dir});groups.forEach((d,di)=>{const t=totals(d),dk=d.date,lk=`${dk}-${d.league}`,dateShown=dateOpen.has(dk),leagueShown=leagueOpen.has(lk);out+=`<tr class="lvl-date"><td>${di+1}</td><td class="tree-cell"><div class="tree"><button class="toggle" data-date="${dk}">${dateShown?'−':'+'}</button><strong>${d.date}</strong></div></td><td>—</td><td>—</td><td>${t.orders}</td><td>${t.users}</td><td>${money(t.amount)}</td><td>${money(t.loss)}</td><td>—</td><td>—</td></tr>`;out+=`<tr class="event-row ${dateShown?'':'hidden'}"><td>${di+1}.1</td><td class="tree-cell"><div class="tree indent-1"><button class="toggle" data-league="${lk}">${leagueShown?'−':'+'}</button><strong>${d.league}</strong><span class="badge">${d.level}联赛</span></div></td><td>${d.sport}</td><td>—</td><td>${t.orders}</td><td>${t.users}</td><td>${money(t.amount)}</td><td>${money(t.loss)}</td><td>—</td><td>—</td></tr>`;d.events.forEach(e=>{const key=e.short,show=dateShown&&leagueShown,open=eventOpen.has(key),rs=reasonSort.get(key),items=e.reasons.map((r,i)=>({r,i}));if(rs)items.sort((a,b)=>{let av=a.r[rs.field],bv=b.r[rs.field];if(typeof av==='string'&&/^[\d,.]+$/.test(av)){av=Number(av.replace(/[^\d.]/g,''));bv=Number(bv.replace(/[^\d.]/g,''))}return(av>bv?1:av<bv?-1:0)*rs.dir});out+=`<tr class="event-row ${show?'':'hidden'}"><td></td><td class="tree-cell"><div class="tree indent-2"><button class="toggle" data-event="${key}">${open?'−':'+'}</button><span>${e.name}</span><button class="copy-id" title="复制赛事ID" data-copy="${e.long}"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="4.5" width="8" height="10" rx="1.2"/><path d="M3.5 11.5V2.8c0-.7.5-1.3 1.2-1.3H11"/></svg></button></div></td><td>—</td><td>${e.start}</td><td>${e.orders}</td><td>${e.users}</td><td>${money(e.amount)}</td><td>${money(e.loss)}</td><td title="${e.operators}">${e.operators}</td><td>${e.time}</td></tr><tr class="reason-detail ${show&&open?'':'hidden'}"><td colspan="10"><div class="reason-box"><div class="reason-grid"><span class="head">展开明细</span><span class="head">序号</span><span class="head">取消原因</span><span class="head">取消玩法</span>${reasonHead('取消笔数',3,key)}${reasonHead('取消人数',4,key)}${reasonHead('投注金额',5,key)}${reasonHead('挽回损失',6,key)}${reasonHead('取消注单时间段',7,key)}<span class="head">操作人</span>${reasonHead('操作时间',9,key)}${items.map(x=>renderReason(x.r,key,x.i)).join('')}</div></div></td></tr>`})});body.innerHTML=out;bind();document.querySelectorAll('[data-main-sort]').forEach(b=>b.querySelector('.sort').textContent=sortMark('main',b.dataset.mainSort))}
function bind(){document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const k=b.dataset.date;dateOpen.has(k)?dateOpen.delete(k):dateOpen.add(k);render()});document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{const k=b.dataset.league;leagueOpen.has(k)?leagueOpen.delete(k):leagueOpen.add(k);render()});document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const k=b.dataset.event;eventOpen.has(k)?eventOpen.delete(k):eventOpen.add(k);render()});document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>{const k=b.dataset.batch;batchOpen.has(k)?batchOpen.delete(k):batchOpen.add(k);render()});document.querySelectorAll('[data-main-sort]').forEach(b=>b.onclick=()=>{const f=b.dataset.mainSort;mainSort={field:f,dir:mainSort.field===f?-mainSort.dir:1};render()});document.querySelectorAll('[data-reason-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.reasonSort,f=Number(b.dataset.field),s=reasonSort.get(k);reasonSort.set(k,{field:f,dir:s&&s.field===f?-s.dir:1});render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy)}catch(e){}toastOk(`赛事ID:${b.dataset.copy}复制成功!`)})}render();
document.getElementById('query').onclick=()=>{toast('查询完成，已按当前条件刷新');document.querySelectorAll('.metric-value').forEach((el,i)=>{el.style.opacity='.45';setTimeout(()=>el.style.opacity='1',220)})};
document.getElementById('reset').onclick=()=>{document.querySelectorAll('input').forEach(i=>{if(i.type!=='date'&&!i.closest('.picker'))i.value=''});document.querySelectorAll('select').forEach(s=>s.selectedIndex=0);document.getElementById('start').value='2026-10-31';document.getElementById('end').value='2026-11-06';toast('筛选条件已清空')};

// Candidate data for league and play pickers is illustrative, derived from the existing prototype.
const pickers=[];
function createPicker(id,label,placeholder,getOptions,{bulk=false,source=false,single=false,initial=[],tree=false}={}){
 const root=document.getElementById(id), selected=new Set(initial);let search='';
 root.classList.toggle('source',source);root.classList.toggle('single',single);root.classList.toggle('tree',tree);
 const control=document.createElement('div');control.className='picker-control';
 const tags=document.createElement('div');tags.style.display='contents';
 const input=document.createElement('input');input.placeholder=placeholder;input.setAttribute('aria-label',label);input.setAttribute('role','combobox');input.setAttribute('aria-expanded','false');input.setAttribute('aria-controls',id+'-options');input.autocomplete='off';
 const arrow=document.createElement('button');arrow.className='picker-arrow';arrow.type='button';arrow.textContent='⌄';arrow.setAttribute('aria-label','展开'+label);
 const clear=document.createElement('button');clear.className='picker-clear';clear.type='button';clear.textContent='⊗';clear.setAttribute('aria-label','清空'+label);
 control.append(tags,input,arrow,clear);
 const panel=document.createElement('div');panel.className='picker-panel';
 const options=document.createElement('div');options.className='picker-options';options.id=id+'-options';options.setAttribute('role','listbox');options.setAttribute('aria-multiselectable','true');options.setAttribute('aria-label',label+'候选');
 const footer=document.createElement('div');footer.className='picker-footer';
 function bulkAction(text,action){const lab=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.setAttribute('aria-label',label+text);lab.append(box,document.createTextNode(text));box.addEventListener('change',()=>{action();search='';input.value='';paint();input.focus()});footer.append(lab);return box}
 const all=bulk?bulkAction('全选',()=>getOptions().forEach(v=>selected.add(v))):null;
 if(bulk)bulkAction('反选',()=>getOptions().forEach(v=>selected.has(v)?selected.delete(v):selected.add(v)));
 if(source&&bulk)panel.append(footer);panel.append(options);if(!source&&bulk)panel.append(footer);root.append(control,panel);
 function paint(){
  tags.replaceChildren();selected.forEach(v=>{const tag=document.createElement('span');tag.className='picker-tag';const text=document.createElement('span');text.textContent=v;const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','移除'+label+v);remove.onclick=e=>{e.stopPropagation();selected.delete(v);paint()};tag.append(text,remove);tags.append(tag)});
  input.placeholder=selected.size?'':placeholder;root.classList.toggle('has-value',!!selected.size);options.replaceChildren();const available=getOptions(),visible=available.filter(v=>(typeof v==='string'?v:v.label).toLowerCase().includes(search.toLowerCase()));
  visible.forEach(v=>{const value=typeof v==='string'?v:v.value,labelText=typeof v==='string'?v:v.label;const row=document.createElement('div');row.className='picker-option'+(typeof v==='object'&&v.child?' picker-tree-child':'');row.tabIndex=0;row.setAttribute('role','option');row.setAttribute('aria-selected',selected.has(value));row.textContent=labelText;const check=document.createElement('span');check.className='picker-check';check.textContent=selected.has(value)?'✓':'';row.append(check);const choose=()=>{if(single)selected.clear();selected.has(value)?selected.delete(value):selected.add(value);search='';input.value='';paint();if(single)close();else input.focus()};row.onclick=choose;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};options.append(row)});
  if(!visible.length){const empty=document.createElement('div');empty.className='picker-empty';empty.textContent='无匹配数据';options.append(empty)}
  if(all){all.checked=available.length>0&&available.every(v=>selected.has(v));all.indeterminate=selected.size>0&&!all.checked}
 }
 function close(){root.classList.remove('open');input.setAttribute('aria-expanded','false')}
 function open(){pickers.forEach(p=>p.close());paint();root.classList.add('open');input.setAttribute('aria-expanded','true')}
 control.onclick=()=>{open();input.focus()};clear.onclick=e=>{e.stopPropagation();selected.clear();search='';input.value='';paint()};input.oninput=()=>{search=input.value;open()};input.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='ArrowDown'){e.preventDefault();open();options.querySelector('[role=option]')?.focus()}};
 const api={close,refresh:paint,reset(){selected.clear();initial.forEach(v=>selected.add(v));search='';input.value='';paint();close()}};pickers.push(api);paint();return api;
}

const levelPicker=createPicker('levelPicker','联赛等级','全部联赛等级',()=>['无级别',...Array.from({length:20},(_,i)=>(i+1)+'级')],{bulk:true});
const reasonPicker=createPicker('reasonPicker','取消原因','请选择',()=>['全部','疑似协议赛','进球点注单','异常投注','赛事取消'],{single:true,initial:['全部']});
const sportPicker=createPicker('sportPicker','赛种','请选择',()=>['足球','篮球','网球'],{bulk:true});
document.addEventListener('click',e=>{if(!e.target.closest('.picker'))pickers.forEach(p=>p.close())});
document.addEventListener('focusin',e=>{if(!e.target.closest('.picker'))pickers.forEach(p=>p.close())});
document.getElementById('reset').addEventListener('click',()=>pickers.forEach(p=>p.reset()));
