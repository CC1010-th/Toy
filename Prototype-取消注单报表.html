th{background:#fafafa;color:rgba(0,0,0,.72);font-weight:600}tbody tr:hover{background:#e6f7ff}.tree-cell{text-align:left}.tree{display:flex;align-items:center;gap:7px}.sub-id{margin-top:3px;padding-left:25px;color:#9aa4b2;font-size:12px}.indent-1{padding-left:16px}.indent-2{padding-left:42px}.toggle{display:grid;place-items:center;width:18px;height:18px;padding:0;border:1px solid #b7d4ff;border-radius:4px;background:#fff;color:#337dff;cursor:pointer}.badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:4px;background:#f0f5ff;color:#7a8798;font-size:12px}.copy-id{margin-left:5px;color:#8fa0b5;cursor:pointer}.reason-detail td{background:#fafafa}.reason-detail.hidden,.event-row.hidden{display:none}.reason-box{padding:8px 12px;text-align:left}.reason-grid{display:grid;grid-template-columns:.55fr .75fr 1fr 1.1fr repeat(4,.68fr) 1.3fr .85fr 1.15fr;gap:0;margin-top:4px;border-left:1px solid #e8e8e8;border-top:1px solid #e8e8e8}.reason-grid span{padding:8px;border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;text-align:center;white-space:normal}.reason-grid .head{background:#f7f9fc;color:rgba(0,0,0,.72);font-weight:600}.batch-children{grid-column:1/-1;padding:10px 18px!important;background:#fff}.batch-child-grid{display:grid;grid-template-columns:.55fr .75fr 1fr 1.1fr repeat(4,.68fr) 1.3fr .85fr 1.15fr;border-left:1px solid #e8e8e8;border-top:1px solid #e8e8e8}.batch-child-grid span{background:#fff}.sort-btn{padding:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer}.sort{margin-left:4px;color:#b8c1cc;font-size:11px}.sort.active{color:#337dff}.toast{position:fixed;z-index:30;top:28px;left:50%;display:none;transform:translateX(-50%);padding:9px 18px;background:#fff;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.18);color:rgba(0,0,0,.72)}@media(max-width:1200px){.filter-grid{grid-template-columns:repeat(2,minmax(260px,1fr))}}

<section class="filter">
<div class="filter-grid">
 <div class="field"><label class="required">开赛日期</label><div class="date-range"><input id="start" class="input" type="date" value="2026-10-31"><span>~</span><input id="end" class="input" type="date" value="2026-11-06"></div></div>

</section>
<div class="toolbar"><button id="export" class="btn primary">导 出</button></div>
<div class="table-wrap"><table><colgroup><col style="width:70px"><col style="width:360px"><col style="width:90px"><col style="width:170px"><col style="width:100px"><col style="width:105px"><col style="width:135px"><col style="width:135px"><col style="width:120px"><col style="width:170px"></colgroup><thead><tr><th>序号</th><th>联赛名称</th><th>赛种</th><th><button class="sort-btn" data-main-sort="date">开赛日期 <span class="sort">◆</span></button></th><th><button class="sort-btn" data-main-sort="orders">取消笔数 <span class="sort">◆</span></button></th><th><button class="sort-btn" data-main-sort="users">取消人数 <span class="sort">◆</span></button></th><th><button class="sort-btn" data-main-sort="amount">投注金额 <span class="sort">◆</span></button></th><th><button class="sort-btn" data-main-sort="loss">挽回损失 <span class="sort">◆</span></button></th><th>操作人</th><th><button class="sort-btn" data-main-sort="time">操作时间 <span class="sort">◆</span></button></th></tr></thead><tbody id="body"></tbody></table></div>
</section></main>

<script>
const data=[

  {name:'阿森纳 v 切尔西',short:'784230',long:'4588524123304741784230',start:'2026-11-05 19:45:00',orders:296,users:151,amount:886000,loss:129640,operators:'risk_amy',time:'2026-11-05 22:10:02',reasons:[['第 1 次','进球点注单','全场大小',96,61,'¥ 286,000.00','¥ 129,640.00','20:38:12 ~ 20:41:58','risk_amy','2026-11-05 20:43:11'],['第 2 次','赛事取消','全场让球',200,90,'¥ 600,000.00','-','19:52:06 ~ 22:06:43','risk_amy','2026-11-05 22:10:02']]}
 ]},
 {date:'2026-11-04',league:'NBA',level:'一级',sport:'篮球',events:[
  {name:'洛杉矶湖人 v 金州勇士',short:'772918',long:'5588524123304741772918',start:'2026-11-04 09:00:00',orders:372,users:208,amount:1124200,loss:246780,operators:'cptest2',time:'2026-11-04 13:18:44',reasons:[['第 1 次','异常投注','全场大小/全场让分',226,132,'¥ 684,000.00','¥ 246,780.00','10:02:09 ~ 12:55:32','cptest2','2026-11-04 13:18:44'],['第 2 次','赛事取消','半场大小',146,76,'¥ 440,200.00','-','09:48:20 ~ 10:31:08','cptest2','2026-11-04 10:35:16']]}
 ]},
 {date:'2026-11-03',league:'西班牙甲级联赛',level:'一级',sport:'足球',events:[
  {name:'巴塞罗那 v 塞维利亚',short:'768501',long:'4588524123304741768501',start:'2026-11-03 20:00:00',orders:318,users:174,amount:958600,loss:206430,operators:'cptest1',time:'2026-11-03 23:06:51',reasons:[['第 1 次','疑似协议赛','全场让球',138,88,'¥ 418,600.00','¥ 206,430.00','20:12:33 ~ 22:58:09','cptest1','2026-11-03 23:06:51'],['第 2 次','赛事取消','全场大小',180,86,'¥ 540,000.00','-','19:28:10 ~ 21:05:17','cptest1','2026-11-03 21:08:20']]}
 ]}
];
const body=document.getElementById('body'),toastEl=document.getElementById('toast');let dateOpen=new Set(),leagueOpen=new Set(),eventOpen=new Set(),batchOpen=new Set(),mainSort={field:null,dir:1},reasonSort=new Map();
function money(v){return '¥ '+v.toLocaleString('zh-CN',{minimumFractionDigits:2})}function toast(t){toastEl.textContent=t;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',1500)}
function totals(d){return d.events.reduce((a,e)=>({orders:a.orders+e.orders,users:a.users+e.users,amount:a.amount+e.amount,loss:a.loss+e.loss,time:a.time>e.time?a.time:e.time}),{orders:0,users:0,amount:0,loss:0,time:''})}
function sortMark(scope,field,key=''){const s=scope==='main'?mainSort:reasonSort.get(key);return s&&s.field===field?(s.dir===1?'▲':'▼'):'◆'}
function renderReason(r,key,ri){const bk=`${key}-${ri}`,open=batchOpen.has(bk),main=`<span><button class="toggle" data-batch="${bk}">${open?'−':'+'}</button></span>`+r.slice(0,10).map(v=>`<span>${v}</span>`).join('');const children=r[10]&&open?`<span class="batch-children"><span class="batch-child-grid">${r[10].map(c=>`<span>↳</span>`+c.map(v=>`<span>${v}</span>`).join('')).join('')}</span></span>`:'';return main+children}
function reasonHead(label,field,key){return `<span class="head"><button class="sort-btn" data-reason-sort="${key}" data-field="${field}">${label} <span class="sort">${sortMark('reason',field,key)}</span></button></span>`}
function render(){let out='',groups=[...data];if(mainSort.field)groups.sort((a,b)=>{const av=mainSort.field==='date'?a.date:totals(a)[mainSort.field],bv=mainSort.field==='date'?b.date:totals(b)[mainSort.field];return(av>bv?1:av<bv?-1:0)*mainSort.dir});groups.forEach((d,di)=>{const t=totals(d),dk=d.date,lk=`${dk}-${d.league}`,dateShown=dateOpen.has(dk),leagueShown=leagueOpen.has(lk);out+=`<tr><td>${di+1}</td><td class="tree-cell"><div class="tree"><button class="toggle" data-date="${dk}">${dateShown?'−':'+'}</button><strong>${d.date}</strong></div></td><td>—</td><td>—</td><td>${t.orders}</td><td>${t.users}</td><td>${money(t.amount)}</td><td>${money(t.loss)}</td><td>—</td><td>—</td></tr>`;out+=`<tr class="event-row ${dateShown?'':'hidden'}"><td>${di+1}.1</td><td class="tree-cell"><div class="tree indent-1"><button class="toggle" data-league="${lk}">${leagueShown?'−':'+'}</button><strong>${d.league}</strong><span class="badge">${d.level}联赛</span></div></td><td>${d.sport}</td><td>—</td><td>${t.orders}</td><td>${t.users}</td><td>${money(t.amount)}</td><td>${money(t.loss)}</td><td>—</td><td>—</td></tr>`;d.events.forEach(e=>{const key=e.short,show=dateShown&&leagueShown,open=eventOpen.has(key),rs=reasonSort.get(key),items=e.reasons.map((r,i)=>({r,i}));if(rs)items.sort((a,b)=>{let av=a.r[rs.field],bv=b.r[rs.field];if(typeof av==='string'&&av.includes('¥')){av=Number(av.replace(/[^\d.]/g,''));bv=Number(bv.replace(/[^\d.]/g,''))}return(av>bv?1:av<bv?-1:0)*rs.dir});out+=`<tr class="event-row ${show?'':'hidden'}"><td></td><td class="tree-cell"><div class="tree indent-2"><button class="toggle" data-event="${key}">${open?'−':'+'}</button><span>${e.name}</span></div><div class="sub-id">ID:${e.short}<button class="btn link copy-id" title="复制长ID" data-copy="${e.long}">▣</button></div></td><td>—</td><td>${e.start}</td><td>${e.orders}</td><td>${e.users}</td><td>${money(e.amount)}</td><td>${money(e.loss)}</td><td>${e.operators}</td><td>${e.time}</td></tr><tr class="reason-detail ${show&&open?'':'hidden'}"><td colspan="10"><div class="reason-box"><div class="reason-grid"><span class="head">展开明细</span><span class="head">取消批次</span><span class="head">取消原因</span><span class="head">取消玩法</span>${reasonHead('取消笔数',3,key)}${reasonHead('取消人数',4,key)}${reasonHead('投注金额',5,key)}${reasonHead('挽回损失',6,key)}${reasonHead('取消时间段',7,key)}<span class="head">操作人</span>${reasonHead('操作时间',9,key)}${items.map(x=>renderReason(x.r,key,x.i)).join('')}</div></div></td></tr>`})});body.innerHTML=out;bind();document.querySelectorAll('[data-main-sort]').forEach(b=>b.querySelector('.sort').textContent=sortMark('main',b.dataset.mainSort))}
function bind(){document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{const k=b.dataset.date;dateOpen.has(k)?dateOpen.delete(k):dateOpen.add(k);render()});document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{const k=b.dataset.league;leagueOpen.has(k)?leagueOpen.delete(k):leagueOpen.add(k);render()});document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const k=b.dataset.event;eventOpen.has(k)?eventOpen.delete(k):eventOpen.add(k);render()});document.querySelectorAll('[data-batch]').forEach(b=>b.onclick=()=>{const k=b.dataset.batch;batchOpen.has(k)?batchOpen.delete(k):batchOpen.add(k);render()});document.querySelectorAll('[data-main-sort]').forEach(b=>b.onclick=()=>{const f=b.dataset.mainSort;mainSort={field:f,dir:mainSort.field===f?-mainSort.dir:1};render()});document.querySelectorAll('[data-reason-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.reasonSort,f=Number(b.dataset.field),s=reasonSort.get(k);reasonSort.set(k,{field:f,dir:s&&s.field===f?-s.dir:1});render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy)}catch(e){}toast('赛事长 ID 已复制')})}render();
document.getElementById('query').onclick=()=>{toast('查询完成，已按当前条件刷新');document.querySelectorAll('.metric-value').forEach((el,i)=>{el.style.opacity='.45';setTimeout(()=>el.style.opacity='1',220)})};
document.getElementById('reset').onclick=()=>{document.querySelectorAll('input').forEach(i=>{if(i.type!=='date'&&!i.closest('.picker'))i.value=''});document.querySelectorAll('select').forEach(s=>s.selectedIndex=0);document.getElementById('start').value='2026-10-31';document.getElementById('end').value='2026-11-06';toast('筛选条件已清空')};
document.getElementById('export').onclick=()=>toast('已按原需求字段创建导出任务');

// Candidate data for league and play pickers is illustrative, derived from the existing prototype.
const pickers=[];
function createPicker(id,label,placeholder,getOptions,{bulk=false,source=false,single=false,initial=[],tree=false}={}){
 const root=document.getElementById(id), selected=new Set(initial);let search='';
 root.classList.toggle('source',source);root.classList.toggle('single',single);root.classList.toggle('tree',tree);
 const control=document.createElement('div');control.className='picker-control';
 const tags=document.createElement('div');tags.style.display='contents';
 const input=document.createElement('input');input.placeholder=placeholder;input.setAttribute('aria-label',label);input.setAttribute('role','combobox');input.setAttribute('aria-expanded','false');input.setAttribute('aria-controls',id+'-options');input.autocomplete='off';
 const arrow=document.createElement('button');arrow.className='picker-arrow';arrow.type='button';arrow.textContent='⌄';arrow.setAttribute('aria-label','展开'+label);
 const clear=document.createElement('button');clear.className='picker-clear';clear.type='button';clear.textContent='⊗';clear.setAttribute('aria-label','清空'+label);
 control.append(tags,input,arrow,clear);
 const panel=document.createElement('div');panel.className='picker-panel';
 const options=document.createElement('div');options.className='picker-options';options.id=id+'-options';options.setAttribute('role','listbox');options.setAttribute('aria-multiselectable','true');options.setAttribute('aria-label',label+'候选');
 const footer=document.createElement('div');footer.className='picker-footer';
 function bulkAction(text,action){const lab=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.setAttribute('aria-label',label+text);lab.append(box,document.createTextNode(text));box.addEventListener('change',()=>{action();search='';input.value='';paint();input.focus()});footer.append(lab);return box}
 const all=bulk?bulkAction('全选',()=>getOptions().forEach(v=>selected.add(v))):null;
 if(bulk)bulkAction('反选',()=>getOptions().forEach(v=>selected.has(v)?selected.delete(v):selected.add(v)));
 if(source&&bulk)panel.append(footer);panel.append(options);if(!source&&bulk)panel.append(footer);root.append(control,panel);
 function paint(){
  tags.replaceChildren();selected.forEach(v=>{const tag=document.createElement('span');tag.className='picker-tag';const text=document.createElement('span');text.textContent=v;const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','移除'+label+v);remove.onclick=e=>{e.stopPropagation();selected.delete(v);paint()};tag.append(text,remove);tags.append(tag)});
  input.placeholder=selected.size?'':placeholder;root.classList.toggle('has-value',!!selected.size);options.replaceChildren();const available=getOptions(),visible=available.filter(v=>(typeof v==='string'?v:v.label).toLowerCase().includes(search.toLowerCase()));
  visible.forEach(v=>{const value=typeof v==='string'?v:v.value,labelText=typeof v==='string'?v:v.label;const row=document.createElement('div');row.className='picker-option'+(typeof v==='object'&&v.child?' picker-tree-child':'');row.tabIndex=0;row.setAttribute('role','option');row.setAttribute('aria-selected',selected.has(value));row.textContent=labelText;const check=document.createElement('span');check.className='picker-check';check.textContent=selected.has(value)?'✓':'';row.append(check);const choose=()=>{if(single)selected.clear();selected.has(value)?selected.delete(value):selected.add(value);search='';input.value='';paint();if(single)close();else input.focus()};row.onclick=choose;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};options.append(row)});
  if(!visible.length){const empty=document.createElement('div');empty.className='picker-empty';empty.textContent='无匹配数据';options.append(empty)}
  if(all){all.checked=available.length>0&&available.every(v=>selected.has(v));all.indeterminate=selected.size>0&&!all.checked}
 }
 function close(){root.classList.remove('open');input.setAttribute('aria-expanded','false')}
 function open(){pickers.forEach(p=>p.close());paint();root.classList.add('open');input.setAttribute('aria-expanded','true')}
 control.onclick=()=>{open();input.focus()};clear.onclick=e=>{e.stopPropagation();selected.clear();search='';input.value='';paint()};input.oninput=()=>{search=input.value;open()};input.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='ArrowDown'){e.preventDefault();open();options.querySelector('[role=option]')?.focus()}};
 const api={close,refresh:paint,reset(){selected.clear();initial.forEach(v=>selected.add(v));search='';input.value='';paint();close()}};pickers.push(api);paint();return api;
}
const merchantTypePicker=createPicker('merchantTypePicker','商户分类','请选择',()=>['现金网'],{bulk:true});
const merchantCodePicker=createPicker('merchantCodePicker','商户编码','所有现金网',()=>[{value:'现金网',label:'现金网'},{value:'001直营',label:'001直营',child:true},{value:'OBG',label:'OBG',child:true}],{tree:true});
const levelPicker=createPicker('levelPicker','联赛等级','全部联赛等级',()=>['无级别',...Array.from({length:20},(_,i)=>(i+1)+'级')],{bulk:true});
const reasonPicker=createPicker('reasonPicker','取消原因','请选择',()=>['全部','疑似协议赛','进球点注单','异常投注','赛事取消'],{single:true,initial:['全部']});
const sportPicker=createPicker('sportPicker','赛种','请选择',()=>['足球','篮球','网球'],{bulk:true});
const operatorPicker=createPicker('operatorPicker','操作人','全部',()=>['全部',...new Set(data.flatMap(d=>d.events.flatMap(e=>e.operators.split('/'))))],{single:true,initial:['全部']});
document.addEventListener('click',e=>{if(!e.target.closest('.picker'))pickers.forEach(p=>p.close())});
document.addEventListener('focusin',e=>{if(!e.target.closest('.picker'))pickers.forEach(p=>p.close())});
document.getElementById('reset').addEventListener('click',()=>pickers.forEach(p=>p.reset()));

</script>
