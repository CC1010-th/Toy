<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取消注单报表</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f0f2f5;color:rgba(57,58,68,.72);font:14px/1.5 "PingFang SC","Microsoft YaHei",Arial,sans-serif}.page{min-height:100vh;padding:16px}.card{background:#fff;border:1px solid #e8e8e8}.tabs{display:flex;height:48px;padding:0 22px;border-bottom:1px solid #e8e8e8}.tab{display:flex;align-items:center;border-bottom:2px solid #5187ff;color:#5187ff;font-weight:600}.filter{padding:20px 24px 16px}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px 22px}.field{display:flex;align-items:center;min-width:0}.field label{flex:0 0 88px;margin-right:10px;color:rgba(0,0,0,.72);font-weight:600;text-align:right}.input,.select{width:100%;height:32px;padding:4px 11px;border:1px solid #d9d9d9;border-radius:2px;background:#fff;color:rgba(57,58,68,.72);font:inherit}.date-range{display:flex;align-items:center;gap:8px;flex:1}.date-range input{min-width:0}.required:before{content:"*";margin-right:3px;color:#f5222d}.actions{display:flex;align-items:center;gap:10px;margin-top:16px;padding-left:98px}.btn{height:32px;padding:0 15px;border:1px solid #d9d9d9;border-radius:2px;background:#fff;color:rgba(57,58,68,.72);font:inherit;cursor:pointer}.btn:hover{border-color:#5187ff;color:#5187ff}.btn.primary{border-color:#5187ff;background:#5187ff;color:#fff}.btn.link{height:auto;padding:0;border:0;background:transparent;color:#5187ff}.summary{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:12px;padding:0 24px 18px}.metric{min-height:78px;padding:14px 16px;border:1px solid #e8e8e8;background:#fafcff}.metric-name{color:rgba(0,0,0,.45);font-size:13px}.metric-value{margin-top:8px;color:rgba(0,0,0,.85);font-size:24px;line-height:30px}.toolbar{display:flex;align-items:center;padding:14px 24px;border-top:1px solid #e8e8e8}.toolbar h3{margin:0;color:rgba(0,0,0,.78);font-size:15px}.toolbar-actions{display:flex;gap:8px;margin-left:auto}.table-wrap{overflow:auto;padding:0 24px 18px}table{width:100%;min-width:1320px;border-collapse:collapse;table-layout:fixed}th,td{height:46px;padding:8px 10px;border:1px solid #e8e8e8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{background:#fafafa;color:rgba(0,0,0,.72);font-weight:600}tbody tr:hover{background:#e6f7ff}.tree-cell{text-align:left}.tree{display:flex;align-items:center;gap:7px}.indent-1{padding-left:26px}.indent-2{padding-left:52px}.toggle{display:grid;place-items:center;width:18px;height:18px;padding:0;border:1px solid #d9d9d9;background:#fff;color:#5187ff;cursor:pointer}.muted-toggle{border-color:transparent;color:#bfbfbf;cursor:default}.badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:#f0f5ff;color:#5187ff;font-size:12px}.copy-id{margin-left:6px;color:#5187ff;cursor:pointer}.reason-detail td{background:#fafafa}.reason-detail.hidden,.event-row.hidden{display:none}.reason-box{padding:8px 12px;text-align:left}.reason-title{color:rgba(0,0,0,.78);font-weight:600}.reason-grid{display:grid;grid-template-columns:.7fr 1fr 1.1fr repeat(4,.68fr) 1.3fr .85fr 1.15fr;gap:0;margin-top:8px;border-left:1px solid #e8e8e8;border-top:1px solid #e8e8e8}.reason-grid span{padding:8px;border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;text-align:center;white-space:normal}.reason-grid .head{background:#fff;color:rgba(0,0,0,.72);font-weight:600}.batch-children{grid-column:1/-1;padding:10px 18px!important;background:#fff}.batch-child-grid{display:grid;grid-template-columns:.7fr 1fr 1.1fr repeat(4,.68fr) 1.3fr .85fr 1.15fr;border-left:1px solid #e8e8e8;border-top:1px solid #e8e8e8}.batch-child-grid span{background:#fafafa}.toast{position:fixed;z-index:30;top:28px;left:50%;display:none;transform:translateX(-50%);padding:9px 18px;background:#fff;border-radius:3px;box-shadow:0 2px 8px rgba(0,0,0,.18);color:rgba(0,0,0,.72)}@media(max-width:1200px){.filter-grid{grid-template-columns:repeat(2,minmax(260px,1fr))}.summary{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="page"><section class="card">
<nav class="tabs"><div class="tab">取消注单报表</div></nav>
<section class="filter">
<div class="filter-grid">
 <div class="field"><label class="required">开赛日期</label><div class="date-range"><input id="start" class="input" type="date" value="2026-10-31"><span>~</span><input id="end" class="input" type="date" value="2026-11-06"></div></div>
 <div class="field"><label>商户分类</label><select id="merchantType" class="select" multiple size="1" title="源表为多选下拉"><option>现金网</option><option>新商户</option><option>重点商户</option></select></div>
 <div class="field"><label>商户编码</label><input id="merchantCode" class="input" placeholder="请输入商户编码"></div>
<div class="field"><label>联赛等级</label><select class="select"><option>全部</option><option>一级</option><option>二级</option><option>三级及以下</option></select></div>
 <div class="field"><label>取消原因</label><input id="reason" class="input" list="reasonOptions" value="全部" aria-label="取消原因，默认全选"><datalist id="reasonOptions"><option value="全部"><option value="疑似协议赛"><option value="进球点注单"><option value="异常投注"><option value="赛事取消"></datalist></div>
 <div class="field"><label>赛种</label><select id="sport" class="select" multiple size="1" title="源表为多选下拉"><option>足球</option><option>篮球</option><option>网球</option></select></div>
 <div class="field"><label>玩法</label><input class="input" aria-label="玩法"></div>
 <div class="field"><label>投注阶段</label><select class="select"><option>全部</option><option>早盘</option><option>滚球</option></select></div>
 <div class="field"><label>联赛名称</label><input class="input" placeholder="请输入联赛名称"></div>
 <div class="field"><label>赛事名称</label><input class="input" placeholder="请输入赛事名称"></div>
 <div class="field"><label>赛事 ID</label><input class="input" placeholder="请输入赛事 ID"></div>
<div class="field"><label>操作人</label><select id="operator" class="select"><option>全部</option><option>cptest1</option><option>cptest2</option><option>risk_amy</option></select></div>
</div>
<div class="actions"><button id="query" class="btn primary">查 询</button><button id="reset" class="btn">清 空</button></div>
</section>
<section class="summary">
 <div class="metric"><div class="metric-name">总取消赛事</div><div id="mEvents" class="metric-value">128</div></div>
 <div class="metric"><div class="metric-name">总取消笔数</div><div id="mOrders" class="metric-value">2,846</div></div>
 <div class="metric"><div class="metric-name">总取消人数</div><div id="mUsers" class="metric-value">1,392</div></div>
 <div class="metric"><div class="metric-name">总投注金额</div><div id="mAmount" class="metric-value">¥ 8,624,580.00</div></div>
 <div class="metric"><div class="metric-name">总挽回损失</div><div id="mLoss" class="metric-value">¥ 1,286,430.00</div></div>
</section>
<div class="toolbar"><h3>取消赛事汇总</h3><div class="toolbar-actions"><button id="export" class="btn primary">导 出</button></div></div>
<div class="table-wrap"><table><colgroup><col style="width:330px"><col style="width:90px"><col style="width:100px"><col style="width:105px"><col style="width:125px"><col style="width:140px"><col style="width:140px"><col style="width:145px"></colgroup><thead><tr><th>开赛日期 / 联赛 / 赛事</th><th>赛种</th><th>取消笔数 ↕</th><th>取消人数 ↕</th><th>投注金额 ↕</th><th>挽回损失 ↕</th><th>操作人</th><th>操作时间 ↕</th></tr></thead><tbody id="body"></tbody></table></div>
</section></main>
<div id="toast" class="toast"></div>
<script>
const data=[
 {date:'2026-11-05',league:'英格兰超级联赛',level:'一级',sport:'足球',events:[
  {name:'曼彻斯特城 v 利物浦',short:'784216',long:'4588524123304741784216',orders:428,users:216,amount:1286400,loss:348920,operators:'cptest1/cptest2',time:'2026-11-05 23:42:18',reasons:[['第 1 次','疑似协议赛','全场大小/全场让球',168,92,'¥ 486,200.00','¥ 182,320.00','21:02:15 ~ 22:46:38','cptest1','2026-11-05 22:48:06',[['第 1-1 笔','疑似协议赛','全场大小',80,45,'¥ 230,000.00','¥ 86,000.00','21:02:15 ~ 21:50:20','cptest1','2026-11-05 21:52:06'],['第 1-2 笔','疑似协议赛','全场让球',88,47,'¥ 256,200.00','¥ 96,320.00','21:51:05 ~ 22:46:38','cptest1','2026-11-05 22:48:06']]],['第 2 次','异常投注','全场大小',260,124,'¥ 800,200.00','¥ 166,600.00','21:14:32 ~ 23:39:51','cptest2','2026-11-05 23:42:18']]},
  {name:'阿森纳 v 切尔西',short:'784230',long:'4588524123304741784230',orders:296,users:151,amount:886000,loss:129640,operators:'risk_amy',time:'2026-11-05 22:10:02',reasons:[['第 1 次','进球点注单','全场大小',96,61,'¥ 286,000.00','¥ 129,640.00','20:38:12 ~ 20:41:58','risk_amy','2026-11-05 20:43:11'],['第 2 次','赛事取消','全场让球',200,90,'¥ 600,000.00','-','19:52:06 ~ 22:06:43','risk_amy','2026-11-05 22:10:02']]}
 ]},
 {date:'2026-11-04',league:'NBA',level:'一级',sport:'篮球',events:[
  {name:'洛杉矶湖人 v 金州勇士',short:'772918',long:'5588524123304741772918',orders:372,users:208,amount:1124200,loss:246780,operators:'cptest2',time:'2026-11-04 13:18:44',reasons:[['第 1 次','异常投注','全场大小/全场让分',226,132,'¥ 684,000.00','¥ 246,780.00','10:02:09 ~ 12:55:32','cptest2','2026-11-04 13:18:44'],['第 2 次','赛事取消','半场大小',146,76,'¥ 440,200.00','-','09:48:20 ~ 10:31:08','cptest2','2026-11-04 10:35:16']]}
 ]},
 {date:'2026-11-03',league:'西班牙甲级联赛',level:'一级',sport:'足球',events:[
  {name:'巴塞罗那 v 塞维利亚',short:'768501',long:'4588524123304741768501',orders:318,users:174,amount:958600,loss:206430,operators:'cptest1',time:'2026-11-03 23:06:51',reasons:[['第 1 次','疑似协议赛','全场让球',138,88,'¥ 418,600.00','¥ 206,430.00','20:12:33 ~ 22:58:09','cptest1','2026-11-03 23:06:51'],['第 2 次','赛事取消','全场大小',180,86,'¥ 540,000.00','-','19:28:10 ~ 21:05:17','cptest1','2026-11-03 21:08:20']]}
 ]}
];
const body=document.getElementById('body'),toastEl=document.getElementById('toast');let leagueOpen=new Set(),eventOpen=new Set();
function money(v){return '¥ '+v.toLocaleString('zh-CN',{minimumFractionDigits:2})}function toast(t){toastEl.textContent=t;toastEl.style.display='block';setTimeout(()=>toastEl.style.display='none',1500)}
function renderReason(r){const main=r.slice(0,10).map((v,i)=>`<span>${i===0&&r[10]?'⌄ ':''}${v}</span>`).join('');const children=r[10]?`<span class="batch-children"><span class="batch-child-grid">${r[10].map(c=>c.map(v=>`<span>${v}</span>`).join('')).join('')}</span></span>`:'';return main+children}
function render(){let out='';data.forEach((d,di)=>{const totals=d.events.reduce((a,e)=>({orders:a.orders+e.orders,users:a.users+e.users,amount:a.amount+e.amount,loss:a.loss+e.loss}),{orders:0,users:0,amount:0,loss:0});out+=`<tr><td class="tree-cell"><div class="tree"><button class="toggle" data-league="${di}">${leagueOpen.has(di)?'−':'+'}</button><strong>${d.date}</strong><span class="badge">${d.events.length} 场</span></div></td><td>${d.sport}</td><td>${totals.orders}</td><td>${totals.users}</td><td>${money(totals.amount)}</td><td>${money(totals.loss)}</td><td>—</td><td>—</td></tr>`;out+=`<tr class="event-row ${leagueOpen.has(di)?'':'hidden'}"><td class="tree-cell"><div class="tree indent-1"><span class="toggle muted-toggle">•</span><strong>${d.league}</strong><span class="badge">${d.level}</span></div></td><td>${d.sport}</td><td>${totals.orders}</td><td>${totals.users}</td><td>${money(totals.amount)}</td><td>${money(totals.loss)}</td><td>—</td><td>—</td></tr>`;d.events.forEach((e,ei)=>{const key=`${di}-${ei}`,show=leagueOpen.has(di),open=eventOpen.has(key);out+=`<tr class="event-row ${show?'':'hidden'}"><td class="tree-cell"><div class="tree indent-2"><button class="toggle" data-event="${key}">${open?'−':'+'}</button><span>${e.name}</span><span class="badge">ID ${e.short}</span><button class="btn link copy-id" data-copy="${e.long}">复制长ID</button></div></td><td>${d.sport}</td><td>${e.orders}</td><td>${e.users}</td><td>${money(e.amount)}</td><td>${money(e.loss)}</td><td>${e.operators}</td><td>${e.time}</td></tr><tr class="reason-detail ${show&&open?'':'hidden'}"><td colspan="8"><div class="reason-box"><div class="reason-title">取消原因批次明细</div><div class="reason-grid"><span class="head">取消批次</span><span class="head">取消原因</span><span class="head">取消玩法</span><span class="head">取消笔数</span><span class="head">取消人数</span><span class="head">投注金额</span><span class="head">挽回损失</span><span class="head">取消时间段</span><span class="head">操作人</span><span class="head">操作时间</span>${e.reasons.map(renderReason).join('')}</div></div></td></tr>`})});body.innerHTML=out;bind()}
function bind(){document.querySelectorAll('[data-league]').forEach(b=>b.onclick=()=>{const k=+b.dataset.league;leagueOpen.has(k)?leagueOpen.delete(k):leagueOpen.add(k);render()});document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{const k=b.dataset.event;eventOpen.has(k)?eventOpen.delete(k):eventOpen.add(k);render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy)}catch(e){}toast('赛事长 ID 已复制')})}render();
document.getElementById('query').onclick=()=>{toast('查询完成，已按当前条件刷新');document.querySelectorAll('.metric-value').forEach((el,i)=>{el.style.opacity='.45';setTimeout(()=>el.style.opacity='1',220)})};
document.getElementById('reset').onclick=()=>{document.querySelectorAll('select').forEach(s=>Array.from(s.options).forEach(o=>o.selected=false));document.querySelectorAll('input').forEach(i=>{if(i.type!=='date')i.value=''});document.querySelectorAll('select:not([multiple])').forEach(s=>s.selectedIndex=0);document.getElementById('reason').value='全部';document.getElementById('start').value='2026-10-31';document.getElementById('end').value='2026-11-06';toast('筛选条件已清空')};
document.getElementById('export').onclick=()=>toast('已按原需求字段创建导出任务');
</script>
</body></html>
