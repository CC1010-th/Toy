function renderHelp(){return head(btn('接口与演示设置','settingsDialog()')+btn('恢复演示数据','resetDemo()'))+notice('本版按业务归属重新组织：来源表内维护映射；同步监控独立；作业清单保持单页；执行接入管理维护目录、监控选择、Java 接入和技术开放策略。所有接口及执行为离线模拟。')+card('八项调整说明',table(['问题','页面处理'],[['1 来源映射归属','从作业监控移除；在来源表的同步映射弹窗内完成。'],['2 同步监控','独立菜单，按链路展示健康与延迟，未知指标保持未知。'],['3 映射操作绕','当前表直接登记、选用、查看或移出展示；支持一表多映射。'],['4 全量海豚目录','执行接入管理按授权项目同步工作流定义，再选择是否纳入跑批监控；异常不自动删除缓存。'],['5 节点与日志来源','定义节点、节点实例状态和节点日志分别获取；当前 check_input 等为响应样例，不是现网。'],['6 失败重试返回','留在发起页面弹窗，明确显示来源和返回入口，不自动跳作业监控。'],['7 作业页签复杂','作业清单单页固定工具栏；执行和补算记录用弹窗；技术配置移至独立菜单。'],['8 补算策略及执行查询','执行接入管理提供技术策略维护；执行查询可经 Java 适配海豚 API，按稳定标识过滤。']].map(r=>r.map(esc))))+card('状态边界',`<div class="pad">${detail({'海豚已下线':'同步到定义下线状态；不等于删除定义，也不停止已有实例。','本轮未发现':'只有授权范围确认、分页完整的一轮才标记；保留历史，由技术核实。','缓存过期':'接口失败、权限不足或分页中断，保留最后成功快照，不推断任务退役。','本平台已退役':'技术确认的平台使用状态，仍保留监控和执行历史，不发送海豚删除命令。','可申请补算':'当前定义与技术验证、允许范围相符，并且来源可用；每次提交仍需后台重新校验。','同期写入安全':'原型演示相同申请去重；生产还须实现重叠范围互斥、资源限制与经验证的写入策略。'})}</div>`)}


const TECH_CONTENT="<header><h1>数据接口中心详细技术方案</h1><p class=\"meta\">V3.0 评审稿　2026-11-22</p><p class=\"intro\">面向 Java 大数据与平台研发，在现有 RocketMQ Kafka Flink Doris 海豚 Redis 技术栈上实现当前简化原型，给出对象关系、接口、状态、一致性控制、权限与交付方案。</p></header><h2 id=\"b0\">1 设计依据与技术边界</h2><p>本方案基于 PRD V2.0 与 SHA256 为 37780382c3c46d284a35dfadbf246f4f77509a336a8957f2bb8ac5fc5da85024 的 V7 简化版。海豚版本 3.1.9 已确认；RocketMQ、Kafka、Flink、CDC、Doris、Redis、Java 与 Spring Cloud Gateway 为现有技术栈。Zeppelin 0.10.1 作为用户要求的 2022 年技术基线，实际部署版本尚需核实。Flink 1.14、Kafka 3.8、Gateway 3.1.10 的官方资料用于说明接口或机制，不代表现网版本，也不构成升级建议。</p><p>以下组件拆分、数据库表、内部接口、采集周期与服务目标均为详细实施建议。原型是离线交互演示，不能从 localStorage 中的状态推断真实执行、鉴权或告警已经落地。本方案不重新引入已删除的菜单。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:22.00%\"><col style=\"width:78.00%\"></colgroup><thead><tr><th scope=\"col\">设计选择</th><th scope=\"col\">本次建议与原因</th></tr></thead><tbody><tr><td>后台形态</td><td>在现有 Java 服务内按模块组织接入、观测、执行、质量与告警能力。初期不要求拆成多个微服务；采集与执行 worker 可独立部署以隔离负载。</td></tr><tr><td>事务元数据</td><td>优先复用企业现有事务数据库。以 MySQL 8 举例描述索引与事务；若现网是 PostgreSQL，按同一模型转换。Doris 不承担请求幂等和并发锁的事务事实库。</td></tr><tr><td>Redis</td><td>缓存最近快照、短期授权与限流、提供协调加速；持久执行请求、报告与告警状态不只存 Redis。</td></tr><tr><td>消息通道</td><td>平台事件选择一套现有消息设施，建议优先复用 RocketMQ。若企业统一 Kafka 则替换适配器；不要求同一事件同时维护两套链路。</td></tr><tr><td>原有数据链路</td><td>Flink、CDC、MQ 与 Doris 保持已有处理职责，平台读取状态和契约；质量检查调用已有 Java 或海豚程序。</td></tr><tr><td>用户流程</td><td>保持简单列表与弹窗；可靠性控制由服务端完成，不转化为额外审批页面。</td></tr></tbody></table></div><h2 id=\"b4\">2 总体架构与职责</h2><p class=\"flowtitle\">请求与运行事实的组织</p><div class=\"flow\" role=\"group\" aria-label=\"请求与运行事实的组织\"><span>1　企业后台页面</span><span>2　Gateway 与对象鉴权</span><span>3　Java 管理及适配层</span><span>4　海豚 Java Flink MQ</span><span>5　元数据 快照 报告 告警</span></div><div class=\"tablewrap\"><table><colgroup><col style=\"width:18.00%\"><col style=\"width:40.00%\"><col style=\"width:42.00%\"></colgroup><thead><tr><th scope=\"col\">模块</th><th scope=\"col\">职责</th><th scope=\"col\">输入或输出</th></tr></thead><tbody><tr><td>Metadata</td><td>数据源、来源表、映射、本地显示资料与稳定引用。</td><td>提供事务 CRUD；不启停任务。</td></tr><tr><td>AccessCatalog</td><td>海豚目录同步、Java 契约登记、监控选择、定义版本。</td><td>输出 accessId 和来源状态；与本地备注分离。</td></tr><tr><td>Observation</td><td>关联 Zeppelin、Flink、MQ 与目标写入；统一指标快照。</td><td>输出有来源、时效、单位和可信度的观测。</td></tr><tr><td>Execution</td><td>统一实例查询、补算预检、提交、未知受理核对、互斥与幂等。</td><td>维护 requestId 与外部实例身份；不以 HTTP 成功替代完成。</td></tr><tr><td>Quality</td><td>任务配置、检查执行、不可变报告、异常样本、问题与复检。</td><td>引用 accessId 与 scopeCode；规则逻辑由执行器实现。</td></tr><tr><td>Alert</td><td>规则评估、事件去重、确认与恢复、受控业务定位。</td><td>独立于浏览器后台运行。</td></tr><tr><td>AuditBridge</td><td>向现有权限管理操作记录推送审计事件。</td><td>使用既有审计契约，无独立操作记录页面。</td></tr></tbody></table></div><p>浏览器仅调用本平台 API，不持有海豚、Zeppelin、Flink 或 Doris 的服务凭据。调度与采集放在后台 worker；页面“刷新”优先查最新快照，确有需要再请求受限的后台刷新，不能每个用户直接全量扫描外部系统。</p><h2 id=\"b8\">3 核心对象与稳定身份</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:39.00%\"><col style=\"width:41.00%\"></colgroup><thead><tr><th scope=\"col\">对象</th><th scope=\"col\">稳定身份</th><th scope=\"col\">必须保留的关系</th></tr></thead><tbody><tr><td>数据源与来源表</td><td>tenantId + envId + sourceId；来源内 tableName 唯一。</td><td>sourceTable → dataSource。</td></tr><tr><td>同步映射</td><td>mappingId；来源身份 + 运行引用 + 目标身份去重。</td><td>同一表可有多条映射；单个运行任务也可覆盖多张表。</td></tr><tr><td>海豚接入</td><td>connectionId + projectCode + processDefinitionCode。</td><td>版本、上线状态与本地 monitorEnabled、alias 分离。</td></tr><tr><td>Java 接入</td><td>connectionId 或 serviceId + programId。</td><td>版本与 parameterSchema、scopeCode、ruleVersion 分离。</td></tr><tr><td>执行实例</td><td>engine + connectionId + externalInstanceId + attemptNo。</td><td>归属 accessId；保留原始状态与归一化状态。</td></tr><tr><td>执行申请</td><td>requestId 与 tenant/env 内唯一 idempotencyKey。</td><td>参数哈希、执行器和策略快照、外部实例关联。</td></tr><tr><td>检查任务</td><td>qualityTaskId；accessId + scopeCode 唯一。</td><td>范围来源于执行器契约，不以范围显示名称作主键。</td></tr><tr><td>检查报告</td><td>reportId；executionId + scopeCode + reportRevision。</td><td>报告不可覆盖；规则与程序版本、统计时点进入快照。</td></tr><tr><td>告警</td><td>incidentId；activeSlotKey 按规则和业务对象计算。</td><td>确认证据、恢复证据与被定位对象独立保存。</td></tr></tbody></table></div><p>海豚 Long 类型编码通过 JSON 字符串传输，避免浏览器 Number 精度损失。对重命名、版本变化、重新上线使用同一来源身份；不能凭名称近似匹配。原型的内部 jobId 继续用于历史引用，生产可归并为 accessId 的内部别名，但迁移不能重写历史报告和申请。</p><p class=\"flowtitle\">来源表同步关联</p><div class=\"flow\" role=\"group\" aria-label=\"来源表同步关联\"><span>1　数据源与来源表</span><span>2　同步映射</span><span>3　部署与运行引用</span><span>4　观测快照与告警</span></div><p class=\"flowtitle\">作业与质量关联</p><div class=\"flow\" role=\"group\" aria-label=\"作业与质量关联\"><span>1　统一接入对象</span><span>2　业务申请或检查任务</span><span>3　执行实例与报告</span><span>4　问题及告警证据</span></div><h3 id=\"b13\">3 1 建议数据字典</h3><div class=\"tablewrap\"><table><colgroup><col style=\"width:30.00%\"><col style=\"width:70.00%\"></colgroup><thead><tr><th scope=\"col\">表或聚合</th><th scope=\"col\">关键字段与约束</th></tr></thead><tbody><tr><td>data_source</td><td>id、tenant_id、env_id、name、system_name、type、note、version；同环境 name 唯一，无 owner。</td></tr><tr><td>source_table</td><td>id、source_id、table_name、business_name、note、version；source_id + table_name 唯一，无 owner。</td></tr><tr><td>sync_mapping</td><td>id、source_table_id、runtime_ref_id、target_connection_id、database_name、table_name、mode、origin、note、version。</td></tr><tr><td>runtime_ref 和 deployment_link</td><td>集群或服务连接、外部 jobId、deploymentId、Note/Paragraph、Topic/Group、算子或 Sink、valid_from/to；支持多对多与历史。</td></tr><tr><td>execution_access</td><td>id、tenant/env、engine、connection_id、external_key、source_name、alias、owner、monitor_enabled、ever_monitored、retired、last_seen、source_status、version。</td></tr><tr><td>access_version 和 executor_contract</td><td>定义或程序版本、definition_hash、参数 JSON Schema、scopeCode、ruleCode、输出资源组、输入可读范围、capability_status、验证记录。</td></tr><tr><td>recompute_policy</td><td>access_id、policy_version、enabled、definition_hash、max_days、scope_schema、operations、allowed_roles、write_strategy、evidence、verified_by/at。</td></tr><tr><td>execution_request</td><td>request_id、idempotency_key、access_id、operation、params、params_hash、policy_snapshot、definition_hash、request_state、actor、created_at、dispatch_state、version。</td></tr><tr><td>execution_instance 和 execution_node</td><td>external_id、request_id、access_id、attempt、raw_state、normalized_state、business_state、start/end、source_updated_at、collected_at、node external id/version。</td></tr><tr><td>quality_task</td><td>id、access_id、scope_code、name、owner、description、version；access + scope 与任务名称按租户环境约束唯一。</td></tr><tr><td>quality_report 和 rule_result</td><td>report/execution/task、业务日期、scope、contract/rule_version、cutoff、PASS/FAIL/UNKNOWN/SKIPPED、metric、threshold、denominator、exception_count、unit。</td></tr><tr><td>quality_issue 和 recheck_link</td><td>原 reportId/ruleCode、业务范围快照、成因、说明、复检报告、关闭依据；不覆盖旧报告。</td></tr><tr><td>collector_run 和 observation_latest</td><td>采集批次、覆盖范围、页数、读取数、完整性、提交结果、错误；最新观测保存 metricTime/collectedAt/freshUntil/quality。</td></tr><tr><td>alert_incident 和 alert_active_slot</td><td>incident 的发生与恢复、确认状态；active_slot 按 tenant/env/rule/object 唯一，防并发重复开启。</td></tr><tr><td>alert_evidence 和 event_inbox</td><td>事件 ID、来源序号、对象身份、原始事实摘要、处理版本；event_inbox 的 consumer + eventId 唯一。</td></tr><tr><td>event_outbox</td><td>事务事件、aggregateKey、payload、投递状态、次数、next_attempt；与业务变更同事务。</td></tr><tr><td>resource_reservation</td><td>输出资源组、业务范围、requestId、lease token、fencing epoch、状态与期限；活动重叠检查必须事务串行。</td></tr></tbody></table></div><p>所有事务表补齐创建更新时刻、逻辑状态、并发版本和必要的租户环境索引。日志正文与大量异常明细不塞入核心行；使用受控的明细存储引用、分页和保留策略。业务数据库的具体选型、字段长度及敏感字段处理在 DEC08 评审后冻结。</p><h2 id=\"b16\">4 本平台接口与统一错误契约</h2><p>以下 /api/data-center/v1 路径均为本平台建议新增接口，不是海豚或 Zeppelin 原生接口。API 返回的 accessId、requestId 等在传输层均为字符串；请求携带环境上下文，服务端结合授权范围校验。列表分页为 pageNo/pageSize，返回 total、snapshotAt 和组件时效。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:23.00%\"><col style=\"width:77.00%\"></colgroup><thead><tr><th scope=\"col\">接口组</th><th scope=\"col\">建议接口与行为</th></tr></thead><tbody><tr><td>来源资料</td><td>GET/POST /sources；GET/PATCH /sources/{id}；GET /sources/{id}/tables-summary。</td></tr><tr><td>来源表与映射</td><td>GET/POST /source-tables；PATCH /source-tables/{id}；GET/POST /source-tables/{id}/mappings；PATCH /mappings/{id}；DELETE /source-tables/{id}/mapping-links/{mappingId} 只解除引用。</td></tr><tr><td>接入与目录</td><td>GET /execution-access；GET /execution-access/{id}；PATCH /execution-access/{id}/metadata；PUT /execution-access/{id}/monitoring；POST /catalog-sync-runs；GET /catalog-sync-runs 及 /{id}。</td></tr><tr><td>Java 契约</td><td>POST /java-executors；PATCH /java-executors/{id}；GET /quality-executor-candidates；GET /execution-access/{id}/contract。登记不直接置为可执行。</td></tr><tr><td>补算设置</td><td>GET/PUT /execution-access/{id}/recompute-policy；写请求带 expectedDefinitionHash 和并发版本。</td></tr><tr><td>运行与申请</td><td>GET /job-monitor；GET /execution-access/{id}/executions；GET /executions/{id}；GET /executions/{id}/nodes；GET /nodes/{id}/logs；POST /execution-prechecks；POST /execution-requests；GET /execution-requests/{id}。</td></tr><tr><td>同步监控</td><td>GET /sync-observations；GET /mappings/{id}/observation；PUT /mappings/{id}/deployment-links；必要时 POST /observation-refresh-requests 仅入后台队列。</td></tr><tr><td>质量闭环</td><td>GET/POST /quality-tasks；PATCH /quality-tasks/{id}；POST /quality-tasks/{id}/executions；GET /quality-reports/{id} 及 /results、/samples；POST/PATCH /quality-issues；POST /quality-issues/{id}/rechecks、/{id}/close。</td></tr><tr><td>告警</td><td>GET /alarms；GET /alarms/{id}；POST /alarms/{id}/acknowledgements；GET /alarms/{id}/navigation-context。后者不代替目标接口最终鉴权。</td></tr></tbody></table></div><pre>PUT /api/data-center/v1/execution-access/ACC-10101/monitoring\nIf-Match: &quot;12&quot;\n{&quot;enabled&quot;: true}\n\n200\n{&quot;data&quot;:{&quot;accessId&quot;:&quot;ACC-10101&quot;,&quot;monitorEnabled&quot;:true,&quot;version&quot;:13},\n &quot;traceId&quot;:&quot;...&quot;,&quot;serverTime&quot;:&quot;2026-11-22T02:00:00Z&quot;}\n\n409\n{&quot;code&quot;:&quot;VERSION_CONFLICT&quot;,&quot;message&quot;:&quot;配置已被更新，请刷新后重试&quot;, &quot;traceId&quot;:&quot;...&quot;}</pre><p>并发版本可以使用 If-Match 或显式 expectedVersion，团队选择一种并统一。版本冲突不覆盖他人更新。批量接口即使未来加入，也按相同对象权限检查；本期 UI 保留逐项勾选，不恢复重复的监控范围弹窗。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:35.00%\"><col style=\"width:65.00%\"></colgroup><thead><tr><th scope=\"col\">HTTP 或业务错误</th><th scope=\"col\">处理</th></tr></thead><tbody><tr><td>400/422 参数或范围非法</td><td>回显字段与具体原因，不清空输入。</td></tr><tr><td>401 身份失效</td><td>提示重新认证，保留可安全保存的草稿，不返回目标数据。</td></tr><tr><td>403 动作或对象无权限</td><td>告警点击不跳页；直接 URL 不显示目标详情。</td></tr><tr><td>404 不存在或不可暴露</td><td>保留告警历史，提示目标不可访问；避免通过差异错误泄露跨范围对象。</td></tr><tr><td>409 并发 冲突 重复参数</td><td>返回 VERSION_CONFLICT、RANGE_CONFLICT 或 IDEMPOTENCY_CONFLICT。</td></tr><tr><td>202 已持久受理</td><td>返回本平台 requestId 和查询位置，不宣称外部任务已成功。</td></tr><tr><td>503 源或授权不可用</td><td>只读可返回标为过期的最后快照；写请求关闭放行。</td></tr></tbody></table></div><h2 id=\"b22\">5 海豚 3 1 9 的目录接入</h2><p>适配器以实际部署的 API 上下文路径作为 apiBase。3.1.9 定义控制器使用项目下 process-definition 路径，可分页查询和按 code 取详情或节点；下列只读接口已按标签源码核对。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessDefinitionController.java\">[DS1]</a></p><div class=\"tablewrap\"><table><colgroup><col style=\"width:24.00%\"><col style=\"width:76.00%\"></colgroup><thead><tr><th scope=\"col\">用途</th><th scope=\"col\">海豚相对路径及重点参数</th></tr></thead><tbody><tr><td>分页目录</td><td>GET /projects/{projectCode}/process-definition，pageNo、pageSize、searchVal 等。</td></tr><tr><td>定义详情</td><td>GET /projects/{projectCode}/process-definition/{code}。</td></tr><tr><td>定义节点</td><td>GET /projects/{projectCode}/process-definition/{code}/tasks；按实例查看节点时仍使用实例接口。</td></tr></tbody></table></div><p class=\"flowtitle\">完整目录采集</p><div class=\"flow\" role=\"group\" aria-label=\"完整目录采集\"><span>1　创建采集批次</span><span>2　遍历授权项目及分页</span><span>3　暂存并去重</span><span>4　完整性检查</span><span>5　提交新快照与差异</span></div><ul><li>CAT01 采集任务以 connectionId + projectSet 分片，后台周期执行。手工同步只创建同类采集请求；同分片已有采集中任务时合并或提示，不由浏览器逐页拉取。</li><li>CAT02 在 staging 或批次暂存区保存页码、总数、响应状态和对象稳定键。任一项目 403、超时、响应解析失败或分页中断，则该覆盖范围不提交删除或未发现判断。</li><li>CAT03 原生分页不是跨页事务快照。记录采集起止时刻与覆盖范围，检查重复键、页数和总数异常；必要时重读末页或重采集，不把本次一次缺失当作确定删除。</li><li>CAT04 完整采集后按来源稳定键 upsert 远端字段；监控标记、本地别名、退役原因、补算策略与质量引用分开更新。新发现定义默认不纳入监控。</li><li>CAT05 已上线、已下线来自 releaseState；本轮未发现来自完整授权采集的差异；不在采集范围来自配置变更；过期来自时效。它们不是同一个“停用”。</li><li>CAT06 连续缺失的次数、权限变更和项目覆盖都记录。缺失确认门槛待评审；建议连续完整采集多次并经源端核对再确认退役，不物理删除历史。</li></ul><p>服务账号凭据保存在后台配置中心或密钥系统；访问域名和路径白名单化，定期轮换。具体 token/header、项目授权和网关前缀以现网 3.1.9 部署联调核对，不在浏览器保存外部 token。</p><h2 id=\"b28\">6 海豚实例 节点与日志接入</h2><p>实例查询使用 process-instances 路径，注意 3.1.9 列表筛选参数名为 processDefineCode；详情与任务节点按实例 ID 查询。不要混用定义节点与实例运行节点，也不要使用名称搜索结果替代稳定 ID 关联。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessInstanceController.java\">[DS2]</a></p><div class=\"tablewrap\"><table><colgroup><col style=\"width:23.00%\"><col style=\"width:77.00%\"></colgroup><thead><tr><th scope=\"col\">用途</th><th scope=\"col\">已核对相对路径</th></tr></thead><tbody><tr><td>实例列表</td><td>GET /projects/{projectCode}/process-instances，processDefineCode、startDate、endDate、stateType、pageNo、pageSize。</td></tr><tr><td>实例详情</td><td>GET /projects/{projectCode}/process-instances/{id}。</td></tr><tr><td>实例节点</td><td>GET /projects/{projectCode}/process-instances/{id}/tasks。</td></tr><tr><td>项目内节点日志</td><td>GET /log/{projectCode}/detail，taskInstanceId、skipLineNum、limit。</td></tr></tbody></table></div><p>3.1.9 LoggerController 同时提供不带项目与带项目的日志路径，适配器优先使用带项目路径，并在本平台再次校验节点属于获授权的实例。日志按行增量读取、限流、截断与脱敏，浏览器传入的 taskInstanceId 不能直接透传。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/LoggerController.java\">[DS6]</a></p><p>下文 sourceRevision 或 sourceSequence 表示适配层的版本标识，不假定海豚原生响应一定提供单调序号。可基于源更新时间、attempt 与内容摘要构造；同一对象的采集串行化并用内部评估版本做 CAS。无法证明新旧顺序时保留证据并核对，不用较晚的采集时刻强行覆盖可信新状态。</p><ul><li>RUN01 后台按授权项目和时间窗口分页轮询实例，对运行中实例追加点查，对终态进行有限回补。增量窗口留重叠，按稳定实例键与 sourceRevision 去重，防止迟到状态漏采。</li><li>RUN02 同时保存 rawState、normalizedState、sourceUpdatedAt 与 collectedAt；未知新枚举映射为 UNKNOWN，记录告警，不静默映射为成功。失败后恢复产生的新 attempt 与旧失败证据分别保留。</li><li>RUN03 job-monitor 将每个获授权且纳入监控的 accessId 与最近实例关联，无执行时返回 null。数据与统计都在服务端按相同非状态筛选和权限范围计算；不要只统计当前分页。</li><li>RUN04 用户只具备海豚运行权限时，不返回 Java 作业、Java 选择项或其总数；统一菜单不合并授权范围。</li><li>RUN05 详情查询优先源事实或有时效标记的快照；接口不可达时保留已缓存结果和时间，不把缓存中的成功宣称为当前新事实。</li></ul><ul class=\"references\"><li>[DS1] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessDefinitionController.java\">DolphinScheduler 3.1.9 工作流定义控制器</a></li><li>[DS2] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessInstanceController.java\">DolphinScheduler 3.1.9 实例控制器</a></li><li>[DS6] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/LoggerController.java\">DolphinScheduler 3.1.9 日志控制器</a></li></ul><h2 id=\"b35\">7 Java 执行器的接入协议</h2><p>技术人员将已有程序包装为受信任的内部执行服务，在作业接入登记 serviceId、programId、version、参数契约和检查范围。登记只保存资料，不能直接把 ready 改为 true；适配验证至少覆盖启动、状态查询、重复 requestId、失败、超时以及结构化报告回传。程序地址与凭据只在后台连接配置中维护。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:39.00%\"><col style=\"width:61.00%\"></colgroup><thead><tr><th scope=\"col\">内部协议建议</th><th scope=\"col\">要求</th></tr></thead><tbody><tr><td>GET /internal/programs/{programId}/contract</td><td>返回程序版本、parameterSchema、支持的 scopeCode/ruleCode、结果协议版本和资源限制；不返回运行凭据。</td></tr><tr><td>POST /internal/executions</td><td>先持久化 requestId 幂等记录再受理；同 ID 同参数返回原执行，不同参数返回冲突。返回 202 与 runId。</td></tr><tr><td>GET /internal/executions/{runId}</td><td>返回真实运行状态、时间、进度、错误与业务结果状态，不能只有 HTTP 调用结果。</td></tr><tr><td>GET /internal/executions/by-request/{requestId}</td><td>提供启动响应丢失后的唯一关联查询；查不到但无法证明未受理时保持未知。</td></tr><tr><td>POST /internal/platform-execution-events</td><td>执行服务向管理层上报事件；鉴权、重放校验与 eventId 去重。状态查询用于回调丢失后的修复。</td></tr><tr><td>POST /internal/quality-reports</td><td>提交不可变结构化报告；校验执行身份、范围、版本和幂等，不接收任意存储路径。</td></tr></tbody></table></div><pre>POST /internal/executions\n{\n  &quot;requestId&quot;:&quot;REQ-20261122-001&quot;, &quot;programId&quot;:&quot;JAVA-MATCH&quot;,\n  &quot;programVersion&quot;:&quot;&lt;已核对版本&gt;&quot;, &quot;scopeCode&quot;:&quot;MATCH_LINK&quot;,\n  &quot;parameters&quot;:{&quot;bizDate&quot;:&quot;2026-11-09&quot;},\n  &quot;callbackRouteId&quot;:&quot;quality-events-v1&quot;\n}\n\n202\n{&quot;requestId&quot;:&quot;REQ-20261122-001&quot;,&quot;runId&quot;:&quot;JR-001&quot;,&quot;state&quot;:&quot;ACCEPTED&quot;}</pre><ul><li>JAVA01 controller 不在 HTTP 线程同步执行长任务；按既有线程池或任务队列持久化处理，并设置队列容量、超时、资源组并发与拒绝策略。不能只用进程内异步任务后立即返回成功。</li><li>JAVA02 已有程序可通过 ExecutionAdapter 接口接入：validateParameters、start、query、queryByRequest、fetchReport。状态与业务结果采用独立字段。连接发现、HTTP、MQ 或直接服务调用由受信任适配层决定，不让页面自行指定。</li><li>JAVA03 执行器重启后从持久运行记录恢复或核实，不因进程退出把所有运行记录标为失败或成功。失联是 UNKNOWN，超时是否已停止需真实程序证据。</li><li>JAVA04 taskId/accessId/runId 与调用方身份由服务端关联；回调中的这些字段只能用于一致性核对，不能用来绕过本平台对象授权。</li></ul><h2 id=\"b40\">8 Zeppelin 与 Flink 的关联观测</h2><p>Zeppelin 0.10.1 可查询 Notebook 清单、Note 详情及 Note 下段落状态。它适合作为开发和提交来源的关联信息，持续同步的运行事实仍取自实际 Flink 作业和 Sink。以下只读能力已按 0.10.1 文档核对。<a href=\"https://zeppelin.apache.org/docs/0.10.1/usage/rest_api/notebook.html\">[Z1]</a></p><div class=\"tablewrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:36.00%\"><col style=\"width:44.00%\"></colgroup><thead><tr><th scope=\"col\">信息</th><th scope=\"col\">接口或标识</th><th scope=\"col\">处理</th></tr></thead><tbody><tr><td>Note 清单</td><td>GET /api/notebook</td><td>读取授权可见 Note；目录名称不作为运行身份。</td></tr><tr><td>段落信息</td><td>GET /api/notebook/{noteId}</td><td>取得 paragraphId 与配置；不把全部段落代码下发业务页面。</td></tr><tr><td>段落状态</td><td>GET /api/notebook/job/{noteId}</td><td>保存每个段落的状态和时间；FINISHED 只说明段落结束。</td></tr><tr><td>Flink 关联</td><td>clusterId + deploymentId + jobId</td><td>启动或部署服务回写关联；缺少回写时由技术人员登记并核对。</td></tr></tbody></table></div><p>一个 Note/Paragraph 可产生多个 Flink 作业，一个 Flink 作业也可覆盖多张表。deployment_link 保存多对多关系和有效期；重提生成新 jobId 时结束旧关联，新增部署关联，保留旧历史。不以同名或日志中的模糊片段自动覆盖当前关系。</p><p>本期页面只读 Zeppelin 并登记关联，不运行或重启段落。若现网并非 0.10.1，先验证登录方式、权限、接口路径和 Interpreter/Flink 兼容；本方案不把 2022 基线当作已安装版本。</p><h2 id=\"b45\">9 持续同步指标与状态判定</h2><p>Flink 1.14 参考接口包括 GET /jobs/{jobid}、/jobs/{jobid}/metrics、算子指标与 checkpoint 信息。先发现可用指标，再由版本适配配置映射到标准指标；不能假设每个 CDC 或 Sink 都提供相同的 lag 名称。<a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.14/docs/ops/rest_api/\">[F1]</a></p><div class=\"tablewrap\"><table><colgroup><col style=\"width:24.00%\"><col style=\"width:34.00%\"><col style=\"width:42.00%\"></colgroup><thead><tr><th scope=\"col\">指标或事实</th><th scope=\"col\">关联维度</th><th scope=\"col\">判定要求</th></tr></thead><tbody><tr><td>Flink 状态和重启</td><td>cluster/deployment/job/attempt</td><td>保留运行、重启、失败、取消与无法查询等原始事实。</td></tr><tr><td>读取位置与初始化</td><td>CDC source、分片或表、快照阶段</td><td>全量初始化与持续增量分别建模；快照尚未完成不显示为同步完整。</td></tr><tr><td>MQ 积压</td><td>集群、Topic、Group、分区或队列</td><td>记录 lag 条数或 offset 差和单位；不能直接换算成延迟秒数。</td></tr><tr><td>时间延迟</td><td>metric timestamp、业务事件或提交时间</td><td>只有可靠时间戳及明确口径时生成秒数；空闲场景结合心跳与位置判断。</td></tr><tr><td>checkpoint</td><td>Flink job 与最新成功 checkpoint</td><td>反映流作业容错进展；并不自动证明业务写入与源数据逐行一致。</td></tr><tr><td>Doris Sink 写入</td><td>sink operator、目标连接、库表、批次或 label</td><td>读取失败/提交/可见性等回执；Flink 处理成功或 MQ 消费成功不能替代目标可见性。</td></tr></tbody></table></div><p>Kafka 的消费与客户端指标、RocketMQ 的消息键和消费实践可作为观测接入依据，但真实监控入口取决于现网 broker、客户端、Exporter 或既有监控平台；不要要求新增两套 broker 或默认存在某个指标接口。<a href=\"https://kafka.apache.org/38/operations/monitoring/\">[K1]</a> <a href=\"https://rocketmq.apache.org/docs/4.x/bestPractice/01bestpractice/\">[R1]</a></p><pre>{\n &quot;mappingId&quot;:&quot;MAP-ORDER-01&quot;,&quot;deploymentId&quot;:&quot;DEP-20261120-01&quot;,\n &quot;source&quot;:&quot;FLINK&quot;,&quot;metric&quot;:&quot;sink_commit_lag&quot;,&quot;value&quot;:128,&quot;unit&quot;:&quot;s&quot;,\n &quot;metricTime&quot;:&quot;2026-11-22T02:00:00Z&quot;,&quot;collectedAt&quot;:&quot;2026-11-22T02:00:02Z&quot;,\n &quot;freshUntil&quot;:&quot;2026-11-22T02:01:02Z&quot;,&quot;quality&quot;:&quot;VALID&quot;,&quot;sourceSequence&quot;:1042\n}</pre><div class=\"tablewrap\"><table><colgroup><col style=\"width:23.00%\"><col style=\"width:77.00%\"></colgroup><thead><tr><th scope=\"col\">归一化状态</th><th scope=\"col\">规则建议</th></tr></thead><tbody><tr><td>未关联</td><td>来源表没有同步映射，只在资料清单显示，不加入同步故障指标。</td></tr><tr><td>无法判断</td><td>连接不可达、无权限、关联失效、必需指标缺失或快照过期；保留最后可信值并标明时间。</td></tr><tr><td>失败</td><td>已获得运行任务失败或写入端确定失败的可信事实，按规则持续条件触发。</td></tr><tr><td>延迟</td><td>任务仍可运行，但有可靠单位的延迟超阈值；建议连续窗口确认并使用恢复回差。</td></tr><tr><td>正常</td><td>必需指标完整、未过期，源运行和目标写入条件满足规则。仅代表该观测口径，不代表业务数据完整。</td></tr></tbody></table></div><ul><li>OBS01 多表共用任务时区分任务级与表级指标，缺少表级指标就显示任务级共享，不复制成每表精确值。</li><li>OBS02 观测状态由配置的必需项组合，不取一个“心跳正常”覆盖全部下游异常。时间倒退、未来时间和不同采集点的时钟偏差要记录可信度。</li><li>OBS03 样例正常阈值、采集间隔和过期 TTL 均需业务与运维评审。无新业务数据时可保持 IDLE，不凭“现在减最大业务时间”自动报错。</li><li>OBS04 平台只采集与关联，不通过同步监控重放 MQ、重置 CDC 位置、重启流或执行源目标全表 COUNT 核对。业务一致性由有明确截止范围的质量检查完成。</li></ul><h2 id=\"b52\">10 补算与失败重试的执行方案</h2><p>补算能力由程序契约、当前定义签名、技术验证和平台策略决定；发起权限由用户动作与数据范围决定。两者同时满足才允许提交。原型的已验证选择是备案表现，生产必须对应真实验证证据，不能单靠页面开关保证写入安全。</p><p class=\"flowtitle\">后台受理链路</p><div class=\"flow\" role=\"group\" aria-label=\"后台受理链路\"><span>1　鉴权与契约预检</span><span>2　锁定并校验资源范围</span><span>3　申请预约事件同事务</span><span>4　适配器提交</span><span>5　核对外部实例</span><span>6　输出验收与释放预约</span></div><h3 id=\"b55\">10 1 命令语义与参数</h3><p>3.1.9 通过项目下 executors/start-process-instance 发起新执行，通过 executors/execute 对已有实例执行动作。实例操作枚举中存在重复运行、失败恢复、停止和暂停等能力，平台仅映射经过验证且获授权的操作，不按枚举全量开放。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ExecutorController.java\">[DS3]</a> <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/enums/ExecuteType.java\">[DS5]</a></p><div class=\"tablewrap\"><table><colgroup><col style=\"width:23.00%\"><col style=\"width:38.00%\"><col style=\"width:39.00%\"></colgroup><thead><tr><th scope=\"col\">平台操作</th><th scope=\"col\">建议映射</th><th scope=\"col\">限制</th></tr></thead><tbody><tr><td>业务日期补算</td><td>向已备案工作流发起新执行，传 start_date/end_date、requestId 与范围参数。</td><td>工作流必须真正按参数读取和写入该范围，不得只改变显示日期。</td></tr><tr><td>原失败实例恢复</td><td>使用原 processInstanceId，经验证后映射 START_FAILURE_TASK_PROCESS。</td><td>确认实例处于允许状态、参数和版本一致、恢复节点不会重复污染输出。</td></tr><tr><td>整次重新运行</td><td>仅在明确验证后映射 REPEAT_RUNNING 或新实例重算。</td><td>不把它和从失败节点恢复混为同一按钮语义。</td></tr><tr><td>原生调度补数</td><td>仅当业务采用海豚 scheduleTime 和 COMPLEMENT_DATA 语义时考虑。</td><td>可能创建多个调度实例，不作为业务日期补算的默认实现。</td></tr><tr><td>停止 暂停 强制成功</td><td>本期普通运营不开放。</td><td>需要技术故障处置时走既有运维渠道与授权，不能认为停止必然回滚已写数据。</td></tr></tbody></table></div><p>DS 控制器和服务实现表明启动返回反映命令受理或创建结果，不能假设同步返回可唯一使用的最终实例 ID。执行管理层先生成并持久化 requestId，将其作为经验证的全局参数传入；之后通过唯一可核验的实例元信息或工作流首节点回写关联 instanceId。匹配不到、匹配到多个或查询受限时保持待核实，不按名称和最近时间猜测。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ExecutorController.java\">[DS3]</a> <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/service/impl/ExecutorServiceImpl.java\">[DS4]</a></p><h3 id=\"b59\">10 2 预校验与幂等</h3><ul><li>EX01 预检只帮助解释错误，不是提交授权票据。最终提交同一事务内重验身份、数据范围、程序可用性、当前定义 hash、策略版本、参数和输入可读范围。</li><li>EX02 日期按作业时区和含首尾结果日计算；限制最大跨度、回看范围、商户/账号与输出范围。HTTP 参数通过契约白名单规范化，拒绝未知字段及任意 SQL 条件。</li><li>EX03 同一 idempotencyKey 和相同参数返回原 requestId；同 key 不同参数拒绝。相同业务请求使用不同 key 时，仍按活动请求和输出范围检查重复或冲突。已完成后的明确再次补算，依策略作为新申请留痕。</li><li>EX04 request 与 outbox 同事务提交后返回 202。dispatcher 使用持久状态机和 CAS 获取提交权；事件重复投递不能再次调用外部启动接口。</li><li>EX05 调用前记录 DISPATCHING；调用响应丢失或进程在调用前后崩溃时进入 PENDING_CONFIRMATION。先 queryByRequest 或核对源实例，不能自动重发没有原生幂等保证的海豚启动命令。</li><li>EX06 outbox/inbox 解决事件持久化与重复消费，不自动实现跨系统 exactly-once。Java 适配服务必须实现 requestId 的持久幂等；海豚部分需应用级防重复、唯一关联与未知提交核对。</li></ul><pre>POST /api/data-center/v1/execution-requests\nIdempotency-Key: 8f...c1\n{\n &quot;accessId&quot;:&quot;ACC-10101&quot;,&quot;operation&quot;:&quot;BUSINESS_RECOMPUTE&quot;,\n &quot;expectedDefinitionHash&quot;:&quot;sha256:...&quot;,&quot;expectedPolicyVersion&quot;:4,\n &quot;parameters&quot;:{&quot;start_date&quot;:&quot;2026-11-09&quot;,&quot;end_date&quot;:&quot;2026-11-09&quot;},\n &quot;reason&quot;:&quot;修复输入后补算该业务日期&quot;\n}\n\n202\n{&quot;data&quot;:{&quot;requestId&quot;:&quot;REQ-001&quot;,&quot;requestState&quot;:&quot;ACCEPTED&quot;,\n &quot;executionState&quot;:null,&quot;externalInstanceId&quot;:null},&quot;traceId&quot;:&quot;...&quot;}</pre><div class=\"tablewrap\"><table><colgroup><col style=\"width:34.00%\"><col style=\"width:66.00%\"></colgroup><thead><tr><th scope=\"col\">申请状态</th><th scope=\"col\">含义与允许动作</th></tr></thead><tbody><tr><td>ACCEPTED / QUEUED</td><td>申请已持久受理或等待资源，尚不宣称源任务在运行。</td></tr><tr><td>DISPATCHING</td><td>适配器提交中；重复事件只能查询，不再发起一次启动。</td></tr><tr><td>PENDING_CONFIRMATION</td><td>是否已启动或实例关联不确定；允许查询原请求，禁止盲目重提。</td></tr><tr><td>RUNNING</td><td>已有可核验的实际实例，保留源端细分状态。</td></tr><tr><td>SUCCEEDED / FAILED</td><td>实际执行终态；业务输出或质量结论另有字段。</td></tr><tr><td>REJECTED / SUBMIT_FAILED</td><td>预检拒绝或能够证明未受理的提交失败；是否可再次提交由错误类型决定。</td></tr></tbody></table></div><h3 id=\"b63\">10 3 并发与写入一致性</h3><p>互斥依据输出资源组与业务范围，而非仅 jobId。不同工作流写同一目标表，日期区间部分重叠，定时作业与人工补算并发，都可能冲突。建议在事务库锁定 resourceGroup 的协调行，在同一事务中检查活动区间并登记预约；不能仅使用“开始日期+结束日期”字符串锁，因为两个不同锁名的区间仍可能重叠。</p><p>Redis 可用于快速竞争、租约与限流，但正确性依赖持久预约、带持有者 token 的续约与释放、版本或 fencing epoch 和写入端检查。锁过期或 Redis 故障不能证明旧执行已停止。Redis 官方锁模式说明了 NX、过期与核对持有者的重要性，本方案额外要求业务写入端配合以防过期执行继续提交。<a href=\"https://redis.io/docs/latest/manual/patterns/distributed-locks/\">[L1]</a></p><ul><li>WRITE01 所有可能写同一范围的入口，包括原有海豚定时执行，都需要接入同一资源检查，或经过验证的其他隔离措施。只给人工补算加锁，无法约束平台外定时实例；未解决前不开放该作业补算。</li><li>WRITE02 业务键、分区和参数范围必须落实到实际查询与写入。优先业务唯一键覆盖或暂存结果经检查后发布；禁止泛化的无隔离 DELETE 再 INSERT。</li><li>WRITE03 Doris Unique Key 和 Merge-on-Write 能力取决于版本与表模型；官方 1.2 发布说明包含 MOW 支持，但不能据此假设现有表已具备该模型或默认配置。与 CDC 并发写同一目标时，还须确定更新顺序、版本和范围所有权。<a href=\"https://doris.apache.org/releases/v1.2/release-1.2.0/\">[D1]</a></li><li>WRITE04 申请、真实实例、输入范围、输出版本与验证结果形成完整关联。失败可能已经部分写入，不能把任务失败理解为自动回滚；按作业恢复契约清理暂存或修复输出。</li><li>WRITE05 运行失联或提交未知期间保留冲突预约，达到人工核实条件后再释放或恢复。不能仅凭缓存 TTL 释放后继续写入同一范围。</li></ul><h2 id=\"b67\">11 数据质量任务与执行</h2><p>质量任务 API 使用 accessId 与稳定 scopeCode 选择已有执行器。原型的 jobId 与 jobId:S1 属于内部实现形式；生产迁移要建立 scopeCode 映射，不能以范围名称或数组位置作为长期稳定身份。没有内部引用的目录对象，在保存任务事务中自动创建一次，用户无需新增业务作业。</p><ul><li>DQTECH01 候选查询只返回允许用于质量检查的执行器、备案范围与状态。配置任务与登记程序分开，任务保存不触发执行。</li><li>DQTECH02 事务中校验名称与 accessId + scopeCode 唯一；任务运行中或结果未知时禁止换绑定，版本冲突使用 optimistic locking。</li><li>DQTECH03 表单跨页维护保留草稿；返回时再次验证候选身份和范围。新增执行器可以被选择，但待接入状态仍禁止发起检查。草稿不能作为服务端授权。</li><li>DQTECH04 执行请求包含 taskVersion、accessVersion、scopeCode、bizDate、cutoff、ruleSetVersion 与 requestId。执行开始冻结快照，后续修改任务不会改变旧报告解释。</li><li>DQTECH05 定时质量检查优先由已有海豚或既有任务触发同一执行服务；手动执行和定时执行复用鉴权后的内部协议。平台不再建设一套通用 DAG 调度器。</li></ul><h3 id=\"b70\">11 1 检查程序与 Doris 查询</h3><p>Java 检查程序使用受控 Doris JDBC 只读账号执行已评审 SQL，或调用既有海豚检查工作流。检查按业务日期、分区或明确范围裁剪，参数化绑定日期和业务键；库表及字段名来自白名单配置而不是用户自由拼接。检查可重复运行，但不默认修改被检查数据。</p><pre>-- C15 逻辑示意 库表 字段 分区与空值规则以现网字典为准\nSELECT COUNT(*) AS missing_match_rows\nFROM t_order_detail d\nLEFT JOIN s_match_info m ON d.match_id = m.id\nWHERE d.biz_date = ?\n  AND d.match_id IS NOT NULL\n  AND m.id IS NULL;\n\n-- D02 按已维护码表核验 实际字段与码表需确认\nSELECT d.code_value, COUNT(*) AS invalid_row_count\nFROM approved_detail_view d\nLEFT JOIN approved_code_dictionary c\n  ON d.code_type = c.code_type AND d.code_value = c.code_value\nWHERE d.biz_date = ? AND c.code_value IS NULL\nGROUP BY d.code_value;</pre><p>上述 SQL 仅表达反关联检查思路，不是可直接上线的 SQL。需确认 match_id 空值是否另作检查、主档是否按同一有效时点读取、码表的生效范围、重复主键导致的 JOIN 放大、业务日期字段与迟到数据窗口。COUNT 的统计单位必须明确为行或行次。</p><ul><li>DQTECH06 检查水位须包含快照或截止时点。持续 CDC 尚未追平、输入分区未就绪或数据仍变化时返回 NOT_READY/UNKNOWN，不能以本次零行输入判为全部通过。</li><li>DQTECH07 每个执行器声明支持的 ruleCode，任务只运行其范围。C15 与 D02 为原型样例，历史 79/81、412 行与 12 行次不构成所有程序的统一实现清单。</li><li>DQTECH08 设置查询超时、并发池、最大样本、取消或超时状态核对与资源组。先按分区聚合，再采样异常；避免每次打开报告重做全表 JOIN。</li></ul><h2 id=\"b75\">12 报告 回调与问题复检</h2><pre>{\n &quot;eventId&quot;:&quot;evt-report-001&quot;,&quot;requestId&quot;:&quot;REQ-001&quot;,&quot;executionId&quot;:&quot;EX-001&quot;,\n &quot;reportId&quot;:&quot;QR-001&quot;,&quot;reportRevision&quot;:1,&quot;scopeCode&quot;:&quot;MATCH_LINK&quot;,\n &quot;bizDate&quot;:&quot;2026-11-09&quot;,&quot;cutoff&quot;:&quot;2026-11-10T00:00:00+08:00&quot;,\n &quot;programVersion&quot;:&quot;&lt;已核对版本&gt;&quot;,&quot;ruleSetVersion&quot;:&quot;risk-base-v1&quot;,\n &quot;results&quot;:[{&quot;ruleCode&quot;:&quot;C15&quot;,&quot;state&quot;:&quot;FAIL&quot;,&quot;required&quot;:true,\n   &quot;metric&quot;:&quot;missing_match_rows&quot;,&quot;value&quot;:412,&quot;unit&quot;:&quot;row&quot;,\n   &quot;exceptionCount&quot;:412,&quot;denominator&quot;:null,&quot;sampleRef&quot;:&quot;SAMPLE-001&quot;}]\n}</pre><p>样例复用原型中的 412 行，仅用于解释字段；分母未知时使用 null，不伪造通过率。每个结果保留 required、阈值与比较符、metric、单位和错误信息。所有必检项可信 PASS 才可生成整体通过；必检 UNKNOWN、缺项或 SKIPPED 不算通过。执行成功与报告已生成是两个独立维度。</p><ul><li>REPORT01 接收端先鉴权并验证请求、程序版本、范围、统计时点与规则集合，再按 eventId、reportId 和 revision 去重。相同 reportId 不同摘要属于冲突，应拒绝并告警，不能覆盖。</li><li>REPORT02 元数据和规则结果保存于事务或报告存储；大量脱敏异常明细可进入 Doris 专用结果表或既有受控对象存储。samples 接口校验报告权限，分页限量，不接受用户传任意文件 URL。</li><li>REPORT03 回调签名或内部身份采用现有服务安全方案，校验时间窗、重放与服务来源。重复事件 ACK 成功但不重复入库；状态查询和报告补拉修复回调丢失。</li><li>REPORT04 问题保留原 reportId、ruleCode、scope、bizDate 与版本快照。复检调用同一执行链路；关闭时后台核对同范围同日期的对应规则通过且版本可比较，不能引用另一任务的通过结果。</li><li>REPORT05 复检报告新增，原失败报告不变；不通过复检或没有可信报告时禁止把问题改为已解决。人工说明和确认不能替代检查证据。</li></ul><ul class=\"references\"><li>[Z1] <a href=\"https://zeppelin.apache.org/docs/0.10.1/usage/rest_api/notebook.html\">Zeppelin 0.10.1 Notebook REST API</a></li><li>[F1] <a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.14/docs/ops/rest_api/\">Flink 1.14 REST API 参考</a></li><li>[K1] <a href=\"https://kafka.apache.org/38/operations/monitoring/\">Kafka 3.8 监控指标参考</a></li><li>[R1] <a href=\"https://rocketmq.apache.org/docs/4.x/bestPractice/01bestpractice/\">RocketMQ 4.x 最佳实践</a></li><li>[DS3] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ExecutorController.java\">DolphinScheduler 3.1.9 执行控制器</a></li><li>[DS4] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/service/impl/ExecutorServiceImpl.java\">DolphinScheduler 3.1.9 执行服务实现</a></li><li>[DS5] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/enums/ExecuteType.java\">DolphinScheduler 3.1.9 实例操作枚举</a></li><li>[D1] <a href=\"https://doris.apache.org/releases/v1.2/release-1.2.0/\">Doris 1.2 发布说明</a></li><li>[L1] <a href=\"https://redis.io/docs/latest/manual/patterns/distributed-locks/\">Redis 分布式锁说明</a></li></ul><h2 id=\"b80\">13 告警事件与生命周期</h2><p>告警由后台采集事实、执行回调、结构化报告与规则评估产生。建议采用持久事件加规则评估器；小规模初期可同一 Java 应用内通过事务 outbox worker 实现，后续再拆 worker，不要求一开始引入复杂流处理平台。</p><p class=\"flowtitle\">告警处理</p><div class=\"flow\" role=\"group\" aria-label=\"告警处理\"><span>1　事实或指标事件</span><span>2　入库与去重</span><span>3　规则判断</span><span>4　更新同一告警周期</span><span>5　站内展示与目标定位</span></div><pre>{\n &quot;eventId&quot;:&quot;evt-001&quot;,&quot;eventType&quot;:&quot;EXECUTION_STATE_CHANGED&quot;,&quot;schemaVersion&quot;:1,\n &quot;aggregateKey&quot;:&quot;DS:DS-MAIN:200:10101:88801:1&quot;,\n &quot;sourceSequence&quot;:17,&quot;occurredAt&quot;:&quot;2026-11-22T02:00:00Z&quot;,\n &quot;observedAt&quot;:&quot;2026-11-22T02:00:02Z&quot;,\n &quot;tenantId&quot;:&quot;...&quot;,&quot;envId&quot;:&quot;prod&quot;,&quot;objectId&quot;:&quot;EX-001&quot;,\n &quot;payload&quot;:{&quot;rawState&quot;:&quot;FAILURE&quot;,&quot;state&quot;:&quot;FAILED&quot;,&quot;accessId&quot;:&quot;ACC-10101&quot;}\n}</pre><ul><li>ALTECH01 业务变更和 outbox 同事务保存；发送后可能因 ACK 丢失重复投递。消费端以 consumerName + eventId 建唯一约束，事务更新事实、告警和 inbox 后再 ACK。</li><li>ALTECH02 aggregateKey 对应稳定业务对象；保存 sourceSequence/attempt 或评估版本，旧事件不覆盖新状态。仅使用事件时间排序不够，因为不同机器时钟和重试可能乱序。</li><li>ALTECH03 active_slot 在 tenant/env/rule/objectFingerprint 上唯一；创建新 incident 与占用 slot 同事务。持续异常更新本轮 incident，不每次轮询新建一条。重复事件不增加 occurrences。</li><li>ALTECH04 恢复后释放 active_slot 并保留历史；再发生进入新一轮 incident。确认状态与异常状态分开，确认不改变 active/recovered。</li><li>ALTECH05 采用一种已确认的 MQ 通道，按对象聚合键分配有序处理分片；即使通道有顺序能力，消费端仍做版本检查和幂等，保留死信与重放流程。</li></ul><div class=\"tablewrap\"><table><colgroup><col style=\"width:24.00%\"><col style=\"width:76.00%\"></colgroup><thead><tr><th scope=\"col\">规则类型</th><th scope=\"col\">开启与恢复证据</th></tr></thead><tbody><tr><td>海豚或 Java 实例失败</td><td>开启绑定具体实例及 attempt。相同实例恢复至可信成功，或经验证的关联重试修复同参数输出，才解除对应故障；原失败记录不被篡改。</td></tr><tr><td>作业健康异常</td><td>若业务需要按作业聚合，规则明确业务日期或输出范围，并绑定造成异常的执行。无关日期的下一次成功不能自动消除旧范围异常。</td></tr><tr><td>同步延迟</td><td>可信指标持续超阈值开启，连续可信正常窗口并满足回差后恢复；规则级别与时长待 DEC05 确认。</td></tr><tr><td>采集不可用</td><td>连接或采集连续不可用开启独立采集告警，采集恢复且成功完成有效采集后恢复；不清除业务异常。</td></tr><tr><td>质量异常</td><td>绑定 task/scope/rule/bizDate，新的同范围复检报告通过后恢复；历史报告与人工问题关闭保留独立事实。</td></tr><tr><td>目录异常</td><td>完整目录采集失败或长期未成功时开启，后续完整可信采集成功恢复；一次不完整分页不更改现有目录身份。</td></tr></tbody></table></div><p>恢复事件需要关联原 incident 或可重现的规则对象键，并保留 evidenceId、recoveredAt、恢复原因和评估版本。没有数据、确认告警、取消监控或目标不可访问都不是自动恢复证据。告警摘要也按租户、环境与授权摘要范围过滤，不能借可读告警泄露原始 SQL、密钥或完整敏感业务键。</p><h2 id=\"b87\">14 Gateway 与业务定位权限</h2><p>沿用企业 Spring Cloud Gateway 作为入口，使用已有认证与权限服务。Gateway 的 GlobalFilter/GatewayFilter 可组织入口校验，但过滤器本身不等于已经有完整授权能力。Spring 官方资料说明过滤链及顺序机制，具体版本和鉴权实现需按现网确认。<a href=\"https://docs.spring.io/spring-cloud-gateway/docs/3.1.10/reference/html/\">[G1]</a></p><ul><li>SEC01 Gateway 校验 token/session、环境、动作码与基本路由权限；删除客户端伪造的用户与授权内部头，再写入经验证的上下文或传递可核验身份。业务服务禁止公网绕过入口，内部也核对调用身份。</li><li>SEC02 服务层使用统一授权组件核对 accessId、sourceId、mappingId、reportId 所属项目、商户、环境和字段范围。用户 ID、tenantId、管理员标志不能由请求体自证。</li><li>SEC03 若现网使用 JWT 或 opaque token，就沿用对应校验链路；只有既有 OAuth2 登录体系需要时才评估 TokenRelay，不把 OAuth2、TokenRelay 当作 Gateway 的默认前提。</li><li>SEC04 前端菜单与按钮用于交互，真正授权在 API。告警前往按钮保留；点击时可查 navigation-context，但最终目标列表、详情和日志接口仍独立鉴权。权限在两次请求间被收回也必须拒绝。</li><li>SEC05 401、403、权限服务 503 分开处理；只读保留的旧数据标明时效，禁止把权限系统不可用当作允许写入。生产完成权限缓存 TTL、撤权失效、审计和跨服务身份联调。</li></ul><h3 id=\"b90\">14 1 动作码与原型差异补齐</h3><div class=\"tablewrap\"><table><colgroup><col style=\"width:23.00%\"><col style=\"width:31.00%\"><col style=\"width:46.00%\"></colgroup><thead><tr><th scope=\"col\">对象</th><th scope=\"col\">读取</th><th scope=\"col\">写入或执行</th></tr></thead><tbody><tr><td>数据源</td><td>data:source:read</td><td>建议 data:source:manage，原型没有单独演示全部细分授权。</td></tr><tr><td>来源表与映射</td><td>data:table:read</td><td>建议 data:table:manage、data:mapping:manage。</td></tr><tr><td>同步监控与关联</td><td>data:sync:read</td><td>建议 data:sync-association:manage。</td></tr><tr><td>海豚运行 Java 运行</td><td>data:batch:read / data:job:read</td><td>data:job:recompute；按对应来源及数据范围复核。</td></tr><tr><td>作业接入</td><td>data:job-binding:read 或对应执行器读取</td><td>data:job-binding:manage；监控选择使用 data:monitor:configure。</td></tr><tr><td>补算配置</td><td>data:policy:read</td><td>data:policy:manage，与发起补算分开。</td></tr><tr><td>质量任务与报告</td><td>data:quality:read</td><td>建议 data:quality:manage、data:quality:execute、data:quality-issue:manage。</td></tr><tr><td>目录采集与诊断</td><td>data:catalog:sync:read</td><td>建议 data:catalog:sync:execute；连接配置沿用 data:settings:manage。</td></tr><tr><td>告警</td><td>monitor:alarm:read</td><td>monitor:alarm:ack，不授予目标页读取。</td></tr></tbody></table></div><p>表中“建议”权限是生产必须补齐的动作粒度，不代表原型已展示这些权限管理页面。示例角色不自动等于生产授权；每个用户可同时拥有海豚运行权限、没有同步监控权限。数据源摘要只返回该来源内的表名、业务名称与映射有无，不因来源读取权返回完整任务日志。</p><h3 id=\"b93\">14 2 告警跳转与返回</h3><pre>GET /api/data-center/v1/alarms/AL-001/navigation-context\n200\n{&quot;data&quot;:{&quot;target&quot;:{&quot;page&quot;:&quot;job-monitor&quot;,&quot;kind&quot;:&quot;EXECUTION&quot;,\n &quot;accessId&quot;:&quot;ACC-10101&quot;,&quot;executionId&quot;:&quot;EX-OLD-FAILED&quot;},\n &quot;authorizationVersion&quot;:&quot;...&quot;},&quot;traceId&quot;:&quot;...&quot;}\n\n-- 最终业务查询仍会鉴权 不信任上一步已通过\nGET /api/data-center/v1/job-monitor?focusExecutionId=EX-OLD-FAILED\n403\n{&quot;code&quot;:&quot;FORBIDDEN&quot;,&quot;message&quot;:&quot;您暂无作业监控访问权限&quot;,&quot;traceId&quot;:&quot;...&quot;}</pre><p>前端先保存告警筛选、草稿和分页，成功取得目标页授权数据后再切换视图；目标以枚举 page/kind 与稳定 ID 描述，不允许服务端返回任意跳转 URL。无权时停留原页且不丢失告警筛选；有权时筛选并高亮原记录，详情由用户主动打开。返回时恢复目标页原筛选及告警上下文；清除定位只清临时 focus，不清用户先前条件。</p><p>外部“打开海豚”等入口使用后台白名单连接生成地址。外部系统独立鉴权，平台不把服务 token 放入 URL；若不具备统一登录，明确说明需要已有海豚账号，不能承诺平台授权等于海豚授权。</p><h2 id=\"b97\">15 元数据事务与关键表样例</h2><p>下面为 MySQL 8 设计示意，展示关键唯一约束与并发字段，不是完整建库脚本。真实字段长度、索引、分区、字符集与存储选型需 DBA 结合容量评审；所有索引查询都含租户环境或先完成作用域过滤。</p><pre>CREATE TABLE execution_request (\n  request_id VARCHAR(64) PRIMARY KEY,\n  tenant_id VARCHAR(64) NOT NULL,\n  env_id VARCHAR(32) NOT NULL,\n  idempotency_key VARCHAR(128) NOT NULL,\n  access_id VARCHAR(64) NOT NULL,\n  operation VARCHAR(40) NOT NULL,\n  params_hash CHAR(64) NOT NULL,\n  params_json JSON NOT NULL,\n  request_state VARCHAR(32) NOT NULL,\n  external_instance_id VARCHAR(128) NULL,\n  definition_hash CHAR(64) NOT NULL,\n  policy_version BIGINT NOT NULL,\n  actor_id VARCHAR(64) NOT NULL,\n  version BIGINT NOT NULL DEFAULT 0,\n  created_at DATETIME(3) NOT NULL,\n  updated_at DATETIME(3) NOT NULL,\n  UNIQUE KEY uk_request_idem (tenant_id,env_id,idempotency_key),\n  KEY ix_request_reconcile (request_state,updated_at)\n);\n\nCREATE TABLE alert_active_slot (\n  tenant_id VARCHAR(64) NOT NULL,\n  env_id VARCHAR(32) NOT NULL,\n  rule_id VARCHAR(64) NOT NULL,\n  object_hash CHAR(64) NOT NULL,\n  incident_id VARCHAR(64) NOT NULL,\n  version BIGINT NOT NULL DEFAULT 0,\n  PRIMARY KEY(tenant_id,env_id,rule_id,object_hash)\n);\n\nCREATE TABLE event_inbox (\n  consumer_name VARCHAR(64) NOT NULL,\n  event_id VARCHAR(128) NOT NULL,\n  payload_hash CHAR(64) NOT NULL,\n  processed_at DATETIME(3) NOT NULL,\n  PRIMARY KEY(consumer_name,event_id)\n);</pre><p>告警周期历史在 alert_incident 中，active_slot 只保证当前活动唯一；不能用一个允许 NULL 的唯一字段替代活动唯一约束。质量任务也以事务唯一索引保证 access + scope 和名称唯一，不能只靠前端查询查重。Outbox 至少建立待发送状态与 next_attempt 的复合索引。</p><pre>-- 资源组范围预约的事务流程示意\nBEGIN;\nSELECT epoch FROM resource_group_lock\n WHERE tenant_id=? AND env_id=? AND resource_group=? FOR UPDATE;\n-- 在已锁定的组内检查所有活动预约 是否与请求范围相交\n-- 有冲突则回滚并返回 RANGE_CONFLICT\n-- 无冲突则创建 reservation 并递增 fencing epoch\nINSERT INTO execution_request (...) VALUES (...);\nINSERT INTO event_outbox (...) VALUES (...);\nCOMMIT;</pre><p>初始化 resource_group_lock 行使用唯一键与幂等插入，不能在不存在协调行时误以为已经加锁。JSON 参数中的业务范围规范化成可查询的日期区间与资源维度；复杂范围无法证明无冲突时，先按资源组串行，换取可验证的正确性。</p><h2 id=\"b103\">16 采集调度 缓存与容量</h2><p>可使用既有海豚调度定期调用 Java 采集入口，或用现有 Java 任务设施；首次部署优先一种机制，避免两套调度同时跑同一分片。多副本通过事务任务领用或可靠租约协调。建议周期仅供压测起点，需 DEC05 和 DEC11 冻结。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:28.00%\"><col style=\"width:29.00%\"><col style=\"width:43.00%\"></colgroup><thead><tr><th scope=\"col\">后台任务</th><th scope=\"col\">建议起点</th><th scope=\"col\">运行控制</th></tr></thead><tbody><tr><td>海豚定义目录</td><td>每 5 分钟；手工触发合并</td><td>按连接与项目分片，完整采集才提交快照。</td></tr><tr><td>活跃实例与未知提交核对</td><td>每 10 至 30 秒</td><td>运行中和未知请求高频，终态按有限窗口低频回补。</td></tr><tr><td>Flink MQ Sink 观测</td><td>每 30 至 60 秒</td><td>按集群与任务共享采集，不为每张表重复请求同一任务。</td></tr><tr><td>Zeppelin 关联状态</td><td>每 60 秒或更长</td><td>保持只读；目录与运行状态采用不同周期。</td></tr><tr><td>告警评估</td><td>事件驱动加周期兜底</td><td>处理去重、持续窗口、过期与恢复证据。</td></tr><tr><td>Outbox 与核对修复</td><td>按批次短周期</td><td>退避、限次、死信；未知启动不盲目重提。</td></tr><tr><td>归档与清理</td><td>每日低峰建议</td><td>只按已批准保留策略清理，不影响活动申请或未关闭问题。</td></tr></tbody></table></div><p>原型的定时与日期均为演示，页面刷新频率不等于后台采集周期。Redis 保存最近快照和来源时效，缓存过期后不制造正常值；授权缓存要支持撤权与明确失效策略。应用查询可对部分源返回 componentStatus，而不是一个源不可用就把其他源的成功数据伪造成全部正常。</p><p>容量估算例：1000 个运行对象每 30 秒采样，每天约 288 万个对象快照；若每个快照 10 个指标，约 2880 万个指标值。该数字是算例，不是现网规模。事务库只保留当前或短期必要状态；长时指标按已有监控系统或 Doris 分区聚合存储，避免逐指标永久写核心 OLTP 表。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:75.00%\"></colgroup><thead><tr><th scope=\"col\">服务指标建议</th><th scope=\"col\">试点评审目标及口径</th></tr></thead><tbody><tr><td>查询体验</td><td>授权范围内标准列表和详情 P95 ≤ 2 秒；大日志和异常样本分页单独计时。</td></tr><tr><td>受理时延</td><td>持久化接受申请 P95 ≤ 3 秒，不含实际任务运行时间。</td></tr><tr><td>状态新鲜度</td><td>测量 sourceUpdatedAt 到页面可见的延迟，区分采集间隔和源接口不可用。</td></tr><tr><td>一致性</td><td>重复 eventId 无重复结果；相同幂等 key 返回同请求；范围冲突无双重放行。</td></tr><tr><td>恢复能力</td><td>数据库恢复、MQ 重放、worker 重启后仍能重建请求与告警；RPO/RTO 待备份方案确认。</td></tr></tbody></table></div><p>日志、快照、实例、报告和审计分开确定保留周期。不能仅因运行记录过期就删除未关闭问题引用的报告，或删除尚待核实请求的外部关联证据。</p><h2 id=\"b110\">17 运维监控与故障处置</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:29.00%\"><col style=\"width:71.00%\"></colgroup><thead><tr><th scope=\"col\">故障</th><th scope=\"col\">期望行为</th></tr></thead><tbody><tr><td>海豚 401/403</td><td>标记授权错误，保留目录快照和历史，停止该连接高频重试；由技术维护凭据或范围。</td></tr><tr><td>目录 500 或分页中断</td><td>该批采集失败或不完整，记录页数和错误，不累计确定删除。</td></tr><tr><td>外部提交响应丢失</td><td>申请待核实、保留预约，先关联原 requestId，不自动再次启动。</td></tr><tr><td>回调丢失或 MQ 重复</td><td>状态查询和报告补拉修复；inbox 去重，不重复新建报告或告警。</td></tr><tr><td>Redis 丢失或切换</td><td>从事务库恢复持久状态；锁与缓存丢失不证明旧执行结束，写入依赖资源预约和 fencing。</td></tr><tr><td>质量查询超时</td><td>执行失败或 UNKNOWN，按真实查询状态核对；不写通过报告。</td></tr><tr><td>权限服务不可达</td><td>写入拒绝或延后，目标跳转不放行；已展示的允许摘要明确标记刷新失败。</td></tr><tr><td>源系统新增状态枚举</td><td>保存 rawState，归类 UNKNOWN 并提示适配，不静默成功。</td></tr></tbody></table></div><p>运维仪表至少统计采集成功率与最长未成功时间、分页错误、快照年龄、请求待核实数量和滞留时长、资源预约年龄、回调冲突、Outbox 积压、告警重复与恢复延迟、质量执行耗时和未知结果数。日志统一 traceId/requestId/accessId，敏感参数脱敏。告警通知渠道对接既有通知平台，失败重试不能重复轰炸同一事件。</p><h2 id=\"b113\">18 上线 迁移与回滚</h2><ul><li>REL01 冻结原型哈希、字段字典、权限码和接口契约；确认实际版本、服务账号、试点资源组及只读访问。</li><li>REL02 迁移数据源与来源表资料，忽略已移除的 owner 输入；旧字段按数据策略保留或后续清理，不影响本期读取。</li><li>REL03 将旧海豚目录、Java 登记与业务作业引用映射至统一 accessId。发现同来源重复绑定或范围冲突时生成冲突清单，人工核对，不自动凭名称合并。</li><li>REL04 对既有 task/jobId:S1 范围建立稳定 scopeCode 映射，报告和补算历史保留原始快照及映射版本；不重建旧报告。</li><li>REL05 先灰度只读目录、监控和告警，再接质量报告，最后只对验证完成且定时入口也受控的作业开放补算。</li><li>REL06 回滚时关闭新执行受理但继续处理已接受请求、回调和核对；不要为了回滚清空申请、Outbox、预约或报告。数据库变更采用兼容的先扩展后收敛步骤。</li></ul><h2 id=\"b115\">19 联调与验收测试</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:16.00%\"><col style=\"width:23.00%\"><col style=\"width:61.00%\"></colgroup><thead><tr><th scope=\"col\">测试编号</th><th scope=\"col\">关联 PRD</th><th scope=\"col\">必须证明的结果</th></tr></thead><tbody><tr><td>IT01</td><td>AC01 至 AC06</td><td>来源资料没有 owner 必填；映射去重、引用限制、只读系统配置生效。</td></tr><tr><td>IT02</td><td>AC10 至 AC12</td><td>目录分页完整提交；重复页、总数漂移、403、分页失败不会误删除，刷新不覆盖本地设置。</td></tr><tr><td>IT03</td><td>AC16 至 AC17</td><td>按稳定 ID 关联历史实例和节点；旧告警实例可准确定位，非名称匹配。</td></tr><tr><td>IT04</td><td>AC18 至 AC20</td><td>同幂等 key 并发只受理一个；不同 key 重叠区间、跨作业共享目标及定时入口冲突被阻止。</td></tr><tr><td>IT05</td><td>AC19</td><td>提交前后进程崩溃、超时与 ACK 丢失均进入可核对状态，不盲目再次调用海豚启动。</td></tr><tr><td>IT06</td><td>AC14</td><td>预检后定义变化、打开设置后版本变化、策略撤销均不能继续使用旧验证。</td></tr><tr><td>IT07</td><td>AC08 至 AC09</td><td>Zeppelin FINISHED 与 Flink RUNNING 独立；空闲、缺指标、时钟漂移与采集过期不会误正常或误故障。</td></tr><tr><td>IT08</td><td>AC21 至 AC26</td><td>任务候选复用、重复范围拒绝、草稿返回、运行中绑定保护；成功无报告不能通过，复检范围不符不能关闭。</td></tr><tr><td>IT09</td><td>AC27 至 AC31</td><td>重复、乱序、恢复先到、采集失联、取消监控、跨日期成功等场景不会错误恢复或重复计数。</td></tr><tr><td>IT10</td><td>AC28 至 AC32</td><td>跑批可见而同步不可见；目标 API 权限收回、伪造用户头、越权对象与日志 ID 都被拒绝。</td></tr><tr><td>IT11</td><td>NF01 至 NF06</td><td>容量压测、源限流、恢复、备份还原、归档引用与日志脱敏达到已批准目标。</td></tr></tbody></table></div><p>本地原型的交互检查不能替代 IT01 至 IT11 的真实系统联调。验收材料应包含接口响应、外部实例或 runId、版本快照、业务输出检查及权限审计记录；本方案没有宣称已连接现网。</p><h2 id=\"b118\">20 待确认清单与实施依赖</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:12.00%\"><col style=\"width:18.00%\"><col style=\"width:22.00%\"><col style=\"width:48.00%\"></colgroup><thead><tr><th scope=\"col\">编号</th><th scope=\"col\">事项</th><th scope=\"col\">负责角色</th><th scope=\"col\">决策结果</th></tr></thead><tbody><tr><td>DEC01</td><td>环境版本</td><td>大数据与平台团队</td><td>确认 Zeppelin、Flink、CDC、MQ、Doris、Redis、Java、Spring Cloud 的现网版本与连接器组合。海豚 3.1.9 已由用户确认。</td></tr><tr><td>DEC02</td><td>接入授权范围</td><td>海豚与权限团队</td><td>确定海豚连接、项目、服务账号、分页上限、访问路径及凭据轮换；未授权范围不能按“删除”处理。</td></tr><tr><td>DEC03</td><td>同步关联来源</td><td>大数据开发</td><td>确定现有任务配置能否自动提供来源表、目标表、Flink deployment/job、Topic、Consumer Group 关系；首期允许有权限人工登记。</td></tr><tr><td>DEC04</td><td>补算试点</td><td>业务与作业开发</td><td>逐项确认支持的日期、商户或账号范围、写入方式、重复执行验证及定时实例是否接入同一互斥机制；未确认的作业保持关闭。</td></tr><tr><td>DEC05</td><td>指标与告警阈值</td><td>业务与运维</td><td>确认延迟口径、低流量场景、采集过期、告警持续与恢复窗口；文中建议值不是现网承诺。</td></tr><tr><td>DEC06</td><td>质量检查口径</td><td>数据质量团队</td><td>确认每个执行器的检查范围、规则版本、码表、必检项、分母、异常数量单位及业务截止时点。</td></tr><tr><td>DEC07</td><td>权限模型</td><td>权限平台团队</td><td>确认角色到动作码与数据范围的映射、Gateway 鉴权方式、后端复核方式以及告警摘要可见范围。</td></tr><tr><td>DEC08</td><td>元数据存储</td><td>平台架构与 DBA</td><td>优先复用现有事务数据库；MySQL 8 仅作详细设计示例，不代表已经部署。确认备份、主从与恢复标准。</td></tr><tr><td>DEC09</td><td>事件通道</td><td>消息平台团队</td><td>平台内部事件选择一种现有通道；建议 RocketMQ，若企业统一 Kafka 则沿用 Kafka，不要求同一事件双发两套 MQ。</td></tr><tr><td>DEC10</td><td>通知渠道</td><td>运营与运维</td><td>首期明确站内告警；短信、邮件、企业消息是否接入现有通知平台另行确认。</td></tr><tr><td>DEC11</td><td>容量与保留</td><td>产品 研发 测试</td><td>确认表量、任务量、日实例量、并发和历史保留；先以试点数据压测再冻结服务目标。</td></tr><tr><td>DEC12</td><td>上线与验收</td><td>产品与项目团队</td><td>确认试点工作流、真实检查样本、验收账号、灰度范围和回滚窗口；不以本地演示等同接口联调通过。</td></tr></tbody></table></div><p>近期可以先完成元数据和只读接口开发，同时核对版本与采集权限。补算写操作依赖输出契约和共同互斥机制；质量执行依赖真实程序与结构化报告协议。所有生产阈值、保留与服务目标经评审后进入配置版本管理，不散落在前端代码中。</p><h2 id=\"b121\">21 官方资料与核对范围</h2><p>资料核对日期为 2026-11-22。海豚接口按 3.1.9 标签源码核对；其他固定版本资料仅作为机制参考，不能推断你们已经安装该版本。本文架构、数据库、API、幂等和告警设计为本平台建议，不宣称外部产品自动提供这些业务保证。</p><ul class=\"references\"><li>[DS1] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessDefinitionController.java\">DolphinScheduler 3.1.9 工作流定义控制器</a></li><li>[DS2] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessInstanceController.java\">DolphinScheduler 3.1.9 实例控制器</a></li><li>[DS3] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ExecutorController.java\">DolphinScheduler 3.1.9 执行控制器</a></li><li>[DS4] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/service/impl/ExecutorServiceImpl.java\">DolphinScheduler 3.1.9 执行服务实现</a></li><li>[DS5] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/enums/ExecuteType.java\">DolphinScheduler 3.1.9 实例操作枚举</a></li><li>[DS6] <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/LoggerController.java\">DolphinScheduler 3.1.9 日志控制器</a></li><li>[Z1] <a href=\"https://zeppelin.apache.org/docs/0.10.1/usage/rest_api/notebook.html\">Zeppelin 0.10.1 Notebook REST API</a></li><li>[F1] <a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.14/docs/ops/rest_api/\">Flink 1.14 REST API 参考</a></li><li>[K1] <a href=\"https://kafka.apache.org/38/operations/monitoring/\">Kafka 3.8 监控指标参考</a></li><li>[R1] <a href=\"https://rocketmq.apache.org/docs/4.x/bestPractice/01bestpractice/\">RocketMQ 4.x 最佳实践</a></li><li>[D1] <a href=\"https://doris.apache.org/releases/v1.2/release-1.2.0/\">Doris 1.2 发布说明</a></li><li>[G1] <a href=\"https://docs.spring.io/spring-cloud-gateway/docs/3.1.10/reference/html/\">Spring Cloud Gateway 3.1.10 参考</a></li><li>[L1] <a href=\"https://redis.io/docs/latest/manual/patterns/distributed-locks/\">Redis 分布式锁说明</a></li></ul><footer>基于已冻结的原型整理。实施建议与待确认事项需经评审后纳入生产配置。</footer>";
function v10Match(q,...values){return values.join(' ').toLowerCase().includes(String(q||'').trim().toLowerCase())}
function v10Opts(options,value,empty='全部'){return [{value:'',label:empty},...options.map(x=>typeof x==='string'?{value:x,label:x}:x)].map(x=>`<option value="${esc(x.value)}" ${String(x.value)===String(value)?'selected':''}>${esc(x.label)}</option>`).join('')}
function v90Base_v10Filter(key,fields){const d=v10Draft[key]||(v10Draft[key]={...v10Q[key]});return `<form class="v10-query" onsubmit="event.preventDefault();v10Apply('${key}')">${fields.map(f=>`<div class="v10-field ${f.wide?'wide':''}"><label for="vq-${key}-${f.key}">${esc(f.label)}</label>${f.options?`<select id="vq-${key}-${f.key}" onchange="v10Draft['${key}']['${f.key}']=this.value">${v10Opts(f.options,d[f.key],f.empty||'全部')}</select>`:`<input id="vq-${key}-${f.key}" type="${f.type||'text'}" value="${esc(d[f.key]||'')}" placeholder="${esc(f.placeholder||'请输入')}" oninput="v10Draft['${key}']['${f.key}']=this.value">`}</div>`).join('')}<div class="v10-query-actions"><button class="primary" type="submit">查询</button>${btn('重置',`v10Reset('${key}')`)}</div></form>`}
function navigationBaseApply(key){const d=v10Draft[key]||v10Q[key];if(d.from&&d.to&&d.from>d.to)return toast('开始日期不能晚于结束日期','error');Object.assign(v10Q[key],d);v10Pages[key]=1;render()}
function navigationBaseReset(key){v10Q[key]={...v10Defaults[key]};delete v10Draft[key];v10Pages[key]=1;if(key==='sync')syncTableFilter=null;if(key==='runs'){batchHistory=false;batchKey='';simpleBatchState='全部'}if(key==='tables')filter.tables='';if(key==='qualityRuns')taskFilter='';render()}
function navigationBaseSet(key,values){Object.assign(v10Q[key],values);delete v10Draft[key];v10Pages[key]=1;render()}
function v10InDate(date,f){const d=String(date||'').slice(0,10);return (!f.from||d>=f.from)&&(!f.to||d<=f.to)}
function v90Base_v10Page(key,items){const size=10,pages=Math.max(1,Math.ceil(items.length/size)),p=Math.max(1,Math.min(v10Pages[key]||1,pages));v10Pages[key]=p;const nums=[];for(let n=1;n<=pages;n++)if(n===1||n===pages||Math.abs(n-p)<=1)nums.push(n);let last=0;return {items:items.slice((p-1)*size,p*size),foot:`<div class="v10-pager"><span>共 ${items.length} 条${items.length?` · 第 ${(p-1)*size+1}–${Math.min(p*size,items.length)} 条`:''}</span><div>${btn('上一页',`v10SetPage('${key}',${p-1})`,p===1?'page-disabled':'')} ${nums.map(n=>{const gap=n-last>1?'<span class="page-gap">…</span>':'';last=n;return gap+btn(n,`v10SetPage('${key}',${n})`,n===p?'current':'')}).join('')} ${btn('下一页',`v10SetPage('${key}',${p+1})`,p===pages?'page-disabled':'')}</div></div>`}}
function v10SetPage(key,p){v10Pages[key]=Math.max(1,p);render()}
function v10Empty(text='暂无符合条件的记录'){return `<div class="v10-empty">${ico('file',26)}<strong>${esc(text)}</strong><span>可调整筛选条件，或使用右上角入口新增。</span></div>`}
function v10Table(headers,rows,empty){return rows.length?table(headers,rows):v10Empty(empty)}
function v10Card(title,meta,body,action=''){return `<section class="card v10-list"><div class="cardhead"><div><h2>${esc(title)}<span class="meta">${esc(meta||'')}</span></h2></div>${action}</div>${body}</section>`}
function v10Chips(key,items,active){return `<div class="v10-chips">${items.map(x=>`<button type="button" class="v10-chip ${x[3]||''} ${active===x[1]?'selected':''}" onclick="${esc(`v10Set('${key}',${JSON.stringify({state:x[1]})})`)}"><span>${esc(x[0])}</span><strong>${esc(x[2])}</strong></button>`).join('')}</div>`}
function toast(message,type){type=type||(/失败|错误|不能|无法|无效|请填写|重复|至少|不可用/.test(message)?'error':/待|未知|未配置|暂不|过期/.test(message)?'warn':'success');clearTimeout(v10ToastTimer);$('#toastRoot').innerHTML=`<div class="toast v10-toast ${type}" role="status"><span class="toast-symbol">${type==='error'?'!':type==='warn'?'!':type==='info'?'i':'✓'}</span>${esc(message)}</div>`;v10ToastTimer=setTimeout(()=>$('#toastRoot').innerHTML='',3800)}
function rowMore(items){const id='menu-'+(++simpleMenuSeq);simpleMenus.set(id,items);return btn('更多',`showRowMenu(event,'${id}')`,'link more-trigger')}
function showRowMenu(event,id){event.stopPropagation();const items=simpleMenus.get(id);if(!items)return;const rect=event.currentTarget.getBoundingClientRect(),root=$('#rowMenuRoot');root.style.left=Math.max(10,Math.min(rect.right-180,window.innerWidth-190))+'px';root.style.top=Math.max(10,Math.min(rect.bottom+5,window.innerHeight-items.length*38-20))+'px';root.innerHTML=`<div class="floating-menu">${items.map(([label,action])=>btn(esc(label),'hideRowMenu();'+action,'link')).join('')}</div>`}
function hideRowMenu(){const root=$('#rowMenuRoot');if(root)root.innerHTML=''}
function entityLink(text,action,secondary=''){return `<div class="entitytitle">${btn(esc(text),action,'link entitylink')}</div>${secondary?`<div class="small muted">${esc(secondary)}</div>`:''}`}
function side(title,body,foot=''){hideRowMenu();modal(esc(title),body,foot||btn('关闭','closeModal()'),true,true)}
function plainHint(text){return `<p class="plainhint">${esc(text)}</p>`}
function simpleStats(items){return `<div class="simple-stats">${items.map(x=>`<button type="button" class="simple-stat ${x[3]||''}" onclick="${esc(x[2]||'')}" ${x[2]?'':'disabled'}><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></button>`).join('')}</div>`}
