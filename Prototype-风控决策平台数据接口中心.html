const V90_DELIVERY_TECH="<h2 id=\"b0\">1 技术边界与版本依据</h2><p>本方案对应 PRD V9.8 与交付原型 V9.8。目标是在既有 Java 后台增加统一管理和观测能力，复用 RocketMQ、Kafka、Flink、Doris、海豚调度和 Redis，不新增另一套任务开发平台。原型验证的是交互和状态规则，真实服务适配、对象权限、事务约束、性能和补算一致性仍需实现并联调。本版吸收了评审中关于同步监控首期范围、写入结果确认方式、Java 质量检查程序和数据库性能保护的讨论结论，未定事项列入第 21 章。数据字典由其他负责人设计，不在本方案范围。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:32.00%\"><col style=\"width:48.00%\"></colgroup><thead><tr><th scope=\"col\">组件</th><th scope=\"col\">已知情况</th><th scope=\"col\">适配边界</th></tr></thead><tbody><tr><td>海豚</td><td>现网版本 3.1.9 已确认</td><td>按该版本控制器及现网部署前缀适配 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessDefinitionController.java\">[DS1]</a> <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessInstanceController.java\">[DS2]</a></td></tr><tr><td>Flink 与 CDC</td><td>现网版本待核对</td><td>以 Flink 1.15 API、CDC 2.3 指标实现举例，不要求升级 <a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.15/docs/ops/rest_api/\">[F1]</a> <a href=\"https://github.com/apache/flink-cdc/blob/release-2.3/flink-connector-mysql-cdc/src/main/java/com/ververica/cdc/connectors/mysql/source/metrics/MySqlSourceReaderMetrics.java\">[C1]</a></td></tr><tr><td>Zeppelin</td><td>2022 年版本能力要求</td><td>0.10.1 作为设计参考，实际版本和解释器需核实 <a href=\"https://zeppelin.apache.org/docs/0.10.1/usage/rest_api/notebook.html\">[Z1]</a> <a href=\"https://zeppelin.apache.org/docs/0.10.1/interpreter/flink.html\">[Z2]</a></td></tr><tr><td>Kafka 与 RocketMQ</td><td>已有技术栈，版本未确认</td><td>Kafka 3.2 和 RocketMQ 5.0 文档仅解释指标口径；不假设旧版具有 5.0 指标 <a href=\"https://kafka.apache.org/32/operations/monitoring/\">[K1]</a> <a href=\"https://rocketmq.apache.org/docs/observability/01metrics/\">[R1]</a></td></tr><tr><td>Doris 与 Connector</td><td>已有目标存储，版本组合未确认</td><td>导入回执和两阶段提交语义以现网连接器核验 <a href=\"https://doris.apache.org/docs/dev/data-operate/import/import-way/stream-load-manual/\">[D1]</a></td></tr><tr><td>Gateway 与 Java</td><td>采用 Spring Cloud Gateway 鉴权</td><td>业务动作和对象权限接企业现有权限体系 <a href=\"https://docs.spring.io/spring-cloud-gateway/docs/3.1.10/reference/html/\">[G1]</a></td></tr><tr><td>事务库</td><td>具体选型未确认</td><td>复用企业关系库；下文以通用关系模型和 SQL 举例，不假设已部署 MySQL 或 PostgreSQL</td></tr></tbody></table></div><p>以下内部 API、表名、采集周期、重试与保留策略是实施建议；外部原生能力以所列官方版本资料为依据。状态查询、控制操作与业务数据检查使用不同契约，不能因为存在停止接口就向运营开放停止权限。</p><h2 id=\"b4\">2 总体架构与部署职责</h2><p class=\"flowtitle\">读取与受控执行架构</p><div class=\"flow\" role=\"group\" aria-label=\"读取与受控执行架构\"><span>1　企业后台页面</span><span>2　Gateway 与对象权限</span><span>3　Java 管理及适配层</span><span>4　Flink 海豚 Java MQ</span><span>5　事务库 快照 事件 告警</span></div><p>首期可在现有 Java 服务内按模块组织，不要求为每张表或每个任务独立部署程序。采集 worker、执行 worker 与查询管理接口可以同一工程、不同进程部署，按真实负载再拆分。浏览器仅访问本平台接口，不持有外部服务凭据。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:22.00%\"><col style=\"width:39.00%\"><col style=\"width:39.00%\"></colgroup><thead><tr><th scope=\"col\">模块</th><th scope=\"col\">职责</th><th scope=\"col\">权威数据</th></tr></thead><tbody><tr><td>Metadata</td><td>数据源、来源表、当前映射及不可变历史</td><td>关系库的来源表当前指针与映射版本</td></tr><tr><td>FlinkCatalog</td><td>自动发现、人工登记、校验、运行身份历史</td><td>注册资料在关系库，运行事实来自实际集群</td></tr><tr><td>AccessCatalog</td><td>海豚工作流和 Java 契约、监控选择</td><td>外部定义与本地控制字段分开保存</td></tr><tr><td>Observation</td><td>首期按 Flink 任务采集运行状态并投影到当前映射；二期增加指标、写入回执、快照时效与观测状态</td><td>外部查询结果与采集上下文</td></tr><tr><td>Execution</td><td>参数预检、幂等受理、执行跟踪和互斥</td><td>持久请求与外部实例 ID</td></tr><tr><td>Quality</td><td>检查配置、执行报告、问题与复检关系</td><td>执行程序回传的版本化结果</td></tr><tr><td>Alert 与 AuditBridge</td><td>规则、事件去重、告警生命周期和统一审计</td><td>后台规则事实与企业审计契约</td></tr></tbody></table></div><p>事务库保存配置、身份、执行请求、报告索引和告警生命周期。Redis 保存短期快照、缓存和协调信息；丢失 Redis 后能从持久状态与外部系统重建。Doris 可承载指标历史和报告明细分析，不承担当前映射唯一性、业务请求幂等等核心事务约束。平台事件选择一套已有 MQ；不要求每个事件同时投递 RocketMQ 和 Kafka。</p><h2 id=\"b9\">3 核心对象与关系模型</h2><p>所有身份均包含环境上下文；如企业已有多租户体系，再沿用 tenantId。海豚长整型 code 在前端和 JSON 中使用字符串，避免精度丢失。记录显示名称可以修改，稳定身份不能由名称推断。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:21.00%\"><col style=\"width:40.00%\"><col style=\"width:39.00%\"></colgroup><thead><tr><th scope=\"col\">对象</th><th scope=\"col\">稳定身份</th><th scope=\"col\">关系</th></tr></thead><tbody><tr><td>来源表</td><td>sourceTableId；环境 数据源 物理表名唯一</td><td>归属一个数据源，最多一个 currentMappingId</td></tr><tr><td>共享 Flink 登记</td><td>taskId</td><td>可被多张来源表引用，人工和自动发现共用</td></tr><tr><td>Flink 运行身份</td><td>identityId；环境 集群 Job ID 去重</td><td>保留 taskId 的身份版本和部署历史</td></tr><tr><td>来源映射版本</td><td>mappingId</td><td>绑定一张来源表、一个任务身份快照、一个目标连接与目标表</td></tr><tr><td>技术连接</td><td>connectionId；环境内唯一</td><td>集群、目标库、观测入口均引用连接，凭据只存引用</td></tr><tr><td>海豚接入</td><td>连接 projectCode definitionCode</td><td>定义版本不作为逻辑接入主键</td></tr><tr><td>Java 接入</td><td>服务标识 programId</td><td>参数与能力按 contractVersion 管理</td></tr><tr><td>执行与质量</td><td>requestId、executionId、reportId</td><td>请求和外部实例关联，报告不可变</td></tr><tr><td>告警</td><td>incidentId；fingerprint</td><td>告警按规则对象开启发生周期</td></tr></tbody></table></div><div class=\"tablewrap\"><table><colgroup><col style=\"width:29.00%\"><col style=\"width:43.00%\"><col style=\"width:28.00%\"></colgroup><thead><tr><th scope=\"col\">建议表</th><th scope=\"col\">关键内容</th><th scope=\"col\">约束</th></tr></thead><tbody><tr><td>data_source 与 source_table</td><td>来源资料；source_table.current_mapping_id、revision</td><td>来源内表身份唯一；无负责人业务字段</td></tr><tr><td>flink_task 与 flink_runtime_identity</td><td>登记来源、展示名称、实际名称、当前身份、校验与版本</td><td>环境 connectionId jobId 联合去重</td></tr><tr><td>source_mapping_revision</td><td>source_table_id、task_id、identity_version、target_connection_id、目标库表、说明、valid_from、valid_to</td><td>任务、身份版本、目标连接与库表不可就地修改；说明是当前版本的可变属性，修改写审计不新建版本。支持部分唯一索引的库可加 UNIQUE(source_table_id) WHERE valid_to IS NULL 作为兜底</td></tr><tr><td>mapping_snapshot</td><td>mappingId、bindingGeneration、末次可信观测引用</td><td>旧快照不参与新关联实时判断</td></tr><tr><td>execution_access 与 executor_contract</td><td>外部来源定义；本地显示名称、说明、监控标记、purpose（BUSINESS / QUALITY）、declared_scopes；Java Schema、能力</td><td>本地字段不被目录同步覆盖；purpose 修改受引用与补算约束（13.2）；被引用的范围只追加不改写</td></tr><tr><td>operation_policy 与 execution_request</td><td>开放范围、验证依据、写入方式、output_resource_group、定义摘要、请求参数与幂等键</td><td>开放时输出资源组必填；定义摘要变化即失效；幂等键与请求摘要匹配，重复不同载荷拒绝</td></tr><tr><td>connection 与 collection_setting</td><td>连接类型、地址、版本声明、授权范围、credential_ref、读取与提交能力；Flink 观测与海豚采集的周期、超时、阈值</td><td>凭据只存引用；配置整体校验后一次生效，并记录版本与修改人</td></tr><tr><td>job_timing_policy 与 platform_retirement</td><td>运行超时阈值、漏跑宽限、启用状态；平台退役原因与时间</td><td>计划与时区只读来自海豚；退役不调用外部停止或删除</td></tr><tr><td>quality_task 与 quality_report</td><td>执行器引用、规则范围、结果和版本快照</td><td>每次复检新报告，报告与任务配置解耦</td></tr><tr><td>collector_run 与 observation_latest</td><td>覆盖范围、分页完整性、运行状态、last_attempt_at、collected_at、错误；二期增加指标与写入回执</td><td>绑定代次与来源序号防旧结果覆盖；按 Flink 任务一行，映射通过任务引用投影</td></tr><tr><td>alert_incident 与 event_inbox/outbox</td><td>fingerprint（规则、对象类型、对象 ID）、发生周期、累计次数、最近证据、恢复证据、确认、级别（仅后台）</td><td>活动告警槽按 fingerprint 唯一；事件消费去重；对象粒度见 14.1</td></tr></tbody></table></div><p>历史映射快照保存当时的任务名称、实际身份、目标、指标单位与质量，避免当前任务改名或换 Job ID 后历史变形。大量日志和质量样本用受控明细存储引用，不放进配置主行。旧样例中的负责人残留字段不继续作为生产表单或返回字段要求。</p><h2 id=\"b14\">4 一张来源表一条当前关联的事务实现</h2><p>用 source_table.current_mapping_id 作为单一事实指针，不只在前端限制按钮，也不依赖 Redis 锁模拟唯一性。历史映射允许多条，活动关系从当前指针读取。对映射所属来源表、任务环境和目标连接进行服务端校验，禁止把另一张表的 mappingId 挂到当前表。</p><pre>BEGIN;\n-- 先按固定顺序锁定涉及的共享任务，再锁来源表，避免与任务编辑和删除死锁\n-- 首次关联时 oldTaskId 为空，只锁 newTaskId；集合去重后按 id 升序加锁\nSELECT id, status, revision FROM flink_task\n WHERE id IN (:taskIds) ORDER BY id FOR UPDATE;\nSELECT current_mapping_id, revision FROM source_table\n WHERE id = :tableId AND env_id = :envId FOR UPDATE;\n-- expectedRevision 不一致则回滚，返回 409\n-- 校验所选任务存在、未删除、授权环境和当前任务身份版本\n-- 只改说明：UPDATE 当前版本 note 与 source_table.revision，写审计后提交，不执行以下切换\n-- 任务、身份版本、目标连接或目标库表任一改变：执行以下历史切换（首次关联跳过 UPDATE 旧版本）\nUPDATE source_mapping_revision SET valid_to = :now WHERE id = :oldMappingId;\nINSERT INTO source_mapping_revision (...) VALUES (...新身份及目标快照...);\nUPDATE source_table SET current_mapping_id = :newMappingId,\n revision = revision + 1 WHERE id = :tableId AND revision = :expectedRevision;\nINSERT INTO event_outbox (...) VALUES (...MappingChanged...);\nCOMMIT;</pre><p>统一编辑接口自动比较稳定任务 ID、运行身份版本和目标连接库表，返回 changeType：CREATED（首次关联）、METADATA_ONLY（只改说明）、TASK、TARGET、TASK_AND_TARGET；取消关联返回 DETACHED。只改说明不创建新关联、不清空观测；改任务或目标则归档旧映射及快照，创建新的绑定代次，提交后启动新观测。保存后仍只有一个 currentMappingId。取消编辑没有请求；取消关联将指针置空并结束旧映射，不删除共享任务或目标数据。</p><p>请求携带 expectedRevision 或 If-Match，并使用幂等键。重复同请求返回同一结果；同键不同载荷拒绝。提交事务后采集事件可重复投递，但按映射代次处理。缓存刷新失败时从事务库重建，不允许客户端用旧数组覆盖来源表关联。</p><p>更换全局人工登记的运行身份属于目录维护，不是第二条来源表关联。先对新身份做查询校验，展示受影响来源表并确认版本摘要；事务中统一创建新身份和关联版本或返回冲突。引用对象超出操作者授权范围时拒绝整次修改，不做未说明的部分成功。</p><h2 id=\"b20\">5 Flink 目录发现人工登记及删除</h2><p>任务发现读取配置范围内每个集群的 JobManager REST 入口。Session、Application、YARN 或容器部署可能对应不同入口，需要已有部署登记或集群管理能力提供地址；一个集群地址不能代表全部企业任务。运行接口可查询的任务范围与长期任务定义库不同，平台自行保留发现与历史记录。<a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.15/docs/ops/rest_api/\">[F1]</a></p><p class=\"flowtitle\">任务发现合并</p><div class=\"flow\" role=\"group\" aria-label=\"任务发现合并\"><span>1　读取授权集群</span><span>2　按集群与 Job ID 匹配</span><span>3　合并已存在人工登记</span><span>4　更新运行事实与校验</span><span>5　保留本地映射与历史</span></div><p>人工登记首先建立 taskId 和候选运行身份。校验调用指定集群的任务查询，保存 identityHash、被校验版本、结果时间、实际运行名称和错误码。网络查询在数据库事务外执行，写入结果时再次比较身份和 revision，避免把旧请求的校验成功写到新 Job ID 上。登记可以待验证，引用可以提前建立，采集只处理已验证身份。</p><p>自动发现与人工登记按环境、connectionId 和 Job ID 合并。保留人工展示名称、说明和登记来源；实际运行名称、状态与部署事实独立更新。目录没有通用的“来源表列表”事实字段；已关联来源表从 source_table 当前指针汇总。任务名称和算子名称不能当作血缘推断依据。</p><p>删除人工登记前与新增引用使用相同的任务行锁：检查当前引用为零，再逻辑删除登记并写审计事件。来源表提交关联时也锁定任务并检查未删除，防止删除检查与新增关联交错。自动发现再次看见真实运行任务时合并任务事实，不恢复已结束的来源表映射。自动来源的运行名称与状态由外部采集维护，不提供伪造状态的编辑。</p><p>目录采集故障保留上次快照与错误信息。历史部署、校验过期、缺少集群入口与读取权限不足分别展示。重部署出现新 Job ID 时形成新身份版本或新发现记录，已有映射标记待核对；不按同名自动切换当前任务。</p><h2 id=\"b27\">6 Flink 状态查询与指标适配</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:47.00%\"><col style=\"width:33.00%\"></colgroup><thead><tr><th scope=\"col\">查询用途</th><th scope=\"col\">Flink 原生 GET 路径</th><th scope=\"col\">处理规则</th></tr></thead><tbody><tr><td>任务清单</td><td>/jobs/overview</td><td>按已接入集群读取，形成发现快照</td></tr><tr><td>任务详情与状态</td><td>/jobs/{jobId}</td><td>区分 RUNNING、RESTARTING、FAILED 等真实状态</td></tr><tr><td>节点与异常</td><td>/jobs/{jobId}/vertices/{vertexId}；/jobs/{jobId}/exceptions</td><td>只展示实际返回的状态和保留异常</td></tr><tr><td>Checkpoint</td><td>/jobs/{jobId}/checkpoints</td><td>展示成功失败与最近完成时间，不替代数据结果</td></tr><tr><td>指标清单与取值</td><td>/jobs/{jobId}/vertices/{vertexId}/metrics</td><td>先列指标 ID，再使用 get 参数取存在的项</td></tr><tr><td>子任务指标</td><td>/jobs/{jobId}/vertices/{vertexId}/subtasks/{index}/metrics</td><td>记录子任务覆盖率和聚合口径</td></tr></tbody></table></div><p>上述路径按 Flink 1.15 官方接口举例，现网适配器需有契约测试。<a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.15/docs/ops/rest_api/\">[F1]</a> 指标查询接口并不保证每个连接器都注册读取延迟或写入耗时；完整 metricId 可能带算子前缀，必须从实际清单发现，不硬编码为 readLag 或凭表名拼接 sink 算子。<a href=\"https://nightlies.apache.org/flink/flink-docs-release-1.15/docs/ops/metrics/\">[F2]</a></p><pre>GET /jobs/{jobId}/vertices/{vertexId}/metrics\n-- 返回当前可查询的指标 ID；匹配已备案口径的完整 ID\nGET /jobs/{jobId}/vertices/{vertexId}/metrics?get={encodedMetricId}\n\n{\n  &quot;metricCode&quot;: &quot;SOURCE_FETCH_LAG&quot;,\n  &quot;value&quot;: 1250, &quot;unit&quot;: &quot;ms&quot;, &quot;scope&quot;: &quot;TASK&quot;,\n  &quot;metricId&quot;: &quot;&lt;实际发现的完整 ID&gt;&quot;,\n  &quot;metricTime&quot;: &quot;2026-11-24T02:00:00Z&quot;,\n  &quot;collectedAt&quot;: &quot;2026-11-24T02:00:02Z&quot;,\n  &quot;quality&quot;: &quot;AVAILABLE&quot;, &quot;bindingGeneration&quot;: &quot;BG-18&quot;\n}</pre><p>Observation worker 按环境、集群、Job ID 去重采样，再投影给引用该任务的当前映射；单表目标回执单独采集。结果带 mappingId、identityVersion、bindingGeneration、采样序号和时间。结果回写时与当前绑定比较，旧代次结果进入历史或丢弃，不能覆盖新绑定。页面读取缓存快照，不因多个用户刷新而重复扫描全部集群。</p><p>首期同步监控只使用任务清单与任务状态两类查询：每个采集周期对每个已接入集群调用一次 /jobs/overview 取得全部任务状态，再按 Job ID 匹配平台登记；清单中查不到的已登记任务再单独调用 /jobs/{jobId} 确认是否已结束或被清理。这样请求数与集群数成正比，而不是与来源表数成正比。指标、节点、Checkpoint 查询属于二期，接入方式见第 7 章。</p><p>运行状态、采集状态和业务写入状态分开持久化。403、超时、无法定位 JobManager 是采集异常；任务返回 FAILED 才是运行失败。一个指标存在但值未初始化、覆盖子任务不足或已过期时标记不可用。聚合采用指标定义的 max、sum 或窗口统计；以最大读取滞后展示任务最慢采样时，也必须注明它不是最老未消费记录的绝对年龄。</p><h2 id=\"b33\">7 同步监控：首期实现与二期设计</h2><h3 id=\"b33a\">7.1 首期实现：只采集运行状态</h3><p>PRD 第 8 章确定首期同步监控只展示来源表、目标表、同步任务、集群和运行状态。后台实现为一个采集 worker 加一组只读查询接口，不为每张表或每个任务单独部署程序。</p><p class=\"flowtitle\">首期同步采集</p><div class=\"flow\" role=\"group\" aria-label=\"首期同步采集\"><span>1　按集群读取任务清单</span><span>2　匹配平台登记的 Job ID</span><span>3　写入 observation_latest</span><span>4　记录 collector_run</span><span>5　评估同步任务告警</span></div><div class=\"tablewrap\"><table><colgroup><col style=\"width:16.00%\"><col style=\"width:50.00%\"><col style=\"width:34.00%\"></colgroup><thead><tr><th scope=\"col\">环节</th><th scope=\"col\">实现</th><th scope=\"col\">说明</th></tr></thead><tbody><tr><td>采集</td><td>周期取采集配置的 Flink 采集间隔；每个集群一次 /jobs/overview，请求超时取请求超时配置；未匹配的登记任务补查 /jobs/{jobId}</td><td>只处理校验通过的登记；待验证、校验失败的任务不采集</td></tr><tr><td>保存</td><td>observation_latest 按 Flink 任务一行：runtime_state、sample_seq、last_attempt_at、collected_at、error；映射通过 task_id 投影</td><td>采集失败只更新 last_attempt_at 与 error，保留上次 runtime_state</td></tr><tr><td>采集记录</td><td>collector_run 记录开始结束时间、集群数、成功任务数、失败原因</td><td>页面“采集记录”与“最近成功采集”读这里</td></tr><tr><td>查询</td><td>GET /sync-monitor 读取当前映射 + 任务状态快照，返回列表、统计与 collector 摘要</td><td>不在请求中直连 Flink</td></tr><tr><td>刷新</td><td>POST /sync-monitor/refresh-requests 返回 202；同一时刻只保留一个进行中的采集，按用户限频</td><td>多人同时刷新不会重复扫描集群</td></tr><tr><td>告警</td><td>每轮采集结束后按 Flink 任务评估 SYNC_TASK_DOWN，见 14.1</td><td>采集失败只产生采集异常告警</td></tr></tbody></table></div><pre>GET /api/data-center/v1/sync-monitor?runtime=FAILED&amp;pageNo=1&amp;pageSize=20\n{\n  \"stats\": {\"links\": 5, \"running\": 4, \"notRunning\": 1},\n  \"collector\": {\"lastSuccessAt\": \"2026-11-25T00:31:51Z\", \"status\": \"SUCCESS\"},\n  \"items\": [{\n    \"sourceTable\": \"s_match_info\", \"target\": \"base.s_match_info\",\n    \"taskId\": \"FT-004\", \"taskName\": \"flink_cdc_match\", \"clusterId\": \"FLINK-MAIN\",\n    \"runtimeState\": \"FAILED\", \"collectedAt\": \"2026-11-25T00:31:51Z\"\n  }],\n  \"total\": 1\n}</pre><p>首期不逐行返回快照时效；collected_at 仍然保存，供二期逐行时效与观测状态直接使用。统计中的 notRunning 只计已采集且不是 RUNNING 的链路，“未采集”不计入。</p><h3 id=\"b33b\">7.2 二期指标口径</h3><div class=\"tablewrap\"><table><colgroup><col style=\"width:22.00%\"><col style=\"width:43.00%\"><col style=\"width:35.00%\"></colgroup><thead><tr><th scope=\"col\">指标</th><th scope=\"col\">计算边界</th><th scope=\"col\">采集前提</th></tr></thead><tbody><tr><td>Source 读取滞后</td><td>Flink Source 获取事件时间减源端变更事件时间</td><td>CDC 或消息连接器提供有效时间戳与指标</td></tr><tr><td>Source 发出滞后</td><td>事件离开 Source 的时间减源事件时间</td><td>连接器和 Source 正确传递事件时间</td></tr><tr><td>Doris 导入耗时</td><td>一次导入请求开始至对应完成阶段的耗时</td><td>Sink 指标或现有导入回执，不另发一次导入</td></tr><tr><td>端到端同步延迟</td><td>指定记录在目标确认可见时间减源变更时间</td><td>跨链路时间戳、记录或批次关联与可见性确认</td></tr><tr><td>最近成功写入距今</td><td>当前时间减上次成功写入时间</td><td>仅代表新鲜度，空闲时不能直接当作写入延迟</td></tr></tbody></table></div><p>CDC 2.3 的 MySQL Source 已实现 currentFetchEventTimeLag、currentEmitEventTimeLag 和 sourceIdleTime；这证明部分版本可直接提供相关指标，不代表所有 CDC、Kafka 或 RocketMQ 连接器都有同名指标。<a href=\"https://github.com/apache/flink-cdc/blob/release-2.3/flink-connector-mysql-cdc/src/main/java/com/ververica/cdc/connectors/mysql/source/metrics/MySqlSourceReaderMetrics.java\">[C1]</a> 二期盘点现网清单后绑定，缺少才补充连接器埋点或统一探针。全量快照阶段与增量阶段分开处理，不能把未初始化或无有效事件时间的零值当作追平。</p><p>Kafka 的 records-lag-max 是记录数量，不能直接转换为秒。<a href=\"https://kafka.apache.org/32/operations/monitoring/\">[K1]</a> RocketMQ 的积压、就绪等待与消费完成滞后具有不同边界，且指标随版本变化；需要确认 Topic、Consumer Group、队列与时间戳含义。<a href=\"https://rocketmq.apache.org/docs/observability/01metrics/\">[R1]</a> 平台二期允许只展示积压条数及运行状态，不以积压除以瞬时吞吐给出确定延迟。</p><p>Doris Stream Load 回执中的 LoadTimeMs、WriteDataTimeMs、CommitAndPublishTimeMs 是不同阶段耗时。<a href=\"https://doris.apache.org/docs/dev/data-operate/import/import-way/stream-load-manual/\">[D1]</a> 由现有 Sink 暴露指标或上报回执，Java 后台读取已有事实；不为观测再次写入数据。两阶段提交下预提交不等于最终可见；Publish Timeout 等情况需按实际事务与可见性核对，不能直接认定失败后换标签重写。</p><p>例如源事件 10:00:00、Source 读取 10:00:05、开始导入 10:00:12、目标确认可见 10:00:14：读取滞后 5 秒，导入请求耗时约 2 秒，端到端约 14 秒。中间缓存、计算或提交等待不能从导入耗时中省略。若只取采样记录或批次时间，就按采样口径展示，不承诺全表最大延迟。</p><p>时间统一存 UTC，展示用配置业务时区；采集时钟需同步。负延迟、异常未来时间、缺失事件时间标记为时钟或口径异常。最近 1 分钟的均值、P95 或最大值需要明确窗口和有效样本数。任务级、算子级、消费组级和表级指标分开标识，不按关联表数平均拆分。</p><h3 id=\"b33c\">7.3 二期指标采集方式</h3><p>读取滞后的取值步骤：调用 /jobs/{jobId} 取得算子（vertex）列表；对 Source 算子调用 /jobs/{jobId}/vertices/{vertexId}/metrics 列出实际注册的指标 ID，匹配以 currentFetchEventTimeLag 结尾的完整 ID（带算子前缀，不能写死）；再用 /jobs/{jobId}/vertices/{vertexId}/subtasks/metrics?get={id}&amp;agg=max 一次取得所有并行子任务的最大值，即最慢子任务的滞后。原始单位为毫秒，展示换算为秒。</p><p>读取滞后的边界：源端夜间无写入时指标可能停在最后一个值或为 0，需结合 sourceIdleTime 区分“已追平”和“无数据可读”；CDC 全量快照阶段没有事件时间，此时的 0 显示为不可用，不代表追平。Kafka 的 records-lag-max 是积压条数，RocketMQ 的积压口径随版本变化，二者都不换算成秒，拿不到按时间计的滞后时显示“不支持”，积压条数单独作为消息积压展示。</p><p>导入耗时取 Stream Load 回执中的 LoadTimeMs（整次导入总耗时）；WriteDataTimeMs、CommitAndPublishTimeMs 可用于详情分阶段展示。导入耗时是目标表级，每个 Sink 写一张目标表，可以按表区分；读取滞后是任务级，由引用该任务的来源表共享。</p><h3 id=\"b33d\">7.4 二期写入结果的确认方式</h3><p>写入结果与导入耗时来自同一份 Stream Load 回执。回执由 Flink 作业内的 Doris Connector 接收，Flink REST 接口默认不提供，因此二期必须选定下列方式之一，按可靠程度从高到低：</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:16.00%\"><col style=\"width:36.00%\"><col style=\"width:26.00%\"><col style=\"width:22.00%\"></colgroup><thead><tr><th scope=\"col\">方式</th><th scope=\"col\">做法</th><th scope=\"col\">前提或代价</th><th scope=\"col\">可得结论</th></tr></thead><tbody><tr><td>连接器写入指标（首选）</td><td>部分版本的 Doris Connector 把写入次数、失败次数、写入行数、耗时注册为 Flink 指标，采集方式与 7.3 相同；两次采集之间成功数增加且失败数不增加记为已确认写入</td><td>需按现网连接器版本核实指标是否存在及名称（DEC01、DEC04）；不需改同步程序</td><td>写入成功 / 失败、导入耗时</td></tr><tr><td>两阶段提交事务状态</td><td>开启 exactly-once 时，结合最近成功 Checkpoint 时间与 Doris 事务状态（按导入 label 查询）判断数据是否已提交可见</td><td>需掌握连接器 label 规则或由同步程序上报 label；预提交成功不等于可见</td><td>提交是否完成</td></tr><tr><td>目标表时间字段探测（兜底）</td><td>低频只读查询目标表当日分区的最大更新时间，如 SELECT MAX(update_time) … WHERE dt ≥ 当日；与源端时间比较估算端到端延迟</td><td>目标表须有更新时间或业务时间字段；必须带分区条件、低频、只读账号；源端无新数据时不能判异常（DEC05）</td><td>数据是否持续到达</td></tr><tr><td>心跳表</td><td>在源库心跳表定时写一条带时间戳的记录，到 Doris 查询其到达时间</td><td>需要向源库写入，违背“不为观测再写数据”的原则，须 DBA 与业务方同意；只适合少数关键链路</td><td>真实端到端延迟与写入确认</td></tr></tbody></table></div><p>建议先盘点现网 Doris Connector 版本：支持写入指标时用第一种覆盖大部分任务；不支持或不经 Doris Connector 的链路，对有时间字段的表开启第三种；第四种按需评估。四种都无法取得的任务，写入结果显示“缺少写入回执”，并且不能把写入回执设为该任务的必需项。</p><h3 id=\"b33e\">7.5 二期快照时效与观测状态</h3><p>快照时效衡量的是平台采集程序，不是 Flink 任务：Flink 无法知道平台上次何时成功读取。采集时保存 last_attempt_at 与 collected_at；读取时以当前时间计算 now − collected_at ≤ 快照过期阈值，且本轮无采集错误、映射不在待核对，才算有效。时效必须在读取时计算，不能在采集时写死，否则采集程序停止后快照永远显示有效。Redis 缓存丢失时退回关系库中的最近持久快照并标注时效，不能清空后显示全部正常。</p><p>观测状态在采集时按任务的必需项计算并保存（列表、详情和告警读同一结果），读取时再检查一次快照是否过期，过期则显示无法判断。必需项按任务配置（sync_required_item：task_id、item_code、required）：运行状态与快照有效必选；读取滞后、导入耗时、写入回执按现网可用性选择。判定函数同时返回命中的规则作为 statusReason，供详情“状态依据”展示。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:10.00%\"><col style=\"width:60.00%\"><col style=\"width:30.00%\"></colgroup><thead><tr><th scope=\"col\">顺序</th><th scope=\"col\">条件</th><th scope=\"col\">结果</th></tr></thead><tbody><tr><td>1</td><td>来源表没有当前映射</td><td>未关联映射</td></tr><tr><td>2</td><td>采集关闭、快照过期、本轮采集错误、映射待核对、任务未校验</td><td>无法判断</td></tr><tr><td>3</td><td>运行状态为 FAILED、FAILING，或写入结果为写入失败</td><td>失败</td></tr><tr><td>4</td><td>运行状态不是 RUNNING</td><td>无法判断</td></tr><tr><td>5</td><td>有效的读取滞后或导入耗时超过任务阈值</td><td>延迟</td></tr><tr><td>6</td><td>必需项缺失、不支持或未采集</td><td>无法判断</td></tr><tr><td>7</td><td>以上都不满足</td><td>正常</td></tr></tbody></table></div><p>原型按上表实现，即快照过期优先于失败：过期时上次看到的 FAILED 显示为无法判断，因为过期的失败信息可能已不成立。V9.0 文档曾写“失败”优先，二者不一致，待 DEC15 确认后统一。</p><h3 id=\"b33f\">7.6 二期同步详情接口</h3><p>GET /sync-observations/{mappingId} 只读快照，不触发实时采集，避免多人查看时冲击 JobManager，也保证与列表的采集时间一致；需要更新时走受限刷新。接口按用户对来源表与同步任务的权限过滤，详情含 Job ID 与集群信息，不能只靠前端隐藏入口。</p><p>详情的数据来源：集群、Job ID、部署标识来自任务登记；运行状态、写入结果、两个采集时间、快照时效和指标来自 observation_latest；指标的数据来源、单位和适用范围来自 metric_definition 配置；状态依据来自判定函数返回的 statusReason；导入耗时趋势来自采集时追加写入的指标历史（可存 Doris，按保留期限清理）。Zeppelin 关联为可选，大部分任务不经 Zeppelin 提交时不必补齐。</p><h2 id=\"b40\">8 Zeppelin 的辅助关联</h2><p>通过 GET /api/notebook 获取授权笔记，通过 GET /api/notebook/{noteId} 获取段落，通过 GET /api/notebook/job/{noteId} 获取段落执行状态。<a href=\"https://zeppelin.apache.org/docs/0.10.1/usage/rest_api/notebook.html\">[Z1]</a> 仅使用只读接口完成入口定位；保存 Notebook 或 Paragraph 关联不运行或重启段落。</p><p>Zeppelin 段落与 Flink Job ID 不是固定一对一；多条 INSERT 可以提交多个任务，也可能按配置合并。<a href=\"https://zeppelin.apache.org/docs/0.10.1/interpreter/flink.html\">[Z2]</a> 建议提交适配器记录 noteId、paragraphId、submissionId、clusterId 和 Job ID 的关联；已有程序未提供时由技术人员核对登记。只按任务名称、笔记标题或段落 FINISHED 状态匹配是不可靠的。</p><p>如果 Notebook 尚未提交，只作为脚本资料保存，不在实际运行任务中伪造 RUNNING。Flink 新部署后旧段落关系标记待核对，保留原执行历史。大部分同步任务不经 Zeppelin 提交时，直接依赖 Flink 集群状态，不强制补齐 Zeppelin 字段。</p><h2 id=\"b44\">9 海豚目录同步</h2><p>海豚适配器按已授权连接和 projectCode 读取工作流定义，使用连接、projectCode 和 definitionCode 作为稳定身份。3.1.9 定义接口路径为 process-definition，使用单数；实例接口为 process-instances。列表、详情和节点分别读取，不以名称为主键。部署上下文前缀以现网为准，本平台路径不得冒充海豚原生路径。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:19.00%\"><col style=\"width:55.00%\"><col style=\"width:26.00%\"></colgroup><thead><tr><th scope=\"col\">用途</th><th scope=\"col\">原生接口示例</th><th scope=\"col\">事实来源</th></tr></thead><tbody><tr><td>定义分页</td><td>GET /projects/{projectCode}/process-definition</td><td>工作流 code、版本和发布状态 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessDefinitionController.java\">[DS1]</a></td></tr><tr><td>定义详情与节点</td><td>GET /projects/{projectCode}/process-definition/{code} 及 /{code}/tasks</td><td>实际定义及节点资料 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessDefinitionController.java\">[DS1]</a></td></tr><tr><td>实例列表与详情</td><td>GET /projects/{projectCode}/process-instances 及 /{id}</td><td>具体工作流实例状态与参数 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessInstanceController.java\">[DS2]</a></td></tr><tr><td>任务实例</td><td>GET /projects/{projectCode}/task-instances?processInstanceId={id}</td><td>当前实例的实际节点与状态 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/TaskInstanceController.java\">[DS3]</a></td></tr><tr><td>节点日志</td><td>GET /log/detail?taskInstanceId={id}&amp;skipLineNum=0&amp;limit=200</td><td>分页日志 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/LoggerController.java\">[DS4]</a></td></tr><tr><td>调度计划</td><td>GET /projects/{projectCode}/schedules</td><td>按实际参数读取计划；注意定义 id 与 code 的区别 <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/SchedulerController.java\">[DS6]</a></td></tr></tbody></table></div><p>同步过程分采集与提交两阶段。collector_run 保存授权范围、generation、页数、读取数、错误和完整性。各项目分页读取到临时快照，只有完整成功的项目才提交差异。失败或权限变化时保留旧对象，不把“本次没读到”当作已删除。若分页期间源数据变化，保留差异证据并在后续完整周期复核。</p><p>外部状态保存上线、下线、定义版本或来源可见性；本地 monitorEnabled、展示名称、说明和补算验证独立保存。新发现默认不纳入监控，由用户勾选；已选择对象即使下线也保留选择并展示来源异常。目录变更先提示技术核验，不能自动继续沿用旧版本的补算能力证明。</p><p>海豚同步记录仅是目录采集诊断：范围、页码、数量、结果和差异。人工修改行为进入企业审计。作业目录与来源表同步是不同对象，不能把海豚定义数量作为业务表到档数。</p><h2 id=\"b50\">10 具体执行节点与时效监控</h2><p>作业监控按 accessId 查询最近执行及历史实例。海豚实例列表的定义筛选参数为 processDefineCode，不与其他接口的 processDefinitionCode 混用。执行主键保存 connectionId、projectCode、processInstanceId；节点用实际 taskInstanceId。查看执行必须带稳定身份打开对应实例，避免仅跳转总览。</p><p>定义节点可说明预期流程，实际执行节点与日志来自任务实例。check_input、calc_volume、check_output 等名称仅为样例，不在平台硬编码为固定三节点。执行状态由外部返回，业务输出结果通过 Java 或实际执行程序的回执关联保存，不能通过日志字符串包含“成功”就判业务通过。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ProcessInstanceController.java\">[DS2]</a> <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/TaskInstanceController.java\">[DS3]</a> <a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/LoggerController.java\">[DS4]</a></p><p>时效监控保存计划来源、计划版本、时区、预期触发时间、容忍窗口和采集完整性。最近实例晚于阈值可以告警，但计划过期、授权项目未完整同步或实例查询失败时，只给采集不可判断信息，不直接判漏跑。排除手工执行与重复触发时必须记录实际触发来源。</p><p>对于持续运行作业、流式任务和普通离线批作业使用不同的时效规则。历史趋势按相同业务范围、执行方式和定义版本对齐；失败实例重试与新补算请求不合并成同一次执行。节点日志按行分页、限流和脱敏，不将外部日志原样拼成可执行 HTML。</p><h2 id=\"b55\">11 Java 执行器接入契约</h2><p>Java 执行器登记的是已有程序和服务契约。服务标识从企业注册发现或受控白名单解析，不能让前端任意填写 URL、类名或脚本直接执行。平台维护 programId、serviceId、contractVersion、参数 Schema、允许检查范围、执行类型和健康状态。</p><pre>// 以下为本平台建议的 Java 执行服务契约，不是 Flink 或海豚原生接口\nPOST /internal/executors/{programId}/executions\nIdempotency-Key: req-20261124-001\n{\n  &quot;requestId&quot;: &quot;REQ-001&quot;, &quot;contractVersion&quot;: &quot;3&quot;,\n  &quot;operation&quot;: &quot;QUALITY_CHECK&quot;, &quot;scopeCode&quot;: &quot;MATCH_ASSOC&quot;,\n  &quot;parameters&quot;: {&quot;biz_date&quot;: &quot;2026-11-23&quot;},\n  &quot;correlationId&quot;: &quot;CORR-001&quot;, &quot;fencingToken&quot;: &quot;142&quot;\n}\n// 受理后返回执行身份，完成通过查询或签名回调报告\n{&quot;accepted&quot;:true,&quot;executionId&quot;:&quot;JAVA-EXEC-001&quot;,&quot;state&quot;:&quot;ACCEPTED&quot;}</pre><p>平台先校验动作、Schema、业务范围和定义版本，再持久请求后提交。执行器按 requestId 去重，支持查询受理与终态；异步回调携带 executionId、requestId、结果序号、终态、业务结果和报告引用，校验服务身份与签名。回调先于平台查询到外部身份时进入 inbox 等待关联，不丢弃或重复执行。</p><p>程序已登记、健康可访问、契约已验证、作业具备补算能力是四种不同状态。健康检查成功不能自动开放补算；程序存在也不代表具有历史输入或幂等写入。质量执行器、普通任务执行器共用同一接入台账，按 execution_access.purpose 区分：检查任务只能选择 purpose 为 QUALITY 的条目。</p><h3 id=\"b55a\">11.1 Java 程序在本平台中的角色</h3><p>本平台不运行用户编写的代码，只调用已发布、已登记的 Java 服务。Java 程序可以承担三类工作：</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:16.00%\"><col style=\"width:46.00%\"><col style=\"width:38.00%\"></colgroup><thead><tr><th scope=\"col\">类型</th><th scope=\"col\">做什么</th><th scope=\"col\">在平台中的表现</th></tr></thead><tbody><tr><td>质量检查</td><td>按已备案范围对 Doris 或只读从库执行检查，计算违规数量、分母和样本，生成结构化报告</td><td>用途为质量检查；检查任务选用；作业监控看执行，质量检查看报告</td></tr><tr><td>数据加工</td><td>读取、计算并写入目标表，例如因子、汇总表的生成</td><td>用途为业务加工；作业监控显示业务结果</td></tr><tr><td>补算与刷新</td><td>按业务日期或范围参数重跑加工逻辑，写入方式经验证可重复执行</td><td>仅业务加工，且补算设置已开放并验证</td></tr></tbody></table></div><h3 id=\"b55b\">11.2 质量检查程序的实现方式</h3><p>检查规则在程序内以版本化规则集维护，页面不生成 SQL。每条规则包含：规则编码、检查逻辑（只读 SQL 或程序逻辑）、分母定义、计数单位（行、笔）、是否必检、容差。规则按类型组织：完整性（关联缺失、必填为空，如 C15 注单对赛事主档）、有效性（码值、取值范围，如 D02）、一致性（跨表数量或金额对账）、及时性（分区或批次是否到档）。</p><p>一次检查的执行过程：按参数确定业务日期与检查范围 → 逐条规则执行计数查询 → 对不通过的规则抽取有限行数的异常样本 → 汇总为报告并回传。任一规则执行报错或范围不完整时，报告标记为执行异常或不完整，不能当作零异常；必检规则未全部执行时不能判通过。</p><h3 id=\"b55c\">11.3 接入步骤</h3><p class=\"flowtitle\">Java 质量检查程序接入</p><div class=\"flow\" role=\"group\" aria-label=\"Java 质量检查程序接入\"><span>1　服务注册与版本发布</span><span>2　实现执行契约接口</span><span>3　作业接入登记（用途：质量检查）</span><span>4　契约验证调用</span><span>5　创建检查任务</span><span>6　调度或手动执行</span></div><div class=\"tablewrap\"><table><colgroup><col style=\"width:22.00%\"><col style=\"width:16.00%\"><col style=\"width:62.00%\"></colgroup><thead><tr><th scope=\"col\">步骤</th><th scope=\"col\">负责方</th><th scope=\"col\">要点</th></tr></thead><tbody><tr><td>服务注册与版本发布</td><td>程序开发</td><td>在企业注册中心登记服务标识与版本；平台只认白名单中的服务，不接受前端填写 URL 或类名</td></tr><tr><td>实现执行契约</td><td>程序开发</td><td>受理（POST executions，按 requestId 幂等）、状态查询（GET executions/{id}）、结果回调或报告查询（GET reports/{id}）、健康检查；回调带签名</td></tr><tr><td>作业接入登记</td><td>技术维护</td><td>新增执行器：程序编码、服务标识、定义版本、参数契约、用途选质量检查并填写已备案检查范围</td></tr><tr><td>契约验证</td><td>技术维护</td><td>用测试参数调用一次，核对受理、状态与报告结构；未验证的执行器可登记但不能执行</td></tr><tr><td>创建检查任务</td><td>业务或质量人员</td><td>在质量检查选择执行器与范围；同一执行器可被多个检查任务按不同范围复用</td></tr><tr><td>调度或手动执行</td><td>调度 / 用户</td><td>海豚定时调用或在质量检查点“执行检查”；纳入作业监控后可看到执行状态与时效</td></tr></tbody></table></div><h2 id=\"b60\">12 补算执行与数据一致性</h2><p>补算策略绑定已验证定义摘要，包含参数、可回溯窗口、最大范围、写入模式、验证材料和可发起动作。界面“可申请补算”由这些事实与当前权限共同计算，不是海豚实例状态自带字段。未完成验证的作业默认不开放。</p><p class=\"flowtitle\">受控补算</p><div class=\"flow\" role=\"group\" aria-label=\"受控补算\"><span>1　校验权限参数版本</span><span>2　检查输入与输出互斥</span><span>3　持久化幂等请求</span><span>4　提交外部并记录实例</span><span>5　查询或回调并核对输出</span></div><p>预检只是当前时点的判断，实际提交必须再次校验权限、定义版本和资源冲突。先持久 execution_request 与 outbox，再由 worker 调外部；提交超时进入 SUBMISSION_UNKNOWN 或待核实，不自动再发可能重复写入的请求。关联到外部实例后才能转为已受理或运行。执行终态与业务输出校验终态分别保存。</p><p>海豚启动与实例控制能力由 3.1.9 ExecutorController 提供，适配层按已验证参数映射使用 start-process-instance 或对应实例操作，不把业务补算简单等同于通用重跑。日期参数补算、恢复失败实例、按需刷新是不同操作。具体 commandType、调度时间与依赖策略必须按作业契约验证。<a href=\"https://github.com/apache/dolphinscheduler/blob/3.1.9/dolphinscheduler-api/src/main/java/org/apache/dolphinscheduler/api/controller/ExecutorController.java\">[DS5]</a></p><p>数据一致性依赖执行程序，不是页面多加一次确认即可保证。可选写入方案包括按稳定业务键幂等更新、隔离范围重建、暂存结果校验后发布；实际方案必须由对应 Doris 模型与程序实现验证。不能直接把“海豚执行成功”解释为输出没有重复或覆盖。</p><p>输出资源组来自 operation_policy.output_resource_group，开放补算时必填；resource_reservation 以（资源组，业务范围）为互斥单位。输出资源冲突按目标资源组和业务范围判断重叠，不只比较两个请求字符串是否一致。两个日期区间部分重叠也可能冲突。定时执行、补算和手工外部执行若会写同一范围，必须共同遵守互斥或经验证的隔离机制；仅本平台按钮上锁不能约束直接从海豚发起的写入。</p><p>Redis 可以做短期协调与限流，但锁租约过期不代表旧执行已停止。<a href=\"https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/\">[L1]</a> 长执行需要持久 resource_reservation、续约、执行身份和输出端可验证的 fencing 或等价隔离。执行状态未知或 worker 重启时先核对实例和事务，不能仅凭 TTL 释放冲突范围。未具备这些能力的任务保持不开放补算。</p><h2 id=\"b68\">13 质量检查与报告协议</h2><p>质量任务引用 execution_access 和备案 scopeCode，保存任务名称、说明及必要的参数模板。规则程序在 Java 或海豚中维护，页面不生成任意 SQL。执行时保存 taskVersion、executorVersion、ruleSetVersion、业务范围和 asOf 时间，保证报告能够复现。</p><pre>{\n  &quot;requestId&quot;:&quot;REQ-Q-001&quot;, &quot;executionId&quot;:&quot;EXEC-Q-001&quot;,\n  &quot;reportId&quot;:&quot;REPORT-001&quot;, &quot;executionState&quot;:&quot;SUCCESS&quot;,\n  &quot;qualityState&quot;:&quot;FAILED&quot;, &quot;scopeCode&quot;:&quot;MATCH_ASSOC&quot;,\n  &quot;ruleSetVersion&quot;:&quot;2026.11&quot;, &quot;requiredRulesComplete&quot;:true,\n  &quot;results&quot;:[{&quot;ruleCode&quot;:&quot;C15&quot;,&quot;checked&quot;:100000,\n    &quot;violations&quot;:12,&quot;unit&quot;:&quot;row&quot;,&quot;state&quot;:&quot;FAILED&quot;,\n    &quot;sampleRef&quot;:&quot;SAMPLE-001&quot;}],\n  &quot;producedAt&quot;:&quot;2026-11-24T02:00:00Z&quot;\n}</pre><p>C15 的匹配分母、删除记录、空值和关联截止时间须由业务确认；D02 需明确实际码值和码表版本。一个规则未执行、报错或范围不完整时，综合报告标记不完整或执行异常，不把其当成零异常。可容忍比例、必检项清单和聚合算法形成版本化契约。</p><p>大样本明细分页存储，报告总数与样本截断数分别返回，不能让用户误以为样本数就是全部异常数。报告不可变，问题记录引用原 reportId 和 ruleCode；复检创建新 reportId，并保存 parentReportId 或 issueId 关系。关闭问题记录经确认的复检依据，保留原始不通过事实。</p><h3 id=\"b68a\">13.1 作业监控与质量检查的数据流</h3><p>质量执行器的一次运行产生两类事实，分别落到不同模块：执行状态（是否受理、运行、成功或失败、耗时）进入执行记录，由作业监控展示；检查结论（各规则通过与否、数量、样本）进入 quality_report，由质量检查展示。作业监控对 purpose 为 QUALITY 的作业不展示检查结论，只给出报告入口（reportId 未回传时显示“报告未回传”），也不提供补算与重试。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:18.00%\"><col style=\"width:30.00%\"><col style=\"width:24.00%\"><col style=\"width:28.00%\"></colgroup><thead><tr><th scope=\"col\">事实</th><th scope=\"col\">来源</th><th scope=\"col\">存储</th><th scope=\"col\">展示</th></tr></thead><tbody><tr><td>执行状态与时效</td><td>海豚实例或 Java 执行状态查询 / 回调</td><td>execution_record</td><td>作业监控（执行记录、运行超时、疑似漏跑）</td></tr><tr><td>检查结论与样本</td><td>执行程序回传的报告</td><td>quality_report、report_sample</td><td>质量检查（检查报告、问题处理）</td></tr><tr><td>两者的关联</td><td>execution_record.report_id</td><td>—</td><td>作业监控的“报告”入口、质量检查的“执行记录”</td></tr></tbody></table></div><h3 id=\"b68b\">13.2 作业用途模型与修改约束</h3><p>execution_access.purpose 取 BUSINESS 或 QUALITY，页面显示为业务加工、质量检查；海豚目录新发现的工作流默认 BUSINESS，新登记的 Java 执行器默认 QUALITY。purpose 与 declared_scopes 是本平台字段，目录同步不覆盖。用途影响：补算设置只对 BUSINESS 开放；检查任务候选只含 QUALITY；作业监控的用途筛选默认 BUSINESS。</p><pre>PUT /api/data-center/v1/execution-access/DS-MAIN:200:10301\nIf-Match: \"6\"\n{\"displayName\":\"商户汇总示例\",\"purpose\":\"QUALITY\",\n \"declaredScopes\":[\"商户汇总结果表\"],\"note\":\"\"}\n\n// 被检查任务引用时改为 BUSINESS\n409 {\"code\":\"PURPOSE_REFERENCED\",\"message\":\"该执行器已被 1 个检查任务引用（注单码值检查）\",\n     \"references\":[{\"qualityTaskId\":\"QT-CODES\",\"name\":\"注单码值检查\"}]}\n// 已开放补算时改为 QUALITY\n409 {\"code\":\"PURPOSE_POLICY_OPEN\",\"message\":\"该作业已开放补算，请先关闭补算\"}\n// QUALITY 且范围为空\n422 {\"code\":\"SCOPE_REQUIRED\",\"field\":\"declaredScopes\"}</pre><p>服务端在事务内校验：改为 BUSINESS 时检查 quality_task 引用数为 0；改为 QUALITY 时检查 operation_policy 未开放；QUALITY 时 declared_scopes 非空。已被引用的范围不可修改或删除（返回 SCOPE_LOCKED），只能追加新范围，因为检查任务以范围标识引用，改写会让已有任务失效。用途修改写统一审计，记录修改前后值。</p><h3 id=\"b68c\">13.3 质量检查的数据库性能保护</h3><p>质量检查的查询量通常大于业务查询，必须在设计上避免影响业务库与 Doris 的正常服务。以下规则写入执行器契约与验证清单，具体数值由 DEC16 确认。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:16.00%\"><col style=\"width:50.00%\"><col style=\"width:34.00%\"></colgroup><thead><tr><th scope=\"col\">方面</th><th scope=\"col\">要求</th><th scope=\"col\">说明</th></tr></thead><tbody><tr><td>查询对象</td><td>优先查询 Doris 目标库；必须查源库时只连只读从库，不直接查询业务主库</td><td>检查目的就是核对落地数据，Doris 更适合聚合扫描</td></tr><tr><td>资源隔离</td><td>使用专用只读账号；Doris 设置 query_timeout、exec_mem_limit，按版本可用时使用 Workload Group 限制 CPU、内存与并发</td><td>Workload Group 需按现网 Doris 版本核实</td></tr><tr><td>范围裁剪</td><td>所有检查 SQL 必须带业务日期或分区条件，默认只检查当日或增量分区；禁止无分区条件的全表扫描</td><td>历史全量检查单独申请、错峰执行</td></tr><tr><td>并发与时间窗</td><td>每个执行器设并发上限，超出排队；与业务加工错峰，放在加工作业完成之后的非高峰时段；同一范围互斥</td><td>可由海豚依赖或平台排队实现</td></tr><tr><td>SQL 规范</td><td>新规则上线前做执行计划评审；关联检查用基于主键的反连接，在数据所在库内聚合，不把大表拉到程序内存比对</td><td>规则版本化，变更需重新验证</td></tr><tr><td>结果量</td><td>报告只存计数和有限样本（如每条规则最多 100 行）；全量异常明细落专用结果表，异步导出</td><td>避免报告接口传输大结果集</td></tr><tr><td>熔断</td><td>超时或资源不足时终止本次检查，报告标记执行异常，不判通过；连续失败触发告警</td><td>失败的检查不能当作零异常</td></tr><tr><td>可观测</td><td>每次检查在报告元数据中记录扫描行数、耗时、峰值内存</td><td>用于发现变慢的规则和调整时间窗</td></tr></tbody></table></div><h2 id=\"b78\">14 告警生成确认与恢复</h2><p>告警评估在后台运行，输入为作业实例、可信同步快照、质量报告和采集诊断。每条输入带事件 ID、来源对象、环境、来源序号、发生时间、采集时间和完整性。重复事件按 consumer 与 eventId 去重；乱序旧序号不能覆盖新状态。事务 outbox 与事件 inbox 用于保证业务事实和告警投递可恢复。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:24.00%\"><col style=\"width:33.00%\"><col style=\"width:43.00%\"></colgroup><thead><tr><th scope=\"col\">当前情况</th><th scope=\"col\">输入事实</th><th scope=\"col\">下一步</th></tr></thead><tbody><tr><td>无活动告警</td><td>有效异常满足持续规则</td><td>创建新的 incident 并占用规则对象活动槽</td></tr><tr><td>已有活动告警</td><td>同一异常继续</td><td>更新末次发生和证据，不重复创建</td></tr><tr><td>已有活动告警</td><td>有效正常满足恢复规则</td><td>记录恢复依据与时间，释放活动槽</td></tr><tr><td>已有活动告警</td><td>接口失败或数据过期</td><td>保留业务告警；另按采集诊断规则处理</td></tr><tr><td>任意异常状态</td><td>用户点击确认</td><td>仅更新确认状态，异常状态不变</td></tr><tr><td>已经恢复</td><td>新的有效异常发生</td><td>新建发生周期，旧事件仍可追溯</td></tr></tbody></table></div><p>活动槽唯一键建议为环境、ruleCode、objectType、objectId；所有并发评估先锁定或原子更新该槽。确认与异常状态独立保存，恢复可按连续正常次数或明确成功终态触发。每次正常采样必须是新的有效来源序号，刷新同一快照不能累计恢复次数。</p><p>作业失败告警按作业合并，由该作业下一次执行成功恢复，不以另一作业成功覆盖；质量告警由对应范围和规则的有效复检结果恢复；同步任务告警由连续 N 次新的 RUNNING 采样恢复，N 取采集配置的恢复所需连续正常次数。取消监控、取消关联或对象不再存在时保留历史，结束跟踪如何展示由 DEC05 确认，不能伪造业务恢复。</p><p>疑似漏跑与运行超时分开：前者需要可信计划和完整实例查询，后者需要已识别实例及起始时间。告警文案保留可操作对象，但摘要也要按其授权范围裁剪，不能因为告警中心可见就公开全部日志、样本和敏感参数。</p><h3 id=\"b78a\">14.1 告警对象与合并规则</h3><p>活动告警槽以 fingerprint 唯一，fingerprint 由规则编码、对象类型和对象 ID 组成。对象粒度决定“同一类问题出几条告警”，按下表确定。target 字段与 fingerprint 分开保存：fingerprint 决定合并，target 决定前往时定位到哪条记录（例如作业告警定位到最近一次执行）。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:22.00%\"><col style=\"width:20.00%\"><col style=\"width:38.00%\"></colgroup><thead><tr><th scope=\"col\">规则</th><th scope=\"col\">fingerprint 对象</th><th scope=\"col\">target</th><th scope=\"col\">产生与恢复</th></tr></thead><tbody><tr><td>BATCH_FAILED</td><td>WORKFLOW:{作业}</td><td>最近一次执行</td><td>只看该作业最近一次执行：失败产生，成功恢复，运行中不变；再次失败时累计次数加 1、target 更新为新执行</td></tr><tr><td>BATCH_RUNTIME_TIMEOUT</td><td>WORKFLOW:{作业}</td><td>最近一次执行</td><td>最近一次执行运行中且超过阈值产生；该执行结束恢复</td></tr><tr><td>BATCH_EXPECTED_MISSING</td><td>WORKFLOW_HEALTH:{作业}</td><td>作业</td><td>计划有效、查询完整且超过宽限仍未发现执行</td></tr><tr><td>SYNC_TASK_DOWN</td><td>SYNC_TASK:{集群/Job ID}</td><td>Flink 任务</td><td>状态属于 FAILED、FAILING、RESTARTING、CANCELED、CANCELLING、SUSPENDED 时产生，摘要列出受影响来源表；连续 N 次新的 RUNNING 采样恢复；采集失败或数据不可信时不产生也不恢复</td></tr><tr><td>QUALITY_SCOPE</td><td>检查任务 | 范围 | 业务日期 | 定义版本</td><td>最近报告</td><td>最近报告有不通过规则产生；同范围复检全部通过恢复</td></tr><tr><td>JAVA_FAILED</td><td>JAVA_EXECUTION:{执行}</td><td>该次执行</td><td>按次产生；是否改为按程序合并见 DEC17</td></tr><tr><td>SYNC_COLLECTOR / DS_COLLECTOR</td><td>采集源</td><td>采集页面</td><td>采集接口不可用产生，恢复后恢复</td></tr></tbody></table></div><p>同步任务告警的 RUNNING 计数按任务保存（最近处理的 sample_seq 与连续 RUNNING 次数），只有 sample_seq 变化时才累加，重复评估同一快照不累计。前往同步监控时返回 routeKey=syncmonitor 与筛选参数 task={任务名称}。</p><p>页面不显示告警级别；alert_incident 仍保存级别（FAILED 为 P1，其余为 P2），供以后的通知分级使用，是否保留见 DEC19。列表排序为告警中在前、最近发生倒序。</p><p>从 V9.0 迁移：作业类活动告警的 fingerprint 由 BATCH_INSTANCE:{执行} 改写为 WORKFLOW:{作业}，同一作业的多条活动告警合并（保留最近一条，累计次数相加，首次发生取最早）；按表的同步告警（SYNC_MAPPING）结束跟踪，由新规则按任务重新评估生成。迁移只执行一次并记录版本。</p><h2 id=\"b84\">15 Gateway 鉴权跳转与统一审计</h2><p>Gateway 用企业已有认证和路由过滤机制接入身份校验；动作码和业务对象权限由企业权限服务及后端实现，并不是 Gateway 自动认识来源表或海豚实例。<a href=\"https://docs.spring.io/spring-cloud-gateway/docs/3.1.10/reference/html/\">[G1]</a> 后端再次校验当前用户、环境、动作和资源范围，阻止直接访问 API 或篡改对象 ID 绕过前端。权限服务不可用或会话过期时拒绝写入。</p><p class=\"flowtitle\">告警前往与返回</p><div class=\"flow\" role=\"group\" aria-label=\"告警前往与返回\"><span>1　读取授权告警摘要</span><span>2　点击受控前往按钮</span><span>3　请求导航上下文并鉴权</span><span>4　进入目标列表定位对象</span><span>5　目标详情再次鉴权</span><span>6　返回原告警上下文</span></div><p>navigation-context 只返回白名单 routeKey、资源 ID、定位参数和受控返回上下文，不返回任意 URL、外部凭据或可伪造的授权结论。前端路由守卫检查页面能力，目标列表和详情 API 仍执行最终对象校验。有告警读取权限但无同步读取权限时，前往按钮保留，点击提示无权限并停留告警页；对有权限的作业监控跳转照常成功。</p><p>导航失败区分 401 会话失效、403 无权限、404 对象不可用及服务故障。对象删除或授权缩小时不退化为展示所有业务记录。成功定位后按稳定身份筛选并高亮，由用户主动打开详情；返回时恢复原告警筛选和页码，不连续自动弹窗。对外部海豚页面的打开也用受控地址，不能把服务 token 放进 URL。</p><p>原型使用以下权限码演示读写分离，生产按 DEC13 映射到企业权限体系：权限码在权限管理系统的角色管理中分配给角色，菜单与按钮资源在资源管理中登记。页面权限决定菜单和读取接口；写权限在按钮显示和后端接口两处校验，后端为准。作业用途、已备案检查范围的修改归入 data:job-binding:manage。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:32.00%\"><col style=\"width:40.00%\"><col style=\"width:28.00%\"></colgroup><thead><tr><th scope=\"col\">权限码</th><th scope=\"col\">控制范围</th><th scope=\"col\">原型持有身份</th></tr></thead><tbody><tr><td>monitor:alarm:read / monitor:alarm:ack</td><td>告警读取 / 告警确认</td><td>全部 / 除告警查看员外</td></tr><tr><td>data:source:read / data:source:manage</td><td>数据源读取 / 新增编辑</td><td>管理员、产品经理 / 管理员</td></tr><tr><td>data:table:read / data:table:manage</td><td>来源表读取 / 新增编辑</td><td>管理员、产品经理 / 管理员</td></tr><tr><td>data:sync:configure</td><td>映射维护、Flink 任务登记与校验</td><td>管理员</td></tr><tr><td>data:flink:catalog:read</td><td>Flink 任务读取</td><td>管理员、产品经理</td></tr><tr><td>data:sync:read / data:batch:read</td><td>同步监控 / 作业监控读取</td><td>管理员、产品经理、对应巡检员</td></tr><tr><td>data:quality:read / data:quality:run / data:quality:manage</td><td>质量检查读取 / 发起检查与复检 / 任务配置与问题处理</td><td>管理员、产品经理</td></tr><tr><td>data:job-binding:read / data:job-binding:manage</td><td>作业接入读取 / 资料、监控与时效设置</td><td>管理员、产品经理 / 管理员</td></tr><tr><td>data:policy:read / data:policy:manage / data:job:recompute</td><td>补算设置读取 / 维护 / 发起补算</td><td>管理员、产品经理 / 管理员 / 管理员</td></tr><tr><td>data:connection:read / data:connection:manage</td><td>连接读取 / 维护与测试</td><td>管理员、产品经理 / 管理员</td></tr><tr><td>data:config:read / data:settings:manage</td><td>采集配置读取 / 保存及演示场景</td><td>管理员、产品经理 / 管理员</td></tr></tbody></table></div><p>人工写操作统一通过 AuditBridge 记录 actor、动作、对象、请求 ID、变更摘要、结果、时间和必要的来源链路。实际写入审计事件与业务事务通过 outbox 保持可恢复。失败与拒绝行为按企业审计规则处理。日志不保存明文 token、密码或完整敏感样本；业务模块不新增人工操作记录列表。</p><h2 id=\"b90\">16 本平台 API 与错误契约</h2><p>以下 /api/data-center/v1 为建议新增的平台接口，均由 Gateway 进入并复核对象范围，不是外部系统原生地址。身份和外部长 code 统一按字符串传输。分页使用 pageNo、pageSize，所有列表只接受 20、50、100，默认 20（页面按列表记住用户选择）。排序字段使用服务器白名单，不能拼接任意列或 SQL。</p><div class=\"tablewrap\"><table><colgroup><col style=\"width:19.00%\"><col style=\"width:50.00%\"><col style=\"width:31.00%\"></colgroup><thead><tr><th scope=\"col\">接口组</th><th scope=\"col\">建议平台接口</th><th scope=\"col\">关键行为</th></tr></thead><tbody><tr><td>来源资料</td><td>GET/POST /sources；PATCH /sources/{id}；GET /sources/{id}/tables-summary</td><td>摘要就地展示，无负责人字段</td></tr><tr><td>来源表</td><td>GET/POST /source-tables；PATCH /source-tables/{id}</td><td>物理来源身份查重，分字段搜索和排序</td></tr><tr><td>当前映射</td><td>GET/PUT/DELETE /source-tables/{id}/current-mapping；GET /source-tables/{id}/mapping-history</td><td>一个统一编辑接口，CAS 与单条当前指针</td></tr><tr><td>Flink 目录</td><td>GET/POST /flink-tasks；PATCH/DELETE /flink-tasks/{id}；POST /{id}/validations</td><td>共享登记、验证和引用保护</td></tr><tr><td>目录采集</td><td>POST /flink-discovery-runs；POST /dolphin-sync-runs；GET 对应 /{id}</td><td>后台采集和完整性记录，不由页面直接扫描</td></tr><tr><td>运行查询</td><td>GET /job-monitor、/executions/{id}、/executions/{id}/nodes、/nodes/{id}/logs</td><td>打开具体执行，不只跳列表</td></tr><tr><td>执行申请</td><td>POST /execution-prechecks；POST /execution-requests；GET /execution-requests/{id}</td><td>参数能力校验、幂等、受理未知核对</td></tr><tr><td>质量检查</td><td>/quality-tasks、/quality-reports、/quality-issues</td><td>绑定契约、报告不可变</td></tr><tr><td>告警</td><td>GET /alarms、/{id}/navigation-context；POST /{id}/acknowledgements</td><td>对象鉴权、确认独立；列表不返回级别字段</td></tr><tr><td>同步监控（首期）</td><td>GET /sync-monitor；POST /sync-monitor/refresh-requests；GET /collector-runs</td><td>只读快照；刷新受限并去重</td></tr><tr><td>同步监控（二期）</td><td>GET /sync-observations/{mappingId}；GET/PUT /flink-tasks/{id}/required-items</td><td>详情只读快照；必需项按任务配置</td></tr><tr><td>作业接入资料</td><td>PUT /execution-access/{id}（displayName、note、purpose、declaredScopes）</td><td>用途与范围的引用、补算约束，错误码见 13.2</td></tr><tr><td>作业接入设置</td><td>PUT /execution-access/{id}/monitor；PUT /execution-access/{id}/timing-policy；PUT /execution-access/{id}/operation-policy；POST /execution-access/{id}/retirements</td><td>监控选择、时效、补算设置、平台退役分别授权，均带 If-Match</td></tr><tr><td>连接与配置</td><td>GET/POST /connections；PATCH /connections/{id}；POST /connections/{id}/tests；GET/PUT /collection-settings</td><td>凭据只传引用；测试结果异步返回；配置整体校验</td></tr><tr><td>质量执行</td><td>POST /quality-tasks/{id}/runs；POST /quality-issues/{id}/rechecks</td><td>需 data:quality:run；与任务配置的 manage 权限分开</td></tr></tbody></table></div><pre>PUT /api/data-center/v1/source-tables/TABLE-003/current-mapping\nIf-Match: &quot;17&quot;\nIdempotency-Key: map-edit-001\n{\n  &quot;taskId&quot;:&quot;FT-001&quot;, &quot;expectedTaskRevision&quot;:4,\n  &quot;targetConnectionId&quot;:&quot;DORIS-MAIN&quot;,\n  &quot;targetDatabase&quot;:&quot;base&quot;, &quot;targetTable&quot;:&quot;t_order&quot;,\n  &quot;note&quot;:&quot;主同步监控关联&quot;\n}\n// 服务端自动判断是否更换任务或目标，而不是要求用户选另一业务流程\n{&quot;mappingId&quot;:&quot;MAP-018&quot;,&quot;revision&quot;:18,&quot;changeType&quot;:&quot;TASK_AND_TARGET&quot;,\n &quot;observationState&quot;:&quot;PENDING_COLLECTION&quot;}</pre><pre>{\n  &quot;code&quot;:&quot;REVISION_CONFLICT&quot;, &quot;message&quot;:&quot;当前关联已变化，请重新核对&quot;,\n  &quot;requestId&quot;:&quot;REQ-001&quot;, &quot;retryable&quot;:false,\n  &quot;currentRevision&quot;:18\n}\n// HTTP 401/403/404/409/422/429/503 与业务错误码对应\n// 异步请求受理后返回 202 和 requestId；不得把 202 当成业务成功</pre><p>接口时间一律使用 ISO 8601 UTC（如 2026-11-24T02:00:00Z），页面按业务时区格式化为 YYYY-MM-DD HH:mm:ss；日期筛选参数按业务日期传 YYYY-MM-DD，由服务端换算区间。只改说明返回 METADATA_ONLY 并保留当前快照。未关联和无历史、没有可用指标、采集失败和权限拒绝均返回不同结构。校验接口返回被验证的身份版本；保存时身份已改变则冲突。列表查询不能仅在前端过滤已经下发的越权对象。</p><h2 id=\"b96\">17 配置容量与服务运行</h2><p>建议从原型默认值开始试点观测：Flink 任务状态约 30 秒周期，请求超时约 5 秒，同步任务告警连续 2 次 RUNNING 后恢复；海豚定义目录用更低频周期，实际按规模压测确认。首期没有快照过期阈值和延迟阈值；二期恢复快照过期阈值（建议不小于两倍采集间隔），延迟阈值按同步任务配置，不全平台共用。所有周期与阈值均纳入 DEC04、DEC05、DEC09 评审。</p><p>采集按集群并发限额与任务去重，连接故障退避并增加随机抖动，避免集中轮询冲击 JobManager 或海豚。读取可以有限重试；执行提交不得直接复用通用 HTTP 重试策略。分页和日志限制最大返回量，前端刷新只查询快照或提交受限刷新请求。</p><p>统一可观测性包括采集成功率、持续时间、完整页数、有效对象覆盖率、快照年龄、队列积压、重复事件数、待核实执行、请求受理到终态耗时与告警评估延迟。应用自身异常也写入监控，但避免依赖同一故障服务才能报警。</p><p>建议元数据关系库定期备份，报告和快照按实际保留期限分层；原始执行日志优先留在外部系统并保存受控引用。Redis 缓存失效时可降级为最近持久快照并标注时效，不能清空数据后显示全部正常。凭据引用由企业密钥服务或受控配置解析，按连接作用域隔离、轮换和最小化授权。</p><h2 id=\"b101\">18 迁移灰度与异常恢复</h2><p>迁移先导入来源资料和当前映射，校验来源身份、目标格式和任务登记去重。旧版单表多条关联不自动挑第一条：所有旧映射和可信快照归档为候选，当前指针置空或标记待确认，由授权用户选择一条再启用观测。旧任务不因资料迁移被停止。</p><p>旧人工任务缺少所属集群时保留待补充登记，不凭名称或仅凭跨集群 Job ID 自动猜测身份。任务校验成功后纳入共享目录，原有来源表再确认关联。历史负责人字段不继续暴露。现有浏览器样例数据不作为生产数据库导入依据。</p><p>灰度顺序建议为只读资料与目录、真实状态采集、质量报告和告警、少量可验证补算。先用一个 Flink 集群和一个海豚项目做契约测试，验证授权边界与完整分页，再逐步扩大。补算开放前必须完成真实输入、写入和定时并发验证。</p><p>回滚管理界面时保留新表和身份版本，使用兼容视图或只读降级，不将历史压回旧数组造成多条当前关系。执行已提交的请求继续核对到终态，不能因版本回滚重新提交。关键配置与 outbox 消费进度一并留存，避免回滚后重复发出执行事件。</p><h2 id=\"b106\">19 联调与验收矩阵</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:21.00%\"><col style=\"width:43.00%\"><col style=\"width:36.00%\"></colgroup><thead><tr><th scope=\"col\">验证领域</th><th scope=\"col\">必须覆盖的用例</th><th scope=\"col\">通过依据</th></tr></thead><tbody><tr><td>映射与目录</td><td>AC04 至 AC11：共享任务、多表复用、单条当前、统一编辑、并发与删除</td><td>关系库同时并发编辑仍只有一个当前指针；旧快照不变</td></tr><tr><td>外部 API</td><td>Flink 状态指标、DS 定义实例节点日志、Zeppelin 段落</td><td>使用真实版本响应做契约测试，错误和分页中断可重放</td></tr><tr><td>执行一致性</td><td>AC17 AC18：重复点击、超时、崩溃、定时与补算重叠</td><td>无重复受理，未知状态可核对，输出范围与写入策略验证</td></tr><tr><td>质量检查</td><td>AC19 AC20 AC43 至 AC45：缺失规则、异常样本、复检、用途约束</td><td>报告快照不可变，缺失不计通过，用途修改受引用与补算约束</td></tr><tr><td>告警与权限</td><td>AC21 AC22 AC26：确认恢复、旧序号、越权、权限服务故障</td><td>重复采样不累计恢复，目标读取最终鉴权，写入拒绝可审计</td></tr><tr><td>性能与恢复</td><td>AC12 AC13 AC15 AC23：过期、低流量、部分失败和缓存丢失</td><td>有明确降级状态，关系与请求事实可恢复</td></tr></tbody></table></div><p>V9.8 原型自动回归共 621 项检查，通过 621 项：以科技部管理员和风控产品经理两个身份逐页点击全部可操作按钮（395 次，检查脚本异常、旧版本标识、负责人残留、时间格式和已停用的按钮名称），另有版本与命名 6 项、日期筛选 3 项、同步监控与同步告警 11 项、映射新建与编辑 4 项、补算输出资源组 3 项、配置校验 1 项、权限与告警跳转 21 项、列表版式 69 项（1366px 与 1440px 宽度）、菜单 24 项、字号与控件尺寸 41 项、作业监控与质量检查分工 11 项、分页 16 项、告警合并与级别 5 项、作业用途 10 项、存储隔离 1 项。该结果不是浏览器视觉验收，也不是生产 API 集成、并发压测或真实数据一致性证明。发布前应按本章矩阵补齐真实联调。</p><h2 id=\"b109\">20 需求与实现追踪</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:28.00%\"><col style=\"width:22.00%\"><col style=\"width:50.00%\"></colgroup><thead><tr><th scope=\"col\">PRD 需求</th><th scope=\"col\">技术章节</th><th scope=\"col\">交付或待实现</th></tr></thead><tbody><tr><td>SRC01 SRC02 TBL01 TBL02</td><td>第 3 15 16 章</td><td>原型已提供读写分离；关系库唯一约束与审计待开发</td></tr><tr><td>GEN01 至 GEN08</td><td>第 15 16 17 章</td><td>原型已统一时间格式、命名与写按钮权限；后端鉴权与时区换算待开发</td></tr><tr><td>MAP01 至 MAP04</td><td>第 3 4 16 18 章</td><td>原型交互已提供；关系库约束与事务实现待开发</td></tr><tr><td>FLK01 至 FLK04</td><td>第 5 6 章</td><td>目录和校验离线示例已提供；真实集群发现与鉴权待适配</td></tr><tr><td>SYN01 至 SYN03</td><td>第 6 7.1 14.1 16 章</td><td>原型已提供首期页面与按任务告警；采集 worker 与快照表待开发</td></tr><tr><td>OBS01 OBS02（二期）</td><td>第 7.2 至 7.6 章</td><td>按 DEC04 盘点结果逐项接入指标与写入确认</td></tr><tr><td>ACC05 JOB02 DQ03</td><td>第 11 13.1 13.2 章</td><td>原型已提供用途设置与联动；服务端约束与审计待开发</td></tr><tr><td>ALT02 ALT03</td><td>第 14.1 章</td><td>原型已按对象合并并去掉级别显示；fingerprint 迁移待开发</td></tr><tr><td>NAV01 至 NAV03、GEN12</td><td>第 15 16 章</td><td>菜单资源在权限管理登记；分页参数统一</td></tr><tr><td>ACC01 ACC02 JOB01</td><td>第 9 10 11 章</td><td>现网海豚 3.1.9 与 Java 契约联调</td></tr><tr><td>RUN01 至 RUN03、ACC03 ACC04</td><td>第 3 9 11 12 章</td><td>按作业完成写入互斥及幂等验证后开放</td></tr><tr><td>DQ01 DQ02</td><td>第 13 章</td><td>复用已有程序，建立报告与规则版本</td></tr><tr><td>ALT01 AUTH01 CFG01</td><td>第 14 15 17 章</td><td>接企业权限、后台告警、统一审计与密钥配置</td></tr></tbody></table></div><h2 id=\"b111\">21 待确认清单与参考资料</h2><div class=\"tablewrap\"><table><colgroup><col style=\"width:12.00%\"><col style=\"width:22.00%\"><col style=\"width:66.00%\"></colgroup><thead><tr><th scope=\"col\">编号</th><th scope=\"col\">主题</th><th scope=\"col\">实施前需确认</th></tr></thead><tbody><tr><td>DEC01</td><td>现网版本与网络</td><td>海豚已确认 3.1.9；核对 Flink、CDC、Doris Connector、MQ、Zeppelin、Java 与 Gateway 版本，及集群地址发现方式。</td></tr><tr><td>DEC02</td><td>接入权限范围</td><td>确定海豚项目、Flink 集群、Notebook 和服务账号范围，以及企业用户的环境与对象权限。</td></tr><tr><td>DEC03</td><td>任务校验与删除</td><td>确认校验失败仍可登记的范围、校验有效期；仍有关联禁止删除；被删登记再次自动发现时保留任务事实但不恢复来源表关联。</td></tr><tr><td>DEC04</td><td>指标口径与可用性（二期）</td><td>实测现网连接器可用指标、时间戳来源、单位、统计窗口、表级或任务级范围，选定写入结果确认方式（7.4）；未完成前同步监控只展示运行状态。</td></tr><tr><td>DEC05</td><td>告警与恢复</td><td>确认同步告警包含的非运行状态、RESTARTING 是否持续一段时间才告警、恢复所需连续次数；作业告警的超时阈值与漏跑宽限；监控取消与对象消失的处理规则。</td></tr><tr><td>DEC06</td><td>补算试点与写入</td><td>按作业确认可处理范围、保留窗口、幂等写入、定时作业互斥、输出校验与版本变更后的重新验证。</td></tr><tr><td>DEC07</td><td>质量检查标准</td><td>确认 C15、D02 等规则的业务范围、空值与删除处理、必检规则、分母、容差及报告明细保留。</td></tr><tr><td>DEC09</td><td>事务库与容量</td><td>确定元数据关系库、对象规模、并发、历史保留、备份与恢复目标；Doris 与 Redis 不替代核心事务事实库。</td></tr><tr><td>DEC10</td><td>Java 执行契约</td><td>确定服务注册、参数 Schema、健康检查、业务回调、幂等及执行结果查询能力；未验证执行器不能直接执行。</td></tr><tr><td>DEC11</td><td>审计与通知</td><td>对接权限管理的统一操作记录；首期站内告警，其他通知沿用企业既有渠道并另行确认。</td></tr><tr><td>DEC12</td><td>验收与上线</td><td>确认真实联调账号、试点工作流和来源表、验收样本、灰度顺序、回滚范围及生产服务目标。</td></tr><tr><td>DEC13</td><td>生产角色与权限码</td><td>把第 15 章权限码映射到企业角色，确认质量维护与执行、补算设置与发起是否分开。</td></tr><tr><td>DEC14</td><td>目标连接与显示名称</td><td>确认是否存在多个 Doris 目标连接；确认作业显示名称由平台维护还是沿用海豚定义描述。</td></t function v91ProcessTable(table){

  const staleRows=new Map();
  for(let ci=heads.length-1;ci>=0;ci--){
    const h=heads[ci],cfg=V91_SPLIT[h],cells=v91Cells(table,ci);
    if(h==='操作')continue;
    const anySub=cfg?.mode==='slash'?cells.some(td=>td&&td.innerHTML.includes(' / ')):cfg?.mode==='dot'?cells.some(td=>td&&!td.querySelector('button,input,.badge')&&td.innerText.includes(' · ')):cells.some(td=>td&&v91Subs(td).length);

    }
    const th=table.querySelectorAll('thead th')[ci];

      const extra=cells.map(td=>{if(!td)return [v91Dash()];const i=td.innerHTML.indexOf(' / ');if(i<0)return [v91Dash()];const second=td.innerHTML.slice(i+3);td.innerHTML=td.innerHTML.slice(0,i);return [second]});

    }
    if(cfg.mode==='dot'){
      const extra=cells.map(td=>{if(!td)return [v91Dash()];const t=td.innerText.trim(),i=t.indexOf(' · ');if(i<0||td.querySelector('button,input,.badge'))return [v91Dash()];td.textContent=t.slice(0,i);return [`<span class="v91-sub">${esc(t.slice(i+3))}</span>`]});

    }

      const extra=cells.map(td=>{if(!td)return [v91Dash(),v91Dash()];const subs=v91Subs(td),ver=subs[0]?subs[0].innerText.trim():'';subs.forEach(s=>s.remove());const raw=td.innerText.trim(),i=raw.indexOf(' / ');td.innerHTML=esc(i<0?raw:raw.slice(0,i))||v91Dash();return [i<0?v91Dash():`<span class="v91-sub mono">${esc(raw.slice(i+3))}</span>`,ver&&!/待确认/.test(ver)?`<span class="v91-sub mono">${esc(ver)}</span>`:v91Dash()]});

    }
    const maxSubs=Math.min(cfg.h.length-1,Math.max(...cells.map(td=>td?v91Subs(td).length:0)));
    const extra=cells.map(td=>{const out=[];const subs=td?v91Subs(td):[];for(let k=0;k<maxSubs;k++){const el=subs[k];out.push(el?v91SubHtml(el,cfg):v91Dash())}subs.forEach(s=>s.remove());return out});
    th.textContent=cfg.h[0];v91InsertColumn(table,ci,cfg.h.slice(1,1+maxSubs),extra);
  }
  /* 同步监控：指标过期单独成列 */
  heads=v91HeaderTexts(table);
  const obsIndex=heads.indexOf('观测状态');
  if(inMain&&obsIndex>0&&heads.includes('读取滞后')){
    const rows=[...table.querySelectorAll('tbody tr')];
    v91InsertColumn(table,obsIndex-1,['快照时效'],rows.map((tr,ri)=>[tr.querySelector('td[colspan]')?'':staleRows.get(ri)?tag('已过期','orange'):'<span class="v91-sub">有效</span>']));

  const runIndex=heads.indexOf('最近执行'),opsIdx=heads.lastIndexOf('操作');

  if(inMain)(V91_DROP[route]||[]).forEach(h=>{const i=v91HeaderTexts(table).indexOf(h);if(i<0)return;[table.querySelector('thead tr'),...table.querySelectorAll('tbody tr')].forEach(tr=>{const span=tr.querySelector('td[colspan]');if(span){span.colSpan=Math.max(1,span.colSpan-1);return}tr.children[i]?.remove()})});
  /* 列类型 */
  heads=v91HeaderTexts(table);
  heads.forEach((h,ci)=>{const th=table.querySelectorAll('thead th')[ci];if(V91_WRAP.has(h))th.classList.add('v91-wrap');v91Cells(table,ci).forEach(td=>{if(!td)return;if(V91_WRAP.has(h))td.classList.add('v91-wrap');if(h==='来源变更'){td.classList.add('v91-wrap-narrow');const sp=td.querySelector('.v91-sub');if(sp)sp.textContent=sp.textContent.replace(' · ',' ').replace(' → ','→')}if(V91_ID.has(h))td.classList.add('v91-id');if(V91_TRUNC.has(h)){td.classList.add('v91-trunc',h==='Job ID'?'v91-trunc-s':'v91-trunc-l');td.title=td.innerText.trim();if(!td.querySelector('.v91-sub')&&td.textContent.trim()!=='—')td.innerHTML=`<span class="v91-sub">${td.innerHTML}</span>`}})});
}

/* V9.3 所有列表：每页最大行数（20 / 50 / 100，按列表分别记住） */

function v97Pager(key,total,page,size,count,setter=`v10SetPage('${key}',PAGE)`,sizeSetter=`v97SetSize('${key}',this.value)`){

  let prev=0;const nums=numbers.map(n=>{const gap=n-prev>1?'<span class="page-gap">…</span>':'';prev=n;return gap+b(n,n,false,n===page)}).join('');

}
