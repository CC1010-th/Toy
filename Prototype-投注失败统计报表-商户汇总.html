<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投注失败统计报表 - SH汇总</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#303133;font:14px/1.45 Arial,"Microsoft YaHei",sans-serif}.page{padding:20px}.card{min-height:calc(100vh - 40px);background:#fff;border:1px solid #ebeef5}.head{display:flex;align-items:center;height:54px;padding:0 22px;border-bottom:1px solid #ebeef5}.head h2{margin:0;font-size:18px}.back{margin-right:16px;border:0;background:transparent;color:#409eff;cursor:pointer}.scope{margin-left:18px;color:#909399;font-size:12px}.filters{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px 18px;padding:20px 24px}.field{display:flex;align-items:center;min-width:0}.field label{flex:none;width:82px;margin-right:10px;text-align:right;color:#606266}.input,.select{width:100%;height:34px;padding:0 10px;border:1px solid #dcdfe6;background:#fff;color:#606266}.readonly{background:#f5f7fa}.actions{display:flex;justify-content:flex-end;gap:10px;padding:0 24px 18px}.btn{height:34px;padding:0 18px;border:1px solid #dcdfe6;background:#fff;color:#606266;cursor:pointer}.btn.primary{border-color:#409eff;background:#409eff;color:#fff}.btn.link{height:auto;padding:0;border:0;background:transparent;color:#409eff}.metric{padding:12px 24px;border-top:1px solid #ebeef5;border-bottom:1px solid #ebeef5}.metric b{margin-left:6px}.table-wrap{padding:18px 24px 8px;overflow:auto}table{width:100%;min-width:920px;border-collapse:collapse}th,td{height:48px;padding:8px 12px;border:1px solid #ebeef5;text-align:center}th{background:#f5f7fa;color:#606266}.op{display:flex;justify-content:center;gap:20px}.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 24px 20px}.pager{display:flex;align-items:center;gap:8px}.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.38)}.mask.open{display:flex}.modal{width:min(880px,88vw);padding:22px;background:#fff}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.close{border:0;background:transparent;font-size:26px;color:#909399;cursor:pointer}.chart{width:100%;height:300px;margin-top:12px}.grid{stroke:#ebeef5}.line{fill:none;stroke:#5b8ff9;stroke-width:3}.dot{fill:#5b8ff9}.toast{position:fixed;top:24px;left:50%;display:none;transform:translateX(-50%);padding:9px 16px;background:#303133;color:#fff}@media(max-width:1000px){.filters{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="page"><section class="card"><header class="head"><button id="back" class="back">‹ 返回投注失败统计报表</button><h2>SH投注失败汇总</h2><span id="scope" class="scope"></span></header><div class="filters"><div class="field"><label>选择时间 :</label><input id="date" class="input readonly" readonly></div><div class="field"><label>失败原因 :</label><input id="reason" class="input readonly" readonly></div><div class="field"><label>赛种 :</label><select id="sport" class="select"><option>全部</option><option>足球</option><option>篮球</option><option>网球</option></select></div><div class="field"><label>校验 :</label><select class="select"><option>后置校验</option><option>前置校验</option></select></div><div class="field"><label>类型 :</label><select class="select"><option>DG</option></select></div><div class="field"><label>SH名称 :</label><input id="merchant" class="input" placeholder="请输入SH名称或编码"></div></div><div class="actions"><button id="query" class="btn primary">查 询</button><button id="reset" class="btn">重 置</button></div><div class="metric">后置校验JDL：<b>8.33%</b></div><div class="table-wrap"><table><thead><tr><th>SH名称</th><th>最近失败原因时间</th><th>JD次数</th><th>JDL</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div><footer class="foot"><span id="count">共 3 条</span><div class="pager"><button class="btn">‹</button><button class="btn primary">1</button><button class="btn">›</button><select class="select" style="width:110px"><option>10 条/页</option></select></div></footer></section></main><div id="trendMask" class="mask"><section class="modal"><header class="modal-head"><h3 id="trendTitle">SH拒单率走势</h3><button id="close" class="close">×</button></header><svg class="chart" viewBox="0 0 800 300" preserveAspectRatio="none"><line class="grid" x1="50" y1="40" x2="770" y2="40"/><line class="grid" x1="50" y1="110" x2="770" y2="110"/><line class="grid" x1="50" y1="180" x2="770" y2="180"/><line class="grid" x1="50" y1="250" x2="770" y2="250"/><polyline class="line" points="70,210 210,170 350,190 490,95 630,130 750,70"/><g class="dot"><circle cx="70" cy="210" r="5"/><circle cx="210" cy="170" r="5"/><circle cx="350" cy="190" r="5"/><circle cx="490" cy="95" r="5"/><circle cx="630" cy="130" r="5"/><circle cx="750" cy="70" r="5"/></g><g fill="#909399" font-size="12"><text x="50" y="280">10-01</text><text x="190" y="280">10-07</text><text x="330" y="280">10-13</text><text x="470" y="280">10-19</text><text x="610" y="280">10-25</text><text x="730" y="280">10-31</text></g></svg></section></div><div id="toast" class="toast"></div><script>
const rows=[['659806','2026-10-29 18:27:03',37,'8.33%'],['814367','2026-10-26 14:08:41',18,'5.41%'],['623306','2026-10-21 06:12:18',9,'3.57%']],$=id=>document.getElementById(id),p=new URLSearchParams(location.search);$('date').value=`${p.get('start')||'2026-10-01'} ~ ${p.get('end')||'2026-10-31'}`;$('reason').value=p.get('reason')||'全部';$('scope').textContent=`继承条件：${p.get('trader')||'全部CP方'} · ${p.get('sport')||'全部赛种'}`;if([...$('sport').options].some(o=>o.value===p.get('sport')))$('sport').value=p.get('sport');function detailUrl(sh){const q=new URLSearchParams(p);q.set('merchant',sh);return`Prototype-投注失败统计报表-商户详情.html?${q}`}function draw(){const q=$('merchant').value.trim(),xs=rows.filter(r=>!q||r[0].includes(q));$('body').innerHTML=xs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><div class="op"><button class="btn link" data-trend="${r[0]}">走势图</button><button class="btn link" data-detail="${r[0]}">详情</button></div></td></tr>`).join('');$('count').textContent=`共 ${xs.length} 条`;document.querySelectorAll('[data-trend]').forEach(b=>b.onclick=()=>{$('trendTitle').textContent=`${b.dataset.trend} · 拒单率走势`;$('trendMask').classList.add('open')});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>location.href=detailUrl(b.dataset.detail))}draw();$('back').onclick=()=>history.back();$('query').onclick=draw;$('reset').onclick=()=>{$('merchant').value='';draw()};$('close').onclick=()=>$('trendMask').classList.remove('open');$('trendMask').onclick=e=>{if(e.target===$('trendMask'))$('trendMask').classList.remove('open')};
</script></body></html>
