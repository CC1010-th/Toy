menu.onclick=e=>{const li=e.target.closest('li');if(!li||li.classList.contains('disabled'))return;const t=e.target.closest('.title');if(t){t.parentElement.classList.toggle('open');return}const a=e.target.closest('.item');if(a){e.preventDefault();activate(a.hash.slice(1))}};
addEventListener('hashchange',()=>activate(location.hash.slice(1),false,true));const initialKey=location.hash.slice(1);activate(initialKey,!targets[initialKey],!!targets[initialKey]);
collapseBtn.onclick=()=>document.getElementById('app').classList.toggle('collapsed');
function showToast(message){toast.textContent=message;toast.style.display='block';setTimeout(()=>toast.style.display='none',1600)}
function hidePasswords(){Object.values(passwordTimers).forEach(clearTimeout);revealedPasswords.clear();if(document.getElementById('exportBody'))drawRows(exportRows)}
function closeDeleteConfirm(){deleteConfirm.classList.remove('open');pendingDeleteFile=''}
pageHost.onclick=async e=>{const eye=e.target.closest('.eye');if(eye){const file=eye.dataset.file;clearTimeout(passwordTimers[file]);revealedPasswords.has(file)?revealedPasswords.delete(file):revealedPasswords.add(file);if(revealedPasswords.has(file))passwordTimers[file]=setTimeout(()=>{revealedPasswords.delete(file);if(document.getElementById('exportBody'))drawRows(exportRows)},10000);drawRows(exportRows);return}const copy=e.target.closest('.copy');if(copy){const row=exportRows.find(r=>r.file===copy.dataset.file);if(row?.password){try{await navigator.clipboard.writeText(row.password)}catch{const input=document.createElement('textarea');input.value=row.password;document.body.appendChild(input);input.select();document.execCommand('copy');input.remove()}showToast('解压密码已复制')}return}const download=e.target.closest('.download');if(download&&!download.disabled){const row=exportRows.find(r=>r.file===download.dataset.file);if(row){row.download='已下载';drawRows(exportRows);showToast('下载成功，本任务不可再次下载')}return}const remove=e.target.closest('.remove');if(remove){pendingDeleteFile=remove.dataset.file;deleteConfirm.classList.add('open');cancelDelete.focus();return}if(e.target.id==='queryExport'){const n=fileFilter.value.trim().toLowerCase(),s=statusFilter.value;drawRows(exportRows.filter(r=>(!n||r.file.toLowerCase().includes(n))&&(!s||r.status===s)))}};
cancelDelete.onclick=closeDeleteConfirm;confirmDelete.onclick=()=>{const i=exportRows.findIndex(r=>r.file===pendingDeleteFile);if(i>=0)exportRows.splice(i,1);closeDeleteConfirm();drawRows(exportRows);showToast('删除成功')};
addEventListener('keydown',e=>{if(e.key==='Escape'&&deleteConfirm.classList.contains('open'))closeDeleteConfirm()});
addEventListener('blur',hidePasswords);
document.addEventListener('visibilitychange',()=>{if(document.hidden)hidePasswords()});
</script></body></html>
